title: Finish the ferry terminal's departure board
scenario: |
  A ferry terminal has one departure board. The ticket office posts departure times on it, and the screens on the piers show them. Every part of the program reads `DepartureBoard.Instance`, and every read returns the same board, so a time the office posts is the time every pier screen shows.

  `Post` is done: it sets the departure time of a route, and posting a route again replaces its time. Three pieces are missing.

  `Instance` must return the terminal's board, the same object on every read. The office and the piers start up on different threads, so two of them may read `Instance` for the first time at the same moment, and they must still get one board. Create it with `Lazy<T>`, with a static field initializer or a static constructor, or with a `lock` that looks at the field again inside it, on a `volatile` field. A plain `if` that creates the board when it is missing is not enough.

  No code outside `DepartureBoard` may build a board of its own. The class has no constructor that other code can call, and no public static method that hands out a new board.

  `Show` takes a route and returns the route, `: ` and its time, for example `Island ferry: 09:15`. For a route nobody posted, it returns the route and `: no departure`, for example `Night boat: no departure`.
hints:
  - "`private static readonly Lazy<DepartureBoard> board = new(() => new DepartureBoard());` keeps the board, and `Instance` returns `board.Value`. `Lazy<T>` runs the lambda once, even when two threads ask at the same moment."
  - "Make the constructor `private`. Code inside the class, such as the lambda above, can still call it."
  - "`TryGetValue` on the dictionary tells you whether a route was posted, and gives you its time."
checks:
  every-screen-gets-the-same-board:
    title: Every screen gets the same board
    failures:
      noSharedMember: "`{{owner}}` has no public static `{{member}}` property to read."
      sharedIsNull: "`{{owner}}.{{member}}` returned null."
      sharedWrongType: "`{{owner}}.{{member}}` returned a `{{actual}}`, not a `{{owner}}`."
      notSameObject: "Three reads of `{{owner}}.{{member}}` did not all return the same object, so two screens can show different boards."
  posted-time-shows-on-every-screen:
    title: A posted time shows on every screen
    failures:
      noSharedMember: "`{{owner}}` has no public static `{{member}}` property to read."
      sharedIsNull: "`{{owner}}.{{member}}` returned null."
      sharedWrongType: "`{{owner}}.{{member}}` returned a `{{actual}}`, not a `{{owner}}`."
      postNotShown: "The office posted Test ferry A at 07:05, and a pier screen showed \"{{actual}}\". Expected \"Test ferry A: 07:05\"."
      repostNotShown: "The office moved Test ferry A to 07:30, and a pier screen showed \"{{actual}}\". Expected \"Test ferry A: 07:30\"."
  unposted-route-has-no-departure:
    title: A route nobody posted has no departure
    failures:
      noSharedMember: "`{{owner}}` has no public static `{{member}}` property to read."
      sharedIsNull: "`{{owner}}.{{member}}` returned null."
      sharedWrongType: "`{{owner}}.{{member}}` returned a `{{actual}}`, not a `{{owner}}`."
      wrongUnposted: "A route nobody posted showed \"{{actual}}\". Expected \"Test ferry never posted: no departure\"."
  no-second-board:
    title: No code outside the class can build a board
    failures:
      constructorNotPrivate: "`{{owner}}` has a constructor that code outside the class can call, so anyone can build a second board."
      staticMakerTakesParameters: "`{{owner}}.{{method}}` hands out a `{{owner}}` and takes parameters, so callers can end up with different boards."
      staticMakerNew: "Two calls to `{{owner}}.{{method}}` returned different boards."
  board-is-created-safely:
    title: The board is created safely when two threads ask at once
    failures:
      lazyNotSafe: "`{{owner}}` creates its `Lazy` in a mode that is not thread-safe, so two threads reading at the same moment can each build a board."
      lazyMayBuildTwice: "`{{owner}}` creates its `Lazy` in `PublicationOnly` mode, which may build the board more than once when two threads ask at the same moment."
      typeNotFound: "`{{type}}` was not found in the source."
      nothingKept: "`{{owner}}` keeps no static reference to its own board, so there is nothing for every read to return."
      createdWithoutGuard: "`{{owner}}` sets `{{field}}` outside a `lock` and outside its static setup, so two threads reading at the same moment can each build a board."
      notCheckedInsideLock: "Inside its `lock`, `{{owner}}` sets `{{field}}` without looking whether another thread already did, so the second thread through builds another board."
      readOutsideLock: "`{{owner}}` reads `{{field}}` outside its `lock`, and the field is not `volatile`, so another thread can see a board that is not fully built."
