title: A spell-check word list for a notes app
scenario: |
  A notes app underlines words it does not know. Its words come from a big file, so the app must open fast and read the file only when spell-checking first needs it.
  - `WordFile.Read()` returns the words `the`, `lantern`, `glows`, `at` and `night`, in that order, and each call adds 1 to `WordFile.Reads`, which starts at 0.
  - `WordList.Default` hands every caller the same list, so a word learned through it is known everywhere from then on.
  - Nothing touches the file until `Default` is first used. Then the file is read, and that read is the last one for the run. Starting the program, or working with other classes, leaves `WordFile.Reads` at 0.
  - `Knows` says whether a word is in the list, ignoring upper and lower case, so `The` and `QUOKKA` match `the` and `quokka`. `Learn` adds a word.
  - A `NoteEditor` is created without arguments. `Mark` takes a text whose words are separated by single spaces and returns it with every word the list does not know in square brackets, for example `The [lantren] glows`.
  - `WordList` alone decides when a list is built, and no other class can construct one.
  - Spell-checking runs on several threads. If two of them touch `Default` first at the same moment, there is still only one list, and no word is checked against a list that is half loaded.
checks:
  file-waits-for-first-use:
    title: The word file is read on first use, not before
    failures:
      readBeforeFirstUse: "The word file had been read {{reads}} times before anything used `WordList.Default`. Expected 0."
      notReadOnFirstUse: "Using `WordList.Default` did not read the word file through `WordFile.Read()`."
      noSharedMember: "`{{owner}}` has no public static `{{member}}` property to read."
      sharedIsNull: "`{{owner}}.{{member}}` returned null."
      sharedWrongType: "`{{owner}}.{{member}}` returned a `{{actual}}`, not a `{{owner}}`."
  file-read-once:
    title: Every read gives the same list, and the file is read once
    failures:
      noSharedMember: "`{{owner}}` has no public static `{{member}}` property to read."
      sharedIsNull: "`{{owner}}.{{member}}` returned null."
      sharedWrongType: "`{{owner}}.{{member}}` returned a `{{actual}}`, not a `{{owner}}`."
      notSameObject: "Three reads of `{{owner}}.{{member}}` did not all return the same object, so two editors can check against different lists."
      readMoreThanOnce: "After several reads of `Default` and two checked notes, the word file had been read {{reads}} times. Expected once."
  editor-marks-unknown-words:
    title: The editor marks the words it does not know
    failures:
      wrongMarks: "The editor marked \"The lantren glows at nihgt\" as \"{{actual}}\". Expected \"The [lantren] glows at [nihgt]\"."
  learned-word-is-known-everywhere:
    title: A learned word is known everywhere
    failures:
      noSharedMember: "`{{owner}}` has no public static `{{member}}` property to read."
      sharedIsNull: "`{{owner}}.{{member}}` returned null."
      sharedWrongType: "`{{owner}}.{{member}}` returned a `{{actual}}`, not a `{{owner}}`."
      learnedNotSeen: "After quokka was learned, a new editor marked \"the quokka glows\" as \"{{actual}}\". Expected \"the quokka glows\"."
      learnedCaseLost: "After quokka was learned, `Knows(\"QUOKKA\")` returned false."
  no-second-word-list:
    title: No code outside the class can build a word list
    failures:
      constructorNotPrivate: "`{{owner}}` has a constructor that code outside the class can call, so anyone can build a second list and read the file again. Make every constructor private."
      staticMakerTakesParameters: "`{{owner}}.{{method}}` hands out a `{{owner}}` and takes parameters, so callers can end up with different lists."
      staticMakerNew: "Two calls to `{{owner}}.{{method}}` returned different lists."
  word-list-is-created-safely:
    title: The list is created safely, and only when first used
    failures:
      lazyNotSafe: "`{{owner}}` creates its `Lazy` in a mode that is not thread-safe, so two threads reading at the same moment can each build a list."
      lazyMayBuildTwice: "`{{owner}}` creates its `Lazy` in `PublicationOnly` mode, which may build the list more than once when two threads ask at the same moment."
      typeNotFound: "`{{type}}` was not found in the source."
      nothingKept: "`{{owner}}` keeps no static reference to its own list, so there is nothing for every read to return."
      createdWithoutGuard: "`{{owner}}` sets `{{field}}` outside a `lock` and outside its static setup, so two threads reading at the same moment can each build a list. Creation that is safe and waits for first use goes through `Lazy<T>`, a `lock` that looks again inside it, on a `volatile` field, or a static field initializer with an explicit static constructor."
      notCheckedInsideLock: "Inside its `lock`, `{{owner}}` sets `{{field}}` without looking whether another thread already did, so the second thread through builds another list. Creation that is safe and waits for first use goes through `Lazy<T>`, a `lock` that looks again inside it, on a `volatile` field, or a static field initializer with an explicit static constructor."
      readOutsideLock: "`{{owner}}` reads `{{field}}` outside its `lock`, and the field is not `volatile`, so another thread can see a list that is not fully built. Creation that is safe and waits for first use goes through `Lazy<T>`, a `lock` that looks again inside it, on a `volatile` field, or a static field initializer with an explicit static constructor."
      mayBeCreatedEarly: "`{{owner}}` creates `{{field}}` in a static initializer, and the class that holds it has no static constructor, so the runtime may read the file before anything uses the list."
