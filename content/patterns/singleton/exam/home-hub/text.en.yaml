title: The smart home's hub
scenario: |
  A smart home has a wall panel and a voice assistant. Both control the heating and the lights through `HomeHub.Main`, which gives them one simple entry point. What matters most is that they control the same house: when the voice assistant turns the heating up, the panel shows the new value.
  - However often `HomeHub.Main` is read, it is the same hub, so a change made through one read is seen through every other read.
  - `Heating` is the target temperature in degrees. It starts at 20, and `SetHeating` changes it.
  - `SetLights` takes a room and `true` or `false`, and switches the lights in that room. Every room starts with its lights off.
  - `Room` takes a room and returns, for example, `kitchen: lights on, heating 21`.
  - `WallPanel` has a public constructor without parameters. `Show` takes a room and returns `Panel | ` followed by what `HomeHub.Main` returns for it.
  - `VoiceAssistant` has a public constructor without parameters. `Heat` sets the heating through `HomeHub.Main` and returns, for example, `Heating set to 23`. `Lights` takes a room and `true` or `false`, switches them through `HomeHub.Main`, and returns `Lights in kitchen on`, or `off`.
  - A second hub must be impossible to get from anywhere in the program, so the house is only ever controlled through `HomeHub.Main`.
  - The panel and the assistant start together and may ask for the hub for the first time at the same moment. They must still share one hub, built only once and fully set up before either of them uses it.

  Implement the types listed in the Contract.
checks:
  every-read-gives-the-same-hub:
    title: Every read gives the same hub
    failures:
      noSharedMember: "`{{owner}}` has no public static `{{member}}` property to read."
      sharedIsNull: "`{{owner}}.{{member}}` returned null."
      sharedWrongType: "`{{owner}}.{{member}}` returned a `{{actual}}`, not a `{{owner}}`."
      notSameObject: "Three reads of `{{owner}}.{{member}}` did not all return the same object, so the panel and the assistant can control different houses."
  heating-starts-at-20:
    title: The heating starts at 20 degrees
    failures:
      noSharedMember: "`{{owner}}` has no public static `{{member}}` property to read."
      sharedIsNull: "`{{owner}}.{{member}}` returned null."
      sharedWrongType: "`{{owner}}.{{member}}` returned a `{{actual}}`, not a `{{owner}}`."
      wrongStart: "Before anything changed it, `Heating` was {{actual}}. Expected 20."
  voice-change-shows-on-the-panel:
    title: A heating change by voice shows on the panel
    failures:
      noSharedMember: "`{{owner}}` has no public static `{{member}}` property to read."
      sharedIsNull: "`{{owner}}.{{member}}` returned null."
      sharedWrongType: "`{{owner}}.{{member}}` returned a `{{actual}}`, not a `{{owner}}`."
      wrongHeatReply: "The assistant was asked for 23 degrees and replied \"{{actual}}\". Expected \"Heating set to 23\"."
      heatNotShown: "After the assistant set 23 degrees, the panel showed \"{{actual}}\" for Test room. Expected \"Panel | Test room: lights off, heating 23\"."
      heatNotKept: "After the assistant set 23 degrees, `HomeHub.Main.Heating` was {{actual}}. Expected 23."
  lights-are-kept-per-room:
    title: Lights are switched per room and seen on the panel
    failures:
      noSharedMember: "`{{owner}}` has no public static `{{member}}` property to read."
      sharedIsNull: "`{{owner}}.{{member}}` returned null."
      sharedWrongType: "`{{owner}}.{{member}}` returned a `{{actual}}`, not a `{{owner}}`."
      wrongLightsReply: "The assistant was asked to switch on the lights in Test hall and replied \"{{actual}}\". Expected \"Lights in Test hall on\"."
      lightsNotShown: "After the lights in Test hall were switched on, the panel showed \"{{actual}}\" for {{room}}. Expected \"{{expected}}\"."
      lightsStayOn: "After the lights in Test hall were switched off again, the panel showed \"{{actual}}\"."
  no-second-hub:
    title: No code outside the class can build a hub
    failures:
      constructorNotPrivate: "`{{owner}}` has a constructor that code outside the class can call, so the panel and the assistant can each end up with their own house."
      staticMakerTakesParameters: "`{{owner}}.{{method}}` hands out a `{{owner}}` and takes parameters, so callers can end up with different hubs."
      staticMakerNew: "Two calls to `{{owner}}.{{method}}` returned different hubs."
  hub-is-created-safely:
    title: The hub is created safely when two threads ask at once
    failures:
      lazyNotSafe: "`{{owner}}` creates its `Lazy` in a mode that is not thread-safe, so two threads reading at the same moment can each build a hub."
      lazyMayBuildTwice: "`{{owner}}` creates its `Lazy` in `PublicationOnly` mode, which may build the hub more than once when two threads ask at the same moment."
      typeNotFound: "`{{type}}` was not found in the source."
      nothingKept: "`{{owner}}` keeps no static reference to its own hub, so there is nothing for every read to return."
      createdWithoutGuard: "`{{owner}}` sets `{{field}}` outside a `lock` and outside its static setup, so two threads reading at the same moment can each build a hub. Creation that is safe here goes through `Lazy<T>`, a static field initializer or static constructor, or a `lock` that looks again inside it, on a `volatile` field."
      notCheckedInsideLock: "Inside its `lock`, `{{owner}}` sets `{{field}}` without looking whether another thread already did, so the second thread through builds another hub. Creation that is safe here goes through `Lazy<T>`, a static field initializer or static constructor, or a `lock` that looks again inside it, on a `volatile` field."
      readOutsideLock: "`{{owner}}` reads `{{field}}` outside its `lock`, and the field is not `volatile`, so another thread can see a hub that is not fully built. Creation that is safe here goes through `Lazy<T>`, a static field initializer or static constructor, or a `lock` that looks again inside it, on a `volatile` field."
