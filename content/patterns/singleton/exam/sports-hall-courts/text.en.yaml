title: Court bookings at a sports hall
scenario: |
  A sports hall rents its courts by the hour. Teams book at the reception desk or in the members' app, and both must see the same bookings, so a court booked at one is taken at the other.
  - Every read of `CourtDiary.Shared` returns the same diary, and the reception desk and the app both book through it.
  - `Book` takes a court number, an hour and a team. If the slot is free, or already held by the same team, it books it and returns `Lions: court 2 at 18:00 booked`. If another team holds it, it changes nothing and returns `Bears: court 2 at 18:00 taken by Lions`. The hour is written as it is, followed by `:00`, so 9 gives `9:00`.
  - `Holder` takes a court and an hour and returns the team that holds the slot, or `free`.
  - `Reception` and `MemberApp` each have a public constructor without parameters. Their `Request` takes a court, an hour and a team, books through `CourtDiary.Shared`, and returns `Reception | ` or `App | ` followed by what the diary returned.
  - No code outside `CourtDiary` can build a diary. It has no constructor that other code can call, and no public static method that hands out a new one.
  - The desk and the app run on different threads, and two of them may read `Shared` for the first time at the same moment. They must still get one diary, so it is created through `Lazy<T>`, a static field initializer or a static constructor, or a `lock` that looks at the field again inside it, on a `volatile` field. A plain `if` that creates the diary when it is missing is not enough.

  Implement the types listed in the Contract.
checks:
  every-read-gives-the-same-diary:
    title: Every read gives the same diary
    failures:
      noSharedMember: "`{{owner}}` has no public static `{{member}}` property to read."
      sharedIsNull: "`{{owner}}.{{member}}` returned null."
      sharedWrongType: "`{{owner}}.{{member}}` returned a `{{actual}}`, not a `{{owner}}`."
      notSameObject: "Three reads of `{{owner}}.{{member}}` did not all return the same object, so the desk and the app can book in different diaries."
  booking-blocks-the-other-desk:
    title: A slot booked at one desk is taken at the other
    failures:
      noSharedMember: "`{{owner}}` has no public static `{{member}}` property to read."
      sharedIsNull: "`{{owner}}.{{member}}` returned null."
      sharedWrongType: "`{{owner}}.{{member}}` returned a `{{actual}}`, not a `{{owner}}`."
      wrongBooking: "Reception booked court 91 at 18 for Test team A and returned \"{{actual}}\". Expected \"Reception | Test team A: court 91 at 18:00 booked\"."
      doubleBooked: "Test team B then asked for the same slot in the app and got \"{{actual}}\". Expected \"App | Test team B: court 91 at 18:00 taken by Test team A\"."
      wrongHolder: "The diary named \"{{actual}}\" as the holder of court 91 at 18. Expected \"Test team A\"."
  same-team-can-book-again:
    title: A team can book its own slot again
    failures:
      rebookRefused: "Test team C booked court 92 at 9 in the app, then again at reception, and got \"{{actual}}\". Expected \"Reception | Test team C: court 92 at 9:00 booked\"."
  unbooked-slot-is-free:
    title: A slot nobody booked is free
    failures:
      noSharedMember: "`{{owner}}` has no public static `{{member}}` property to read."
      sharedIsNull: "`{{owner}}.{{member}}` returned null."
      sharedWrongType: "`{{owner}}.{{member}}` returned a `{{actual}}`, not a `{{owner}}`."
      notFree: "The holder of court 93 at 7, which nobody booked, was \"{{actual}}\". Expected \"free\"."
  no-second-diary:
    title: No code outside the class can build a diary
    failures:
      constructorNotPrivate: "`{{owner}}` has a constructor that code outside the class can call, so anyone can build a second diary and book the same court twice."
      staticMakerTakesParameters: "`{{owner}}.{{method}}` hands out a `{{owner}}` and takes parameters, so callers can end up with different diaries."
      staticMakerNew: "Two calls to `{{owner}}.{{method}}` returned different diaries."
  diary-is-created-safely:
    title: The diary is created safely when two threads ask at once
    failures:
      lazyNotSafe: "`{{owner}}` creates its `Lazy` in a mode that is not thread-safe, so two threads reading at the same moment can each build a diary."
      nothingKept: "`{{owner}}` keeps no static reference to its own diary, so there is nothing for every read to return."
      createdWithoutGuard: "`{{owner}}` sets `{{field}}` outside a `lock` and outside its static setup, so two threads reading at the same moment can each build a diary."
      notCheckedInsideLock: "Inside its `lock`, `{{owner}}` sets `{{field}}` without looking whether another thread already did, so the second thread through builds another diary."
      readOutsideLock: "`{{owner}}` reads `{{field}}` outside its `lock`, and the field is not `volatile`, so another thread can see a diary that is not fully built."
