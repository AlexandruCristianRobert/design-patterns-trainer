actors:
  - id: app
    name: app
    role: concrete
  - id: board
    name: board
    role: primary
  - id: cp
    name: cp
    role: concrete
  - id: hist
    name: hist
    role: concrete
steps:
  - id: save
    call: { from: app, to: board, label: "Save()" }
    code: [25, 25]
  - id: made
    call: { from: board, to: cp, label: "new(copy)" }
    state:
      cp: { holds: "4 7 . . . . . . ." }
    code: [25, 25]
  - id: keep
    call: { from: app, to: hist, label: "Push(cp)" }
    code: [45, 45]
  - id: guess
    state:
      board: { line: "4 7 9 9 . . . . ." }
    code: [21, 21]
  - id: pop
    call: { from: app, to: hist, label: "Pop()" }
    code: [47, 51]
  - id: restore
    call: { from: app, to: board, label: "Restore(cp)" }
    code: [27, 30]
  - id: back
    state:
      board: { line: "4 7 . . . . . . ." }
    code: [30, 30]
