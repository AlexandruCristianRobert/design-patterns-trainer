title: Stop a synth's saved patches changing behind its back
scenario: |
  A small synthesizer has a cutoff knob and a sequence of notes, such as `C` and `G`, that it plays in a loop. `Describe()` shows both, such as `cutoff 40, notes C G`. `Save()` gives a `Patch`, the numbered slots of `PatchBank` keep patches, and `Restore(patch)` brings a sound back.

  Players report a bug: they save a patch, add a note and recall the patch, and the new note is still there. The cause is that `Save()` hands the synth's own list of notes to the patch, and `Restore` takes the patch's list as the synth's own. On top of that, `Patch` has public fields, so any code can read a saved sound and change it. Refactor it:
  - `Synth` keeps a public `Save()`, without parameters, that returns a patch of the sound as it is now: an object of a class or record you write. It keeps a public `Restore(patch)` that takes what `Save()` returns and puts the sound back exactly as it was when that patch was saved.
  - A saved patch never changes: notes added after saving, or after a restore, do not reach it, so it can be restored again and again.
  - Only `Synth` can look inside a saved patch: keep `Patch` public with only `internal` members, or use a private record nested in `Synth` behind an empty interface. Either way it is not also a list. `Synth` itself has no public field or property.

  `PatchBank` still stores and recalls patches by slot. `Demo.Run()` stores two patches and recalls them. Its output must stay exactly the same, line for line.
hints:
  - "`Save()` should copy the list, such as `[.. notes]`, and `Restore` should copy the patch's notes back into the synth's own list with `notes.Clear()` and `notes.AddRange(...)`, so the two never share one."
  - "To keep `Patch` as the type the bank stores, give it an `internal` constructor and make its members `internal` and read-only, such as `internal int Cutoff { get; }`. A nested `private` record behind an empty public interface works too."
  - "If you change the type that `Save()` returns, change `PatchBank` to keep that type, and `Demo` stays as it is."
checks:
  output-unchanged:
    title: Program output is unchanged
    failures:
      outputChanged: "Line {{line}} of the output changed. Expected \"{{expected}}\", got \"{{actual}}\"."
  restore-brings-back-the-saved-sound:
    title: Restore brings back the sound exactly as it was saved
    failures:
      noSave: "`Synth` has no public `Save()` without parameters that returns a saved patch."
      savedNull: "`Save()` returned null. Return a new saved patch of the sound."
      noRestore: "`Synth` has no public `Restore` with one parameter that takes the `{{type}}` that `Save()` returned."
      wrongSound: "After {{step}}, the synth showed \"{{actual}}\". Expected \"{{expected}}\": `Restore` puts back exactly the sound as it was when the patch was saved."
  later-changes-do-not-reach-a-saved-patch:
    title: Later changes do not reach a saved patch, so it can be restored again
    failures:
      noSave: "`Synth` has no public `Save()` without parameters that returns a saved patch."
      savedNull: "`Save()` returned null. Return a new saved patch of the sound."
      noRestore: "`Synth` has no public `Restore` with one parameter that takes the `{{type}}` that `Save()` returned."
      wrongSound: "After {{step}}, the synth showed \"{{actual}}\". Expected \"{{expected}}\": the patch must hold its own copy of the notes, and `Restore` must copy them back rather than share the list."
  nothing-else-can-read-a-saved-patch:
    title: Only the synth can look inside a saved patch
    failures:
      publicField: "`{{type}}` has the public field `{{field}}`. Keep the sound in private fields, so only the synth changes it."
      publicProperty: "`{{type}}` has the public property `{{property}}`, so code outside could read the sound through it. Remove it: only `Save()` should copy the sound out, inside a saved patch."
      foreignType: "A saved patch (`{{type}}`) is also a `{{other}}`, which is not a type you wrote, so code outside could read the sound through it. Inherit only from your own classes and implement only your own interfaces."
      noSave: "`Synth` has no public `Save()` without parameters that returns a saved patch."
      savedNull: "`Save()` returned null. Return a new saved patch of the sound."
      publicInside: "`{{type}}`, which a saved patch is, can be named outside `Synth` and has the public member `{{member}}`, so any code could read the sound. Make the member private or internal, or make `{{type}}` a private class or record nested in `Synth`."
