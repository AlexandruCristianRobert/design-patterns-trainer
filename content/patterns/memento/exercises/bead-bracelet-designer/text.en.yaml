title: Finish the save button of a bracelet designer
scenario: |
  A craft shop's app lets customers design a bead bracelet. Before trying out other colours, they save the bracelet, and if they don't like the result, they go back. `Bracelet` keeps its beads in a private list. `Add(colour)` threads a bead at the end, `Recolour(position, colour)` swaps the bead at a position, counting from 0, and `Show()` gives the beads in order, such as `red blue red`. `DesignHistory` keeps the saved bracelets with `Keep(saved)` and gives back the last one with `TakeLast()`. It only knows `ISavedBracelet`, an empty interface, so it can hold a saved bracelet but not look inside.

  `ISavedBracelet`, `DesignHistory` and the first three methods of `Bracelet` are finished, so leave them as they are. Finish the rest:
  - `Save()` returns a new saved bracelet that holds a copy of the beads as they are now.
  - `Restore(saved)` puts the bracelet back exactly as it was when `saved` was made, whatever came after.
  - A saved bracelet never changes: neither the changes made to the bracelet after saving nor those made after a restore reach it, so the same saved bracelet can be restored again and again.
  - Nothing outside `Bracelet` can read a saved bracelet. No type of ours that it is (its own class or record, a class it inherits from, or an interface it implements) may be public all the way out and have a public field (constants aside) or a public property. The private class `SavedBeads`, nested in `Bracelet`, may have public members, because no code outside `Bracelet` can name it, and so may an `internal` type.
  - `Bracelet` keeps its beads to itself: it has no public field (constants aside) and no public property with a public `set` or `init`.
hints:
  - "Give `SavedBeads` a constructor that takes the beads and a property that holds them, such as `private sealed class SavedBeads(string[] beads) : ISavedBracelet { public string[] Beads { get; } = beads; }`."
  - "`Save()` can return `new SavedBeads(beads.ToArray())`. Passing the list itself would let later changes to the bracelet reach the saved copy."
  - "In `Restore`, cast with `(SavedBeads)saved`, then `beads.Clear()` and `beads.AddRange(...)`. Copying the items back, rather than keeping the saved array as the bracelet's own, keeps the saved bracelet as it was."
checks:
  restore-brings-back-the-saved-beads:
    title: Restore brings back the beads exactly as they were saved
    failures:
      wrongBeads: "After {{step}}, the bracelet showed \"{{actual}}\". Expected \"{{expected}}\": `Restore` puts back exactly the beads the bracelet had when it was saved."
  later-changes-do-not-reach-a-saved-bracelet:
    title: Later changes do not reach a saved bracelet, so it can be restored again
    failures:
      wrongBeads: "After {{step}}, the bracelet showed \"{{actual}}\". Expected \"{{expected}}\": the saved bracelet must hold its own copy of the beads, and `Restore` must copy them back rather than share them."
  nothing-else-can-read-a-saved-bracelet:
    title: Nothing outside the bracelet can read a saved bracelet
    failures:
      notOurs: "`Save()` returned a `{{type}}`, which is not a type of ours. Return an object of a class or record you write."
      publicInside: "`{{type}}`, which a saved bracelet is, is public and has the public member `{{member}}`, so any code could read the beads. Make the member private or internal, or make `{{type}}` a private class nested in `Bracelet`."
  the-bracelet-keeps-its-beads-to-itself:
    title: The bracelet keeps its beads to itself
    failures:
      publicField: "`{{type}}` has the public field `{{field}}`. Keep the beads in a private field, so only the bracelet can change them."
      publicSetter: "`{{type}}` has the property `{{property}}` with a public `set` or `init`. Only the bracelet should change its beads."
