title: Finish the save button of a bracelet designer
scenario: |
  A craft shop's app lets customers design a bead bracelet. Before trying out more beads, they save the bracelet, and if they don't like the result, they go back. `Bracelet` keeps its beads in a private list: `Add(colour)` threads a bead at the end, and `Show()` gives the beads in order, such as `red blue red`. `DesignHistory` keeps saved bracelets with `Keep(saved)` and gives back the last one with `TakeLast()`. It only knows `ISavedBracelet`, an empty interface, so it can hold a saved bracelet but not look inside.

  `ISavedBracelet`, `DesignHistory`, `Add` and `Show` are finished. Finish the rest:
  - `Save()` returns a new saved bracelet that holds a copy of the beads as they are now.
  - `Restore(saved)` puts the bracelet back exactly as it was when `saved` was made.
  - A saved bracelet never changes: beads added after saving, or after a restore, do not reach it, so it can be restored again and again.
  - Nothing outside `Bracelet` can read the beads: `Bracelet` has no public field or public setter, and a saved bracelet has no public field or property, unless its class is private (like `SavedBeads`, nested in `Bracelet`) or `internal`.
hints:
  - "Give `SavedBeads` a constructor that takes the beads and a property that holds them: `private sealed class SavedBeads(string[] beads) : ISavedBracelet { public string[] Beads { get; } = beads; }`."
  - "`Save()` can return `new SavedBeads([.. beads])`. Passing the list itself would let later beads reach the saved copy."
  - "In `Restore`, cast with `(SavedBeads)saved`, then call `beads.Clear()` and `beads.AddRange(...)` with its beads, so the saved copy is copied back rather than shared."
checks:
  restore-brings-back-the-saved-beads:
    title: Restore brings back the beads exactly as they were saved
    failures:
      wrongBeads: "After {{step}}, the bracelet showed \"{{actual}}\". Expected \"{{expected}}\": `Restore` puts back exactly the beads the bracelet had when it was saved."
  later-changes-do-not-reach-a-saved-bracelet:
    title: Later changes do not reach a saved bracelet, so it can be restored again
    failures:
      wrongBeads: "After {{step}}, the bracelet showed \"{{actual}}\". Expected \"{{expected}}\": the saved bracelet must hold its own copy of the beads, and `Restore` must copy them back rather than share them."
  nothing-else-can-read-a-saved-bracelet:
    title: Nothing outside the bracelet can read its beads
    failures:
      publicField: "`{{type}}` has the public field `{{field}}`. Keep the beads in a private field, so only the bracelet can change them."
      publicSetter: "`{{type}}` has the property `{{property}}` with a public `set` or `init`. Only the bracelet should change its beads."
      publicInside: "`{{type}}`, which a saved bracelet is, is public and has the public member `{{member}}`, so any code could read the beads. Make the member private or internal, or make `{{type}}` a private class nested in `Bracelet`."
