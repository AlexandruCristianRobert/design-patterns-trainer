title: Let a cover letter keep its own versions
scenario: |
  A job site helps people write cover letters. A `CoverLetter` has a greeting and some paragraphs, and `Read()` gives it on one line, such as `Dear hiring team, / I would like to apply.`. While writing, people keep versions of the letter and go back to them.

  It works, but `VersionsPanel` does the copying: it reads the letter's public fields `Greeting` and `Paragraphs` and writes them back. So any code can change the letter, and every new part of the letter means changing the panel too. Refactor it so that the letter copies itself:
  - Give `CoverLetter` a public `Save()`, without parameters, that returns a version of the letter as it is now: an object of a class or record you write. Give it a public `Restore(version)` that takes what `Save()` returns and puts the letter back exactly as it was when that version was saved.
  - A saved version never changes: paragraphs added after saving, or after a restore, do not reach it, so it can be restored again and again.
  - Only `CoverLetter` can look inside a saved version: make it a private record nested in `CoverLetter`, behind an empty interface you add (an `internal` type works too, but not one that is also a list). `CoverLetter` itself has no public field or property.
  - `VersionsPanel` only keeps the saved versions and gives back the last one.

  `Demo.Run()` keeps two versions, edits the letter and goes back twice. Its output must stay exactly the same, line for line.
hints:
  - "Add an empty interface for the panel to hold, such as `public interface ILetterVersion { }`. `Save()` returns one and `Restore` takes one, and `VersionsPanel` keeps a `Stack<ILetterVersion>` with `Keep(version)` and `Back()`."
  - "Inside `CoverLetter`, a nested `private sealed record Version(string Greeting, string[] Paragraphs) : ILetterVersion;` can hold the copy. `Save()` passes `[.. paragraphs]`, so later edits do not reach it."
  - "`Restore` casts with `(Version)version`, sets the greeting, and copies the paragraphs into the letter's own list with `Clear()` and `AddRange(...)`. Then make both fields private, and change `Demo` to call `panel.Keep(letter.Save())` and `letter.Restore(panel.Back())`."
checks:
  output-unchanged:
    title: Program output is unchanged
    failures:
      outputChanged: "Line {{line}} of the output changed. Expected \"{{expected}}\", got \"{{actual}}\"."
  restore-brings-back-the-saved-letter:
    title: Restore brings back the letter exactly as it was saved
    failures:
      noSave: "`CoverLetter` has no public `Save()` without parameters that returns a saved version."
      savedNull: "`Save()` returned null. Return a new saved version of the letter."
      noRestore: "`CoverLetter` has no public `Restore` with one parameter that takes the `{{type}}` that `Save()` returned."
      wrongLetter: "After {{step}}, the letter read \"{{actual}}\". Expected \"{{expected}}\": `Restore` puts back exactly the letter as it was when the version was saved."
  later-changes-do-not-reach-a-saved-version:
    title: Later edits do not reach a saved version, so it can be restored again
    failures:
      noSave: "`CoverLetter` has no public `Save()` without parameters that returns a saved version."
      savedNull: "`Save()` returned null. Return a new saved version of the letter."
      noRestore: "`CoverLetter` has no public `Restore` with one parameter that takes the `{{type}}` that `Save()` returned."
      wrongLetter: "After {{step}}, the letter read \"{{actual}}\". Expected \"{{expected}}\": the version must hold its own copy of the paragraphs, and `Restore` must copy them back rather than share them."
  nothing-else-can-read-a-saved-version:
    title: Only the letter can look inside a saved version
    failures:
      publicField: "`{{type}}` still has the public field `{{field}}`. Make it private: the letter saves and restores itself, so nobody else needs it."
      publicProperty: "`{{type}}` has the public property `{{property}}`, so code outside could read the text through it. Remove it: only `Save()` should copy the text out, inside a saved version."
      foreignType: "A saved version (`{{type}}`) is also a `{{other}}`, which is not a type you wrote, so code outside could read the text through it. Inherit only from your own classes and implement only your own interfaces."
      noSave: "`CoverLetter` has no public `Save()` without parameters that returns a saved version."
      savedNull: "`Save()` returned null. Return a new saved version of the letter."
      publicInside: "`{{type}}`, which a saved version is, can be named outside `CoverLetter` and has the public member `{{member}}`, so any code could read the text. Make the member private or internal, or make `{{type}}` a private class or record nested in `CoverLetter`."
