title: Try out outfits for the week and go back
scenario: |
  A wardrobe app plans what to wear on each day of the week. Before trying out other outfits, the user saves the week, and the app can go back to the weeks saved before. Build it:
  - `WeekPlan` has a public constructor without parameters and starts with nothing planned. `Wear(day, outfit)` plans an outfit for a day, such as `Mon`, replacing the one planned before. `OutfitOn(day)` gives the outfit planned for that day, or `nothing` when there is none.
  - `Save()` returns a new saved week with the outfits as they are now, and `Restore(saved)` puts the plan back exactly as it was when `saved` was made: a day planned after saving is back to `nothing`.
  - A saved week never changes: changes made to the plan after saving, or after a restore, do not reach it, so it can be restored again and again.
  - `ISavedWeek` is an empty interface: what `Save()` returns and `Restore` takes. Only `WeekPlan` can look inside a saved week: make it a private record nested in `WeekPlan` that implements only `ISavedWeek` (an `internal` type works too, but not one that is also a dictionary). `WeekPlan` itself has no public field or property.
  - `PlanHistory` has a public constructor without parameters. `Keep(saved)` keeps a saved week, and `Back()` gives back the last week it kept and forgets it, so calling it again gives the one before.
hints:
  - "Keep the outfits in a private `Dictionary<string, string>`. `OutfitOn` can be `outfits.GetValueOrDefault(day, \"nothing\")`."
  - "`Save()` passes a new dictionary, `new Dictionary<string, string>(outfits)`, to a saved-week class that is `private` nested or `internal`. `Restore` clears the plan's own dictionary and copies the saved outfits into it, so the two never share one."
  - "`PlanHistory` can keep a `Stack<ISavedWeek>`: `Keep` pushes and `Back` pops."
checks:
  restore-brings-back-the-saved-week:
    title: Restore brings back the week exactly as it was saved
    failures:
      wrongOutfit: "After {{step}}, `OutfitOn(\"{{day}}\")` gave \"{{actual}}\". Expected \"{{expected}}\": `Restore` puts back exactly the outfits the plan had when the week was saved."
  later-changes-do-not-reach-a-saved-week:
    title: Later changes do not reach a saved week, so it can be restored again
    failures:
      wrongOutfit: "After {{step}}, `OutfitOn(\"{{day}}\")` gave \"{{actual}}\". Expected \"{{expected}}\": the saved week must hold its own copy of the outfits, and `Restore` must copy them back rather than share them."
  the-history-gives-back-the-last-week-first:
    title: The history gives back the last kept week first
    failures:
      wrongBack: "After keeping 3 weeks, call number {{backs}} to `Back()` did not give the week kept as number {{expected}}: `Back()` gives the last kept week and forgets it."
  nothing-else-can-read-a-saved-week:
    title: Only the plan can look inside a saved week
    failures:
      publicField: "`{{type}}` has the public field `{{field}}`. Keep the outfits in a private field, so only the plan changes them."
      publicProperty: "`{{type}}` has the public property `{{property}}`, so code outside could read the outfits through it. Remove it: only `Save()` should copy the outfits out, inside a saved week."
      foreignType: "A saved week (`{{type}}`) is also a `{{other}}`, which is not a type you wrote, so code outside could read the outfits through it. Inherit only from your own classes and implement only your own interfaces."
      publicInside: "`{{type}}`, which a saved week is, can be named outside `WeekPlan` and has the public member `{{member}}`, so any code could read the outfits. Make the member private or internal, or make `{{type}}` a private class or record nested in `WeekPlan`."
