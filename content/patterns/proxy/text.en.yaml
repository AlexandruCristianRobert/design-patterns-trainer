intent: "Put a stand-in with the same interface in front of an object, so that the stand-in can decide whether and when the real object is used."
structure:
  page: "The client. It shows the floor plan of a listing. It holds an IFloorPlan and calls Render on it, and it does not know whether that is the real scan or a stand-in."
  subject: "The interface that the page uses, with one method, Render. The real scan and the proxy both implement it, and that is why the page cannot tell them apart."
  proxy: "The proxy. It implements IFloorPlan, so it can be used wherever a floor plan is expected. It checks whether the viewer may see the plan, and creates the real scan the first time Render is called, not before."
  scan: "The real subject. Loading it is the expensive part, and the static Loaded count makes that visible. It does the real work in Render and knows nothing about the proxy."
scene:
  open: "The page is given a proxy for the listing at 12 Elm Street. The proxy has not loaded anything, so no scan exists yet, and the count of loaded scans is 0."
  show: "The page shows the plan. It calls Render on what it holds (page asks proxy), as it would on any floor plan."
  check: "The proxy checks that the viewer may see this plan. This listing is open to viewers, so the check passes."
  load: "The proxy has no scan yet, so this is the first time it is needed. The proxy creates it now (scan)."
  loaded: "Creating the scan is the expensive step. The count of loaded scans is now 1."
  render: "The proxy passes the call on to the real scan."
  back: "The scan returns the text of the plan: Floor plan of 12 Elm Street: 3 rooms."
  answer: "The proxy hands that text back to the page, which prints it. The page got what it asked for and never saw the proxy at work."
  again: "The page shows the plan a second time. It makes the same call to the same proxy."
  kept: "The proxy already holds its scan, so it creates nothing. The count of loaded scans stays at 1."
  direct: "The call goes straight to the scan that is already loaded. The page gets the same text again."
  refuse: "A second listing, at 9 Mill Lane, is not open to viewers. Its page (page) makes the same Render call on its own proxy (proxy), which stands for that listing."
  denied: "The check fails, so this proxy answers by itself: Plans of 9 Mill Lane are not available. It never creates a scan for this listing, and the count of loaded scans stays at 1."
lookalikes:
  decorator: "Decorator also has the same interface and holds one object, but it adds behaviour and is meant to be stacked in layers. Proxy controls access to its object, such as creating it late or checking permission, and is usually used on its own."
  adapter: "Adapter gives an object a different interface so that it fits code that expects another one. Proxy keeps exactly the same interface as the real object."
  facade: "Facade gives a group of classes one simpler interface, and has its own, new interface. Proxy stands in front of one object and keeps that object's interface."
