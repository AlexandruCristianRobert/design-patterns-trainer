title: Finish the pixel-art editor's undo
scenario: |
  A small pixel-art editor paints on a `Canvas`: one row of pixels, numbered from 0, that all start `white`. `Get(pixel)` and `Set(pixel, colour)` read and paint one pixel, and `ToString()` shows the colours in order, such as `red white blue`. Every tool is a step object: an `IPaintStep` with `Do()` and `Undo()`. `History` runs the steps and keeps them, so that the user can undo them. `Canvas`, `IPaintStep` and `PaintPixel` are finished, so leave them as they are. `PaintPixel` is the model: `Do` keeps the colour the pixel had, then paints it, and `Undo` paints the kept colour back. `SwapPixels(canvas, first, second)` gives each of the two pixels the other's colour, and its `Do` is finished too.

  Finish the rest:
  - `SwapPixels.Undo` puts both pixels back as they were.
  - `History.Run(step)` does the step and keeps it. `History.Undo()` undoes the last step it kept and forgets it, so calling it again undoes the step before, and so on.

  `History` works with any `IPaintStep`, even a kind of step it has never seen: it only calls `Do` and `Undo`, and it never names `PaintPixel`, `SwapPixels` or `Canvas`.
hints:
  - "Swapping the same two pixels twice puts them back, so `SwapPixels.Undo` can simply call `Do()` again."
  - "`History` already has a `Stack<IPaintStep>`. `Run` calls `step.Do()` and then `done.Push(step)`."
  - "`History.Undo` takes the top step off the stack and undoes it: `if (done.TryPop(out var step)) step.Undo();`."
checks:
  swap-pixels-swaps-and-undoes:
    title: SwapPixels swaps two pixels, and its Undo puts them back
    failures:
      wrongSwap: "On the canvas \"red white blue\", swapping pixels 0 and 2 gave \"{{actual}}\". Expected \"{{expected}}\"."
      swapNotUndone: "After a SwapPixels and its Undo, the canvas was \"{{actual}}\". Expected \"{{expected}}\"."
  history-undoes-the-last-step-first:
    title: History runs the steps, and undoes them one at a time, the last one first
    failures:
      wrongRun: "On the canvas \"red white blue\", running a PaintPixel, a SwapPixels and another PaintPixel gave \"{{actual}}\". Expected \"{{expected}}\"."
      wrongUndo: "After {{undos}} undo(s), the canvas was \"{{actual}}\". Expected \"{{expected}}\": each Undo takes back one step, the last one first."
  history-runs-any-step:
    title: History runs and undoes any IPaintStep, even one it has never seen
    failures:
      wrongCalls: "Running two new steps and then undoing twice called: {{actual}}. Expected {{expected}}."
  history-knows-only-the-interface:
    title: History knows only IPaintStep
    failures:
      holdsConcrete: "`History` has a field `{{field}}` that holds a `{{type}}`. It should keep only `IPaintStep`s."
      namesConcrete: "`History` names `{{type}}`. It should only call `Do` and `Undo` on an `IPaintStep`, and never know which kind of step it has."
