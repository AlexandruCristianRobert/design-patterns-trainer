title: Undo on a wedding seating plan
scenario: |
  A couple plans who sits at which table at their wedding, and they change their minds a lot. Every change should be an object that can undo itself, so that they can take changes back one at a time. Build it as Command:
  - `SeatingPlan` has a public constructor without parameters. `TableOf(guest)` returns the guest's table number, or 0 when the guest is not seated. `Place(guest, table)` puts the guest at that table, and `Remove(guest)` unseats them.
  - `PlanChange` is an interface or an abstract class with `void Do()` and `void Undo()`.
  - `SeatGuest(SeatingPlan plan, string guest, int table)` is a `PlanChange` that seats a guest who is not seated yet. Its `Undo` unseats the guest again.
  - `MoveGuest(SeatingPlan plan, string guest, int table)` is a `PlanChange` that moves a seated guest to another table. Its `Undo` puts the guest back at the table they left.
  - `ChangeLog` has a public constructor without parameters. `Run(PlanChange change)` does the change and keeps it. `Undo()` undoes the last change it kept and forgets it, so calling it again goes one change further back.
  - `ChangeLog` works with any `PlanChange`: it never names `SeatGuest`, `MoveGuest` or `SeatingPlan`, and it has no field of those types.

  So seating Ana at table 1, then moving her to table 3 and undoing twice leaves Ana not seated.
hints:
  - "`SeatGuest.Undo` is just `plan.Remove(guest)`. `MoveGuest` has no such opposite: in `Do`, keep `plan.TableOf(guest)` in a field before you move the guest, and in `Undo`, `Place` the guest back at that table."
  - "`ChangeLog` needs one field: a `Stack<PlanChange>`. `Run` calls `change.Do()` and pushes it."
  - "`ChangeLog.Undo` pops the top change and calls its `Undo()`: `if (done.TryPop(out var change)) change.Undo();`."
checks:
  each-change-does-and-undoes-itself:
    title: Each change does its work, and its Undo puts the plan back exactly
    failures:
      wrongDo: "With Ana at table 1 and Ben at table 2, `Do` on `{{change}}` left \"{{actual}}\". Expected \"{{expected}}\"."
      wrongUndo: "After `Do` and `Undo` on `{{change}}`, the plan was \"{{actual}}\". Expected \"{{expected}}\": exactly as it was before."
  undo-goes-back-one-change-at-a-time:
    title: The log runs the changes, and undoes them one at a time, the last one first
    failures:
      wrongRun: "After seating Ana at 1 and Ben at 2, then moving Ana to 3 and Ben to 1 through the log, the plan was \"{{actual}}\". Expected \"{{expected}}\"."
      wrongUndo: "After four changes and {{undos}} undo(s), the plan was \"{{actual}}\". Expected \"{{expected}}\": each Undo takes back one change, the last one first."
  the-log-knows-only-plan-changes:
    title: ChangeLog knows only PlanChange
    failures:
      notAChange: "`{{type}}` is not a `PlanChange`."
      logHoldsConcrete: "`ChangeLog` has a field `{{field}}` that holds a `{{type}}`. It should keep only `PlanChange`s."
      logNamesConcrete: "`ChangeLog` names `{{type}}`. It should only call `Do` and `Undo` on a `PlanChange`, and never know which kind of change it has."
