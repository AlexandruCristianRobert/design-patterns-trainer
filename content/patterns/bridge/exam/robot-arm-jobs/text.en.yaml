title: Jobs for two makers' robot arms
scenario: |
  A workshop is writing new software for its robot arms. It has arms from two makers, and each maker's controller expects its instructions in its own format: one wants millimetres in capitals, the other a function call in centimetres. The workshop will buy arms from more makers and keep adding jobs, and every job must run on every arm without a class for each pairing. Positions in the software are always in centimetres.

  An `Arm` is an interface or an abstract class. `MoveTo` takes a position, `x` and `y`, and `Grip` takes `true` to close the gripper or `false` to open it. Each returns the instruction for that arm's controller.
  - `KaroArm` moves to 3, 4 as `KARO GOTO 30 40`, closes as `KARO CLAMP` and opens as `KARO OPEN`.
  - `TeslinArm` moves to 3, 4 as `teslin.move(3cm, 4cm)`, closes as `teslin.grip(on)` and opens as `teslin.grip(off)`.

  Both are `Arm`s with a public constructor without parameters.

  A `Job` is a class, abstract or not, created with an arm that it keeps in a field, its own or one in a base class. `Run` returns the arm's instructions for the whole job, in order. There are two kinds of `Job`:
  - `PickAndPlace` is created with an arm, a position to pick from and a position to put down at. It moves to the first position, closes the gripper, moves to the second position and opens the gripper.
  - `Park` is created with just an arm. It opens the gripper and moves to 0, 0.

  No job class ever names `KaroArm`, `TeslinArm` or any other arm class, so an arm from a new maker needs no change to any job.
checks:
  each-arm-uses-its-own-format:
    title: Each arm writes its maker's format
    failures:
      wrongKaro: "The Karo arm moved to 3, 4, closed and opened as {{actual}}. Expected KARO GOTO 30 40 / KARO CLAMP / KARO OPEN."
      wrongTeslin: "The Teslin arm moved to 3, 4, closed and opened as {{actual}}. Expected teslin.move(3cm, 4cm) / teslin.grip(on) / teslin.grip(off)."
  pick-and-place-on-both-arms:
    title: Pick and place runs on both arms
    failures:
      wrongPickAndPlace: "Picking at 1, 2 and putting down at 5, 6 on the {{arm}} gave: {{actual}}. Expected {{expected}}."
  park-on-both-arms:
    title: Parking runs on both arms
    failures:
      wrongPark: "Parking the {{arm}} gave: {{actual}}. Expected {{expected}}."
  jobs-hold-an-arm:
    title: Each job holds an arm
    failures:
      armNotAbstract: "`Arm` is a class you can create directly. Make it an interface or an abstract class, so that each arm fills it in."
      notAJob: "`{{type}}` is not a `Job`."
      holdsNoArm: "Neither `{{type}}` nor a class it derives from keeps an `Arm` in a field, so it does not hold the arm it was given."
      namesArm: "The `{{user}}` class mentions `{{type}}`, so it is tied to one particular arm."
