title: Slideshows for photo frames
scenario: |
  A photo app sends slideshows to screens around the home. Owners choose how a slideshow runs, in the order the photos were taken or newest first, and the app will offer more kinds of slideshow. It also supports more screens every year. Every kind of slideshow must run on every screen without a class for each pairing.

  A `Screen` is an interface or an abstract class. `Picture` takes a photo's file name and returns how the screen shows it, and `Caption` takes a piece of text and returns how the screen shows that.
  - `LcdFrame` shows `cat.jpg` as `lcd: cat.jpg`, and a caption `hello` as `lcd caption: hello`.
  - `TvStick` shows `cat.jpg` as `tv full screen: cat.jpg`, and a caption `hello` as `tv banner: hello`.

  Both are `Screen`s with a public constructor without parameters.

  A `Slideshow` is a class, abstract or not, created with a screen that it keeps in a field, its own or one in a base class. `Run` takes the photos' file names, oldest first, and returns the screen's lines for the whole slideshow, in order. It does not change the list it is given. There are two kinds of `Slideshow`:
  - `InOrder` shows each photo in the order given, and then the caption with the number of photos and ` photos`, such as `2 photos`. With no photos, that caption is all it shows: `0 photos`.
  - `NewestFirst` shows the caption `newest first`, and then each photo, starting from the last one in the list.

  No slideshow class ever names `LcdFrame`, `TvStick` or any other screen class, so a new screen needs no change to any slideshow.
checks:
  screens-show-photos-their-own-way:
    title: Each screen shows photos and captions its own way
    failures:
      wrongLcd: "The LCD frame showed cat.jpg and the caption hello as {{actual}}. Expected lcd: cat.jpg / lcd caption: hello."
      wrongTv: "The TV stick showed cat.jpg and the caption hello as {{actual}}. Expected tv full screen: cat.jpg / tv banner: hello."
  in-order-on-both-screens:
    title: An in-order slideshow runs on both screens
    failures:
      wrongInOrder: "An in-order slideshow of {{photos}} on the {{screen}} gave: {{actual}}. Expected {{expected}}."
  newest-first-on-both-screens:
    title: A newest-first slideshow runs on both screens
    failures:
      wrongNewestFirst: "A newest-first slideshow of a.jpg, b.jpg and c.jpg on the {{screen}} gave: {{actual}}. Expected {{expected}}."
      changedList: "After the slideshows ran, the list of photos was {{actual}}. Expected it left as it was: a.jpg, b.jpg, c.jpg."
  slideshows-hold-a-screen:
    title: Each slideshow holds a screen
    failures:
      screenNotAbstract: "`Screen` is a class you can create directly. Make it an interface or an abstract class, so that each screen fills it in."
      notASlideshow: "`{{type}}` is not a `Slideshow`."
      holdsNoScreen: "Neither `{{type}}` nor a class it derives from keeps a `Screen` in a field, so it does not hold the screen it was given."
      namesScreen: "The `{{user}}` class mentions `{{type}}`, so it is tied to one particular screen."
