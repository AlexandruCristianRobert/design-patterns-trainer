title: Rumble effects for every controller
scenario: |
  A game studio makes controllers buzz in the player's hands when something happens in the game. It keeps inventing new effects, and its games run on more and more devices. Every effect must play on every device without a class for each pairing.

  A `Controller` is an interface or an abstract class. `Buzz` takes a time in milliseconds and a strength from 0 to 100, and `Wait` takes a time in milliseconds. Each returns what the device does.
  - `Gamepad` buzzes for 300 ms at 80 as `pad rumble 80% 300 ms`, and waits 200 ms as `pad wait 200 ms`.
  - `Phone` cannot change how strongly it vibrates, so it ignores the strength: `phone vibrate 300 ms`, and `phone pause 200 ms`.

  Both are `Controller`s with a public constructor without parameters.

  An `Effect` is a class, abstract or not, created with a controller that it keeps in a field, its own or one in a base class. `Play` returns the controller's steps for the whole effect, in order. There are two kinds of `Effect`:
  - `Explosion` buzzes once, for 400 ms at 100.
  - `Heartbeat` is created with a controller and a number of beats, at least 1. Each beat is a buzz for 100 ms at 40, a wait of 150 ms and another buzz for 100 ms at 40. Between two beats it waits 600 ms, and there is no wait after the last beat.

  No effect class ever names `Gamepad`, `Phone` or any other controller class, so a new device needs no change to any effect.
checks:
  controllers-buzz-their-own-way:
    title: Each controller buzzes and waits its own way
    failures:
      wrongGamepad: "The gamepad buzzed 300 ms at 80 and waited 200 ms as {{actual}}. Expected pad rumble 80% 300 ms / pad wait 200 ms."
      wrongPhone: "The phone buzzed 300 ms at 80 and waited 200 ms as {{actual}}. Expected phone vibrate 300 ms / phone pause 200 ms."
  explosion-on-both-controllers:
    title: An explosion plays on both controllers
    failures:
      wrongExplosion: "An explosion on the {{controller}} gave: {{actual}}. Expected {{expected}}."
  heartbeat-on-both-controllers:
    title: A heartbeat plays its beats on both controllers
    failures:
      wrongHeartbeat: "A heartbeat of {{beats}} on the {{controller}} gave: {{actual}}. Expected {{expected}}."
  effects-hold-a-controller:
    title: Each effect holds a controller
    failures:
      controllerNotAbstract: "`Controller` is a class you can create directly. Make it an interface or an abstract class, so that each device fills it in."
      notAnEffect: "`{{type}}` is not an `Effect`."
      holdsNoController: "Neither `{{type}}` nor a class it derives from keeps a `Controller` in a field, so it does not hold the controller it was given."
      namesController: "The `{{user}}` class mentions `{{type}}`, so it is tied to one particular device."
