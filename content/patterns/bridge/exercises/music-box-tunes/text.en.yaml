title: Play every tune on every instrument
scenario: |
  A toy maker puts tunes into its musical toys. It keeps writing new tunes and keeps bringing out new instruments, and every tune must play on every instrument without a class for each pairing.

  An `Instrument` is an interface or an abstract class. `Note` takes a pitch, such as `C`, and returns how the instrument sounds it, and `Rest` returns how it sounds a pause.
  - `MusicBox` sounds `C` as `plink C`, and a rest as `...`.
  - `Xylophone` sounds `C` as `tok C`, and a rest as `-`.

  Both are `Instrument`s with a public constructor without parameters.

  A `Tune` is a class, abstract or not, created with an instrument that it keeps in a field, its own or one in a base class. `Play` returns the instrument's sounds for the whole tune, in order, separated by single spaces. There are two kinds of `Tune`:
  - `Lullaby` plays `C`, `E`, `G`, a rest, `G`, `E`, `C`. On the music box that is `plink C plink E plink G ... plink G plink E plink C`.
  - `Scale` is created with an instrument and a count from 0 to 7. It plays the first count notes of `C D E F G A B` and then a rest, so a scale of 3 on the xylophone is `tok C tok D tok E -`, and a scale of 0 is just the rest.

  No tune class ever names `MusicBox`, `Xylophone` or any other instrument class, so a new instrument needs no change to any tune. Implement the types listed in the Contract.
hints:
  - "Write `public abstract class Instrument` with `public abstract string Note(string pitch);` and `public abstract string Rest();`, and override both in `MusicBox` and `Xylophone`."
  - "`public abstract class Tune(Instrument instrument)` keeps the instrument, for example with `protected Instrument Instrument => instrument;`, and declares `public abstract string Play();`."
  - "In `Scale.Play`, take the first `count` pitches from an array of the seven, sound each with `Note`, add one `Rest()` and join them with `string.Join(\" \", ...)`."
checks:
  instruments-sound-their-notes:
    title: Each instrument sounds notes and rests its own way
    failures:
      wrongMusicBox: "The music box sounded G and a rest as {{actual}}. Expected plink G / ...."
      wrongXylophone: "The xylophone sounded G and a rest as {{actual}}. Expected tok G / -."
  lullaby-on-both-instruments:
    title: The lullaby plays on both instruments
    failures:
      wrongLullaby: "The lullaby on the {{instrument}} played \"{{actual}}\". Expected \"{{expected}}\"."
  scale-plays-the-first-notes:
    title: A scale plays its first notes and then rests
    failures:
      wrongScale: "A scale of {{count}} on the {{instrument}} played \"{{actual}}\". Expected \"{{expected}}\"."
  tunes-hold-an-instrument:
    title: Each tune holds an instrument
    failures:
      instrumentNotAbstract: "`Instrument` is a class you can create directly. Make it an interface or an abstract class, so that each instrument fills it in."
      notATune: "`{{type}}` is not a `Tune`."
      holdsNoInstrument: "Neither `{{type}}` nor a class it derives from keeps an `Instrument` in a field, so it does not hold the instrument it was given."
      namesInstrument: "The `{{user}}` class mentions `{{type}}`, so it is tied to one particular instrument."
