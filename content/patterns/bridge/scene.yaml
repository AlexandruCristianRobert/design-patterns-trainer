actors:
  - id: program
    name: app
    role: concrete
  - id: player
    name: play
    role: concrete
  - id: output
    name: out
    role: concrete
steps:
  - id: pick
    state:
      player: { output: "phones" }
    code: [6, 6]
  - id: skip
    call: { from: program, to: player, label: "Skip30()" }
    code: [8, 8]
  - id: delegate
    call: { from: player, to: output, label: "Seek(30)" }
    code: [51, 51]
  - id: sound
    state:
      output: { prints: "Headphones: jump 30 s" }
    code: [33, 33]
  - id: swap
    state:
      player: { output: "speaker" }
    code: [2, 2]
  - id: again
    call: { from: program, to: player, label: "Skip30()" }
    code: [8, 8]
  - id: same
    call: { from: player, to: output, label: "Seek(30)" }
    code: [51, 51]
  - id: speaker
    state:
      output: { prints: "Speaker: jump 30 s" }
    code: [25, 25]
