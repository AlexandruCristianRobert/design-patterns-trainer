title: Track a parcel
scenario: |
  A courier wants several things to react when a parcel's status changes: a text message to the recipient, the shop's order page, maybe a smart speaker later. Each of them calls `Track` on the parcel and from then on hears the tracking code and the new status every time it changes. `Untrack` ends that.

  A new parcel starts as `Registered`. Setting the status it already has is not a change, and nobody hears about it. Status changes must work when nothing is tracking the parcel, and untracking something that never tracked it is harmless.

  `Parcel` must not depend on any particular kind of recipient. Implement `IParcelAlertSink` and `Parcel` as listed in the Contract.
checks:
  every-sink-told-each-change:
    title: Every recipient hears each status change
    failures:
      wrongUpdates: "After changing to Shipped and then Delivered, a recipient heard: {{actual}}. Expected PX-1 Shipped, PX-1 Delivered."
      statusNotStored: "`Status` is {{status}} after the last change. It should hold the newest status."
  same-status-not-repeated:
    title: Setting the same status again is not announced
    failures:
      repeatedOrMissed: "After Registered, Shipped, Shipped, Delivered, the recipient heard: {{actual}}. Expected PX-2 Shipped, PX-2 Delivered."
  untracked-sink-not-told:
    title: An untracked recipient hears nothing more
    failures:
      toldAfterUntrack: "A recipient still heard a status change after `Untrack`."
      stayingMissed: "After one recipient untracked, the recipient that stayed did not hear the change exactly once."
  no-sinks-ok:
    title: Works with nothing tracking the parcel
    failures:
      strangerTold: "A recipient that never tracked the parcel heard a status change."
      statusNotStored: "`Status` is {{status}} after the last change. It should hold the newest status, even with no recipients."
  parcel-knows-only-the-interface:
    title: Parcel depends only on IParcelAlertSink
    failures:
      concreteField: "`Parcel` has a field that refers to `{{type}}`. It should only know about `IParcelAlertSink`."
      parcelNamesSink: "The `Parcel` class mentions `{{type}}`. Create recipients outside it and register them with `Track`."
