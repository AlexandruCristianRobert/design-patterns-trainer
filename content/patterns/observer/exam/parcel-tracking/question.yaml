version: 1
contract:
  types:
    - name: ITrackingListener
      kind: interface
      members: ["void StatusChanged(string trackingCode, string status)"]
    - name: Parcel
      kind: class
      members:
        - "Parcel(string trackingCode)"
        - "string Status { get; }"
        - "void Track(ITrackingListener listener)"
        - "void Untrack(ITrackingListener listener)"
        - "void UpdateStatus(string status)"
