title: Build results for everyone
scenario: |
  A build server runs builds for several projects. When a build finishes, every party that asked to hear about results must be told which project was built and whether it passed: a chat bot, a status wall, perhaps a mailer added next month.

  Parties sign up with `AddWatcher` and can leave with `RemoveWatcher`; a party that left hears nothing more. A finished build with nobody listening must still work, and removing a party that never signed up is harmless.

  `BuildServer` must not be tied to any particular kind of party. New kinds must be addable without editing it. Implement `IBuildWatcher` and `BuildServer` as listed in the Contract.
checks:
  every-watcher-told:
    title: Every watcher hears each finished build
    failures:
      wrongCount: "Watcher {{watcher}} heard about {{count}} builds, but two builds finished."
      wrongResult: "Watcher {{watcher}} was told the wrong project or result. Expected web passed, then api failed."
  removed-watcher-not-told:
    title: A removed watcher hears nothing more
    failures:
      toldAfterRemove: "A watcher still heard about a build after `RemoveWatcher`."
      stayingMissed: "After one watcher was removed, the watcher that stayed did not hear about the build exactly once."
  no-watchers-ok:
    title: Works with no watchers
    failures:
      strangerTold: "A watcher that was never added heard about a build."
  server-knows-only-the-interface:
    title: BuildServer depends only on IBuildWatcher
    failures:
      concreteField: "`BuildServer` has a field that refers to `{{type}}`. It should only know about `IBuildWatcher`."
      serverNamesWatcher: "The `BuildServer` class mentions `{{type}}`. Create watchers outside it and add them with `AddWatcher`."
