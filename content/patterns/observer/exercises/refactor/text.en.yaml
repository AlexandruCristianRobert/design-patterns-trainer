title: Decouple the stock ticker
scenario: |
  `Stock` reports every price change to three listeners it creates itself: a `Logger`, a `Chart` and an `Alerts` checker. Each one is a field, and `SetPrice` calls each by name. Every new listener means another edit to `Stock`.

  Refactor it into Observer. The `IStockObserver` interface and empty `Attach` and `Detach` methods are already there; give them real behaviour, and make the three listeners implement `IStockObserver`. `SetPrice` tells every attached observer the stock's symbol and new price, and a detached observer hears nothing more. When you are done, the `Stock` class must not mention `Logger`, `Chart` or `Alerts`, and a `Stock` with nothing attached prints nothing when its price changes.

  `Demo.Run()` changes the price twice and returns the printed lines. The output must stay exactly the same, so attach the three listeners in `Demo.Run()`, in the order `Stock` used to call them.
hints:
  - "Replace the three fields in `Stock` with a `List<IStockObserver>`. `Attach` adds to it and `Detach` removes from it."
  - "`SetPrice` loops over the list and calls `PriceChanged(symbol, price)` on each observer."
  - "Add `: IStockObserver` to `Logger`, `Chart` and `Alerts`, and rename `Log`, `Plot` and `Check` to `PriceChanged(string symbol, int price)`. In `Demo.Run()`, attach a new logger, chart and alerts, in that order, before the price changes."
checks:
  observers-receive-price:
    title: Attached observers receive the symbol and new price
    failures:
      wrongUpdate: "For one price change to 12, an attached observer received: {{actual}}. Expected {{expected}}."
  detach-works:
    title: A detached observer gets no more updates
    failures:
      notifiedAfterDetach: "An observer still received a price after `Detach`."
      stayingMissed: "After one observer was detached, the observer that stayed attached did not receive the price."
  stock-has-no-concrete-dependencies:
    title: Stock depends only on IStockObserver
    failures:
      stockNamesListener: "The `Stock` class still mentions `{{type}}`. Create the listeners outside `Stock` and attach them in `Demo.Run()`."
      stockCreatesListeners: "A new `Stock` with nothing attached still printed output when its price changed. `Stock` should not create its own listeners."
  output-unchanged:
    title: Program output is unchanged
    failures:
      outputChanged: "Line {{line}} of the output changed. Expected \"{{expected}}\", got \"{{actual}}\"."
