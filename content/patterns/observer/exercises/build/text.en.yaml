title: Follow an auction
scenario: |
  An online auction lets bidders follow it. Whenever anyone places a bid, every follower is told who bid and how much, in the order the bids were placed.

  A follower can stop following at any time and hears nothing after that. Placing a bid does not require following. Each auction has its own followers.

  `Auction` must only know about `IBidder` and never name a concrete bidder class, so a new kind of follower needs no change to it. Implement `IBidder` and `Auction` as listed in the Contract.
hints:
  - "`Auction` is the subject and each `IBidder` is an observer. Give `Auction` a `List<IBidder>` field for its followers."
  - "`Follow` adds to the list and `Unfollow` removes from it (`List<T>.Remove`)."
  - "`PlaceBid` loops over the followers and calls `OnNewBid(bidder, amount)` on each one. Looping over a copy (`_followers.ToList()`) lets a follower unfollow from inside `OnNewBid`."
checks:
  followers-told-of-each-bid:
    title: Every follower is told about each bid
    failures:
      wrongNews: "After Carl bid 100 and Dora bid 150, a follower heard: {{actual}}. Expected {{expected}}."
  unfollowed-not-told:
    title: A bidder who unfollows hears nothing more
    failures:
      toldAfterUnfollow: "A bidder kept hearing about new bids after `Unfollow`."
      toldOtherAuction: "A follower of one auction was told about a bid on another auction. Each `Auction` should keep its own list of followers (not a `static` one)."
      stillFollowingMissed: "After another bidder unfollowed, a bidder who still follows heard: {{actual}}. Expected {{expected}}."
  auction-knows-only-the-interface:
    title: Auction depends only on IBidder
    failures:
      auctionNamesBidder: "The `Auction` class mentions `{{type}}`. It should only know about `IBidder`."
