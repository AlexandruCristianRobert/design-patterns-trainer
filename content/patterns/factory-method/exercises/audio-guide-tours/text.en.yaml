title: Finish the museum audio tours
scenario: |
  A museum lends out audio guides. A visitor picks a tour, and the tour plays one line for each exhibit on their route. Every guide is an `IGuide`: `Describe` takes the name of an exhibit and returns what the guide says about it. `StoryGuide` tells children a story, and `ExpertGuide` gives the facts.

  `Tour` is the base class of every tour. It declares `protected abstract IGuide CreateGuide()`, and each kind of tour overrides it to decide which guide speaks. Leave that declaration as it is. `FamilyTour` is done: its guide is a `StoryGuide`. Two pieces are missing.

  `Play` must call `CreateGuide()` exactly once per call, and then return one line per exhibit, in order, numbered from 1: `1. ` followed by what the guide says, then `2. ` and so on. Every call to `Play` is a new tour, so it gets a new guide. `Play` is written once, in `Tour`, and works for every kind of tour, including ones the museum adds later. No subclass changes it.

  `ExpertTour` must be spoken by an `ExpertGuide`. Every call to its `CreateGuide()` returns a new one.

  `Tour` only knows `IGuide`: it never names `StoryGuide`, `ExpertGuide` or any other guide class.
hints:
  - "In `Play`, call `CreateGuide()` once, before the loop, and keep the guide in a local variable. Calling it inside the loop would ask for a new guide at every exhibit."
  - "Number the lines from 1, not from 0: in a `for` loop over the list, the line for index `i` starts with `i + 1`."
  - "`ExpertTour` looks just like `FamilyTour`. Only the class it creates is different."
checks:
  play-numbers-each-exhibit:
    title: Play numbers one line per exhibit
    failures:
      wrongLines: "A tour the program has never seen, through vase, coin and drum, played: {{actual}}. Expected 1. test guide 1 at vase | 2. test guide 1 at coin | 3. test guide 1 at drum."
      guidesPerPlay: "One call to `Play` called `CreateGuide()` {{made}} times. Expected exactly once."
  new-guide-every-tour:
    title: Every tour gets a new guide
    failures:
      guidesForTwoPlays: "Two calls to `Play` called `CreateGuide()` {{made}} times. Expected once per call, so 2."
      secondTourOldGuide: "The second tour played: {{actual}}. Expected 1. test guide 2 at coin, spoken by the second guide."
  family-tour-tells-stories:
    title: A family tour tells stories
    failures:
      wrongFamily: "A family tour through the golden mask and the sun clock played: {{actual}}. Expected 1. Here is the story of the golden mask. | 2. Here is the story of the sun clock."
  expert-tour-gives-facts:
    title: An expert tour gives the facts
    failures:
      wrongExpert: "An expert tour through the golden mask and the sun clock played: {{actual}}. Expected 1. The golden mask: date, maker and materials. | 2. The sun clock: date, maker and materials."
  tour-knows-only-iguide:
    title: Tour knows only IGuide, and each tour picks its guide
    failures:
      noMakingMethod: "`{{owner}}` declares no method that returns an `{{made}}`, so it has no way to get a guide."
      makingMethodParameters: "`{{owner}}.{{method}}` takes parameters, so the caller has to say which guide to make."
      makingMethodFixed: "`{{owner}}.{{method}}` is neither abstract nor virtual, so no kind of tour can pick its own guide."
      makingMethodPrivate: "`{{owner}}.{{method}}` is private, so no kind of tour can pick its own guide."
      notASubclass: "`{{type}}` does not derive from `{{owner}}`."
      operationRedeclared: "`{{type}}` declares its own `{{method}}`. The tour itself should be written once, in `Tour`."
      ownerNamesMadeClass: "The `{{owner}}` class mentions `{{type}}`, so it is tied to one particular guide."
      noEmptyConstructor: "`{{type}}` has no public constructor without parameters."
      makesWrongClass: "`{{type}}` made a `{{actual}}`. Expected a `{{expected}}`."
      reusesObject: "Two calls to `{{type}}.{{method}}` returned the same guide. Expected a new one each call."
