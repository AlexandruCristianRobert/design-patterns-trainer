title: Pack files in three archive formats
scenario: |
  A backup tool packs files into archives. Every format compresses with an `ICompressor`: `Extension` is the archive's file name extension without the dot, and `Compress` takes a file size in bytes and returns its size once compressed, rounded down.
  - `ZipCompressor` has the extension `zip` and halves the size: 301 bytes become 150.
  - `GzipCompressor` has the extension `tar.gz` and keeps two fifths: the size times 2 / 5, so 301 bytes become 120.
  - `NoCompressor` has the extension `tar` and keeps the size as it is.

  `Archiver` is the base class of every format. It does two things, and both are written once, in `Archiver`. No subclass changes them.
  - `Pack` takes an archive name and the sizes of the files. It compresses each file on its own and adds up the results, and returns the name, a dot, the extension, `: `, the total size before, ` -> `, the total size after, and ` bytes`. For example, a zip of files of 100 and 301 bytes called `photos` gives `photos.zip: 401 -> 200 bytes`. Files of 101 and 101 bytes give `202 -> 100`, because each file is rounded down on its own.
  - `Estimate` takes the size of one file and returns its compressed size.

  Both get their compressor from a method of `Archiver` that takes no parameters and returns an `ICompressor`. The name of that method is up to you. It may be abstract or virtual, and protected or public, but not private, so that each format can decide which compressor it uses. `ZipArchiver` uses a `ZipCompressor`, `GzipArchiver` a `GzipCompressor` and `TarArchiver` a `NoCompressor`, and every call returns a new compressor. `Archiver` never names any of the compressor classes, so new formats need no change to it.

  The three archivers derive from `Archiver` and have a public constructor without parameters. Implement the types listed in the Contract.
hints:
  - "Write the three compressors first. Integer arithmetic rounds down for you: `bytes / 2` and `bytes * 2 / 5`."
  - "In `Archiver`, declare one abstract method that returns an `ICompressor`. `Pack` and `Estimate` both call it, so neither one names a compressor class."
  - "Compress each file before adding up: `fileSizes.Sum(compressor.Compress)` rounds each file on its own, but compressing `fileSizes.Sum()` would round only once."
checks:
  compressors-shrink-by-their-rule:
    title: Each compressor shrinks by its own rule
    failures:
      wrongZip: "`ZipCompressor` gave the extension and the sizes for 301 and 7 bytes as: {{actual}}. Expected zip 150 3."
      wrongGzip: "`GzipCompressor` gave the extension and the sizes for 301 and 7 bytes as: {{actual}}. Expected tar.gz 120 2."
      wrongNone: "`NoCompressor` gave the extension and the sizes for 301 and 7 bytes as: {{actual}}. Expected tar 301 7."
  pack-names-and-sizes-the-archive:
    title: Pack names the archive and gives its sizes
    failures:
      wrongZipPack: "A zip of files of 100 and 301 bytes called photos gave \"{{actual}}\". Expected \"photos.zip: 401 -> 200 bytes\"."
      wrongGzipPack: "A gzip archive of files of 100 and 301 bytes called photos gave \"{{actual}}\". Expected \"photos.tar.gz: 401 -> 160 bytes\"."
      wrongTarPack: "A tar archive of files of 100 and 301 bytes called photos gave \"{{actual}}\". Expected \"photos.tar: 401 -> 401 bytes\"."
  pack-compresses-each-file-on-its-own:
    title: Pack compresses each file on its own
    failures:
      wrongPerFile: "A zip of two files of 101 bytes called backup gave \"{{actual}}\". Expected \"backup.zip: 202 -> 100 bytes\"."
  estimate-uses-the-same-format:
    title: Estimate uses the archiver's own format
    failures:
      wrongEstimate: "For a file of 1000 bytes the estimates were zip {{zip}}, gzip {{gzip}} and tar {{tar}}. Expected 500, 400 and 1000."
  archiver-knows-only-icompressor:
    title: Archiver knows only ICompressor, and each format picks its compressor
    failures:
      noMakingMethod: "`{{owner}}` declares no method that returns an `{{made}}`, so it has no way to get a compressor."
      makingMethodParameters: "`{{owner}}.{{method}}` takes parameters, so the caller has to say which compressor to make."
      makingMethodFixed: "`{{owner}}.{{method}}` is neither abstract nor virtual, so no format can pick its own compressor."
      makingMethodPrivate: "`{{owner}}.{{method}}` is private, so no format can pick its own compressor."
      notASubclass: "`{{type}}` does not derive from `{{owner}}`."
      operationRedeclared: "`{{type}}` declares its own `{{method}}`. It should be written once, in `Archiver`."
      ownerNamesMadeClass: "The `{{owner}}` class mentions `{{type}}`, so it is tied to one particular compressor."
      makesWrongClass: "`{{type}}` made a `{{actual}}`. Expected a `{{expected}}`."
      reusesObject: "Two calls to `{{type}}.{{method}}` returned the same compressor. Expected a new one each call."
