title: Ski passes for every resort
scenario: |
  A ski company runs resorts in the Alps and in the north. A skier buys a pass at the resort's office, and every pass is an `ISkiPass`: `Print` takes the skier's name and the number of days and returns the text on the pass.
  - `AlpinePass` prints `ALPINE | Ana | 3 days | chip card`.
  - `NordicPass` prints `NORDIC | Ana | 3 days | paper ticket`.

  A first design gave every resort a separate kit object, with one method for the pass, one for the trail map and one for the receipt, for each region. But the maps and receipts turned out the same everywhere. Only the pass differs, and each kind of resort always hands out the same kind of pass. So there is no kit: each resort class decides its pass itself.

  `Resort` is the base class of every resort. `Sell` is written once, in `Resort`, and no subclass changes it. It takes the skier and the days, gets a new pass, and returns what the pass printed followed by ` | `, the price and ` EUR`. Every resort charges 45 EUR per day, so 3 days cost `135 EUR`. `Sold` is the number of passes that resort has sold so far.

  `Sell` gets each pass from a method of `Resort` that takes no parameters and returns an `ISkiPass`. The name of that method is up to you. It may be abstract or virtual, and protected or public, but not private, so that each resort can decide which pass it hands out. `AlpineResort` hands out an `AlpinePass` and `NordicResort` a `NordicPass`, and every call returns a new pass. `Resort` never names `AlpinePass`, `NordicPass` or any other pass class.

  `AlpineResort` and `NordicResort` derive from `Resort` and have a public constructor without parameters. Implement the types listed in the Contract.
checks:
  passes-print-their-style:
    title: Each pass prints its own style
    failures:
      wrongAlpinePass: "An `AlpinePass` for Ana for 3 days printed \"{{actual}}\". Expected \"ALPINE | Ana | 3 days | chip card\"."
      wrongNordicPass: "A `NordicPass` for Zoe for 2 days printed \"{{actual}}\". Expected \"NORDIC | Zoe | 2 days | paper ticket\"."
  each-resort-sells-its-own-pass:
    title: Each resort sells its own pass at 45 EUR per day
    failures:
      wrongAlpineSale: "The Alpine resort sold Ana 3 days as \"{{actual}}\". Expected \"ALPINE | Ana | 3 days | chip card | 135 EUR\"."
      wrongNordicSale: "The Nordic resort sold Zoe 2 days as \"{{actual}}\". Expected \"NORDIC | Zoe | 2 days | paper ticket | 90 EUR\"."
  each-resort-counts-its-sales:
    title: Each resort counts its own sales
    failures:
      wrongSold: "After two sales in the Alps and one up north, `Sold` was {{alps}} and {{north}}. Expected 2 and 1."
  resort-knows-only-iskipass:
    title: Resort knows only ISkiPass, and each resort picks its pass
    failures:
      noMakingMethod: "`{{owner}}` declares no method that returns an `{{made}}`, so each resort cannot pick its pass by itself."
      makingMethodParameters: "`{{owner}}.{{method}}` takes parameters, so the caller has to say which pass to hand out."
      makingMethodFixed: "`{{owner}}.{{method}}` is neither abstract nor virtual, so no resort can pick its own pass."
      makingMethodPrivate: "`{{owner}}.{{method}}` is private, so no resort can pick its own pass."
      notASubclass: "`{{type}}` does not derive from `{{owner}}`."
      operationRedeclared: "`{{type}}` declares its own `{{method}}`. Selling should be written once, in `Resort`."
      ownerNamesMadeClass: "The `{{owner}}` class mentions `{{type}}`, so it is tied to one particular pass."
      makesWrongClass: "`{{type}}` handed out a `{{actual}}`. Expected a `{{expected}}`."
      reusesObject: "Two calls to `{{type}}.{{method}}` returned the same pass. Expected a new one each call."
