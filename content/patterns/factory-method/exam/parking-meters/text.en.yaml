title: Receipts from parking meters
scenario: |
  A city runs two kinds of parking meters. Street meters print a paper receipt, and garage meters send the receipt to the driver's phone. Every receipt is an `IReceipt`: `Show` takes the minutes parked and the price in cents and returns the receipt's text.
  - `PaperReceipt` shows `PAID 61 MIN 3.00 EUR`, with the price in euros and always two digits of cents: 1205 cents is `12.05`.
  - `AppReceipt` shows `Parking: 61 min, 300 cents`.

  A `StreetMeter` gives `PaperReceipt`s and a `GarageMeter` gives `AppReceipt`s. `ParkingMeter` is the base class of both. `Pay` is declared once, in `ParkingMeter`, and no subclass declares its own. It takes the minutes, always at least 1, and charges 150 cents for every started hour: 1 to 60 minutes cost 150, 61 minutes cost 300. It adds the price to `TakenCents`, the total that meter has taken so far, gets a new receipt and returns what the receipt shows for those minutes and that price.

  Next year's meters will bring new receipts. Adding one means adding a subclass of `ParkingMeter` and a receipt class, and editing nothing else. So:
  - `ParkingMeter` has no constructor with parameters.
  - `ParkingMeter` has no `switch`, and its source mentions no receipt class.
  - No static method in the program returns an `IReceipt`.
  - `ParkingMeter` has one method that takes no parameters, returns an `IReceipt`, and can be overridden by subclasses (abstract or virtual, not private; the name is yours). `Pay` calls it, and every call must give a new receipt.

  `StreetMeter` and `GarageMeter` derive from `ParkingMeter` and have a public constructor without parameters. Implement the types listed in the Contract.
checks:
  receipts-show-the-payment:
    title: Each receipt shows the payment in its own way
    failures:
      wrongPaper: "A `PaperReceipt` for 61 minutes and 300 cents showed \"{{actual}}\". Expected \"PAID 61 MIN 3.00 EUR\"."
      wrongPaperCents: "A `PaperReceipt` for 5 minutes and 1205 cents showed \"{{actual}}\". Expected \"PAID 5 MIN 12.05 EUR\"."
      wrongApp: "An `AppReceipt` for 45 minutes and 150 cents showed \"{{actual}}\". Expected \"Parking: 45 min, 150 cents\"."
  each-meter-gives-its-own-receipt:
    title: Each meter gives its own receipt
    failures:
      wrongStreet: "A street meter paid for 45 minutes gave \"{{actual}}\". Expected \"PAID 45 MIN 1.50 EUR\"."
      wrongGarage: "A garage meter paid for 130 minutes gave \"{{actual}}\". Expected \"Parking: 130 min, 450 cents\"."
  price-per-started-hour:
    title: Meters charge 150 cents per started hour
    failures:
      wrongPrices: "A garage meter paid for 1, 60, 61 and 180 minutes gave: {{actual}}. Expected 150, 150, 300 and 450 cents."
      wrongTaken: "After payments of 150, 150, 300 and 450 cents, `TakenCents` is {{taken}}. Expected 1050."
  meter-is-not-told-the-receipt:
    title: Nothing tells a meter which receipt to give
    failures:
      meterSwitches: "The `ParkingMeter` class has a `switch`, so a list of kinds still has to be edited for every new receipt."
      staticReceiptMaker: "The static method `{{method}}` returns an `IReceipt`, so receipts are picked in one shared place."
      noMakingMethod: "`{{owner}}` declares no method that returns an `{{made}}`, so each meter cannot pick its receipt by itself."
      makingMethodParameters: "`{{owner}}.{{method}}` takes parameters, so the caller has to say which receipt to give."
      makingMethodFixed: "`{{owner}}.{{method}}` is neither abstract nor virtual, so no meter can pick its own receipt."
      makingMethodPrivate: "`{{owner}}.{{method}}` is private, so no meter can pick its own receipt."
      ownerTakesParameters: "A constructor of `{{owner}}` takes parameters ({{parameters}}), so what it uses can be handed in from outside."
      noEmptyConstructor: "`{{type}}` has no public constructor without parameters."
      notASubclass: "`{{type}}` does not derive from `{{owner}}`."
      operationRedeclared: "`{{type}}` declares its own `{{method}}`. Paying should be written once, in `ParkingMeter`."
      ownerNamesMadeClass: "The `{{owner}}` class mentions `{{type}}`, so it is tied to one particular receipt."
      makesWrongClass: "`{{type}}` gave a `{{actual}}`. Expected a `{{expected}}`."
      reusesObject: "Two calls to `{{type}}.{{method}}` returned the same receipt. Expected a new one each call."
