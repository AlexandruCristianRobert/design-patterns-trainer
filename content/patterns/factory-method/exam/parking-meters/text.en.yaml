title: Receipts from parking meters
scenario: |
  A city runs two kinds of parking meters. Street meters print a paper receipt, and garage meters send the receipt to the driver's phone. Receipts share the `IReceipt` interface, and its `Show` takes the minutes parked and the price in cents and returns the receipt's text.
  - `PaperReceipt` shows `PAID 61 MIN 3.00 EUR`, with the price in euros and always two digits of cents: 1205 cents is `12.05`.
  - `AppReceipt` shows `Parking: 61 min, 300 cents`.

  A `StreetMeter` gives `PaperReceipt`s and a `GarageMeter` gives `AppReceipt`s. Both are `ParkingMeter`s, and `Pay` exists in `ParkingMeter` only: neither kind of meter has a `Pay` of its own. It takes the minutes, always at least 1, and charges 150 cents for every started hour: 1 to 60 minutes cost 150, 61 minutes cost 300. It adds the price to `TakenCents`, the total that meter has taken so far, gets a new receipt and returns what the receipt shows for those minutes and that price.

  Next year's meters bring new receipts, and the city wants each one to arrive as a new kind of meter plus a receipt class, with the code that exists today left alone. The council's IT rules spell out what that means:
  - Nobody tells a meter which receipt to print. `ParkingMeter` takes nothing in its constructors, contains no `switch`, and does not name any receipt class.
  - There is no shared receipt desk either: no static method anywhere in the program returns an `IReceipt`.
  - Each meter answers for itself. `ParkingMeter` has a method with no parameters that returns an `IReceipt`, and every kind of meter gives its own answer. `Pay` gets its receipt there, and the answer is a new receipt each time.
checks:
  receipts-show-the-payment:
    title: Each receipt shows the payment in its own way
    failures:
      wrongPaper: "A `PaperReceipt` for 61 minutes and 300 cents showed \"{{actual}}\". Expected \"PAID 61 MIN 3.00 EUR\"."
      wrongPaperCents: "A `PaperReceipt` for 5 minutes and 1205 cents showed \"{{actual}}\". Expected \"PAID 5 MIN 12.05 EUR\"."
      wrongApp: "An `AppReceipt` for 45 minutes and 150 cents showed \"{{actual}}\". Expected \"Parking: 45 min, 150 cents\"."
  each-meter-gives-its-own-receipt:
    title: Each meter gives its own receipt
    failures:
      wrongStreet: "A street meter paid for 45 minutes gave \"{{actual}}\". Expected \"PAID 45 MIN 1.50 EUR\"."
      wrongGarage: "A garage meter paid for 130 minutes gave \"{{actual}}\". Expected \"Parking: 130 min, 450 cents\"."
  price-per-started-hour:
    title: Meters charge 150 cents per started hour
    failures:
      wrongPrices: "A garage meter paid for 1, 60, 61 and 180 minutes gave: {{actual}}. Expected 150, 150, 300 and 450 cents."
      wrongTaken: "After payments of 150, 150, 300 and 450 cents, `TakenCents` is {{taken}}. Expected 1050."
  meter-is-not-told-the-receipt:
    title: Nothing tells a meter which receipt to give
    failures:
      meterSwitches: "The `ParkingMeter` class has a `switch`, so a list of kinds still has to be edited for every new receipt."
      staticReceiptMaker: "The static method `{{method}}` returns an `IReceipt`, so receipts are picked in one shared place."
      noMakingMethod: "`{{owner}}` declares no method that returns an `{{made}}`, so each meter cannot pick its receipt by itself. Declare one there that takes no parameters and returns an `{{made}}`; any name works."
      makingMethodParameters: "`{{owner}}.{{method}}` takes parameters, so the caller has to say which receipt to give. It should take none."
      makingMethodFixed: "`{{owner}}.{{method}}` is neither abstract nor virtual, so no meter can pick its own receipt. Make it abstract or virtual."
      makingMethodPrivate: "`{{owner}}.{{method}}` is private, so no meter can pick its own receipt. Make it public or protected."
      ownerTakesParameters: "A constructor of `{{owner}}` takes parameters ({{parameters}}), so what it uses can be handed in from outside."
      noEmptyConstructor: "`{{type}}` has no public constructor without parameters."
      notASubclass: "`{{type}}` does not derive from `{{owner}}`."
      operationRedeclared: "`{{type}}` declares its own `{{method}}`. Paying should be written once, in `ParkingMeter`."
      ownerNamesMadeClass: "The `{{owner}}` class mentions `{{type}}`, so it is tied to one particular receipt."
      makesWrongClass: "`{{type}}` gave a `{{actual}}`. Expected a `{{expected}}`."
      reusesObject: "Two calls to `{{type}}.{{method}}` returned the same receipt. Expected a new one each call."
