title: Labels for lab samples
scenario: |
  A lab tests blood samples and water samples. Every sample gets a label, and every label is an `ILabel`: `Print` takes the sample's name and its number in the run and returns the text on the label, and `Width` says how many millimetres of the label roll one label uses.
  - `BarcodeLabel` prints `||| 004 A-17` for sample `A-17` number 4, with the number in three digits, and is 30 mm wide.
  - `QrLabel` prints `[QR] river #12` for sample `river` number 12, and is 20 mm wide.

  Every run goes through the same steps in the same order, whatever the lab. `SampleRun` is the base class of every run, and `Process` is written once, in `SampleRun`. No subclass changes it. It takes the sample names and, for each sample in order, gets a new label, adds the text that label printed for the sample and its number, counting from 1, and adds that label's width to the roll used. The last line is `roll used: ` followed by the total and ` mm`, also when there are no samples.

  The text and the width of a label must always match, so a lab does not supply them as two separate steps. `Process` gets each label from a method of `SampleRun` that takes no parameters and returns an `ILabel`. The name of that method is up to you. It may be abstract or virtual, and protected or public, but not private, so that each lab can decide which label goes on its samples. `BloodRun` uses a `BarcodeLabel` and `WaterRun` a `QrLabel`, and every call returns a new label. `SampleRun` never names `BarcodeLabel`, `QrLabel` or any other label class.

  `BloodRun` and `WaterRun` derive from `SampleRun` and have a public constructor without parameters. Implement the types listed in the Contract.
checks:
  labels-print-their-format:
    title: Each label prints its own format and has its own width
    failures:
      wrongBarcode: "A `BarcodeLabel` for sample A-17 number 4 printed \"{{actual}}\" and is {{width}} mm wide. Expected \"||| 004 A-17\" and 30 mm."
      wrongQr: "A `QrLabel` for sample river number 12 printed \"{{actual}}\" and is {{width}} mm wide. Expected \"[QR] river #12\" and 20 mm."
  blood-run-uses-barcodes:
    title: A blood run puts barcodes on its samples
    failures:
      wrongBloodRun: "A blood run of A-17 and B-02 returned: {{actual}}. Expected ||| 001 A-17 / ||| 002 B-02 / roll used: 60 mm."
  water-run-uses-qr-codes:
    title: A water run puts QR codes on its samples
    failures:
      wrongWaterRun: "A water run of river, well and tap returned: {{actual}}. Expected [QR] river #1 / [QR] well #2 / [QR] tap #3 / roll used: 60 mm."
  empty-run-uses-no-roll:
    title: A run with no samples uses no roll
    failures:
      wrongEmptyRun: "A blood run with no samples returned: {{actual}}. Expected just roll used: 0 mm."
  run-knows-only-ilabel:
    title: SampleRun knows only ILabel, and each lab picks its label
    failures:
      noMakingMethod: "`{{owner}}` declares no method that returns an `{{made}}`, so it has no way to get a whole label."
      makingMethodParameters: "`{{owner}}.{{method}}` takes parameters, so the caller has to say which label to use."
      makingMethodFixed: "`{{owner}}.{{method}}` is neither abstract nor virtual, so no lab can pick its own label."
      makingMethodPrivate: "`{{owner}}.{{method}}` is private, so no lab can pick its own label."
      notASubclass: "`{{type}}` does not derive from `{{owner}}`."
      operationRedeclared: "`{{type}}` declares its own `{{method}}`. The steps of a run should be written once, in `SampleRun`."
      ownerNamesMadeClass: "The `{{owner}}` class mentions `{{type}}`, so it is tied to one particular label."
      makesWrongClass: "`{{type}}` used a `{{actual}}`. Expected a `{{expected}}`."
      reusesObject: "Two calls to `{{type}}.{{method}}` returned the same label. Expected a new one each call."
