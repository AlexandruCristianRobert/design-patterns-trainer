title: Work the gates and paddles of a canal lock
scenario: |
  A canal lock lifts boats between a low and a high stretch of water. It has an upper gate and a lower gate, and two paddles: opening the filling paddle lets water in, and opening the emptying paddle lets it out. The canal trust wants one `CanalLock` object in front of the four parts, but boaters also work the lock themselves with the buttons on each gate and paddle. So each part asks the lock before it opens, and the rules about the water live only in the lock: the gates and paddles must not know each other. Write these types:
  - `CanalLock` has a public constructor without parameters, the parts as `Upper`, `Lower`, `Filling` and `Emptying`, and `Water`, which is `low` or `high` and starts `low`. Everything starts closed.
  - `Gate` and `Paddle` each have `IsOpen`, `Open()` and `Close()`. `Close()` always closes the part and changes nothing else. `Open()` opens it only when the rules below allow it; otherwise it stays closed.
  - A gate opens only when the other gate and both paddles are closed, and the water is on its side: `high` for the upper gate, `low` for the lower gate.
  - A paddle opens only when both gates and the other paddle are closed. Opening the filling paddle makes the water `high`, and opening the emptying paddle makes it `low`, straight away.
  - The lock, or an interface it implements, is given to each gate and paddle in its constructor or by a setter. Neither `Gate` nor `Paddle` has a field that can hold a `Gate` or a `Paddle`, alone or in an array or collection, including a type of ours that one of them is.

  So a boat going up enters through the lower gate, the gate is closed behind it, the filling paddle is opened and closed again, and only then does the upper gate open.
checks:
  gates-open-only-on-their-side:
    title: Each gate opens only when the water is on its side
    failures:
      wrongStart: "A new lock was \"{{actual}}\". Expected \"{{expected}}\"."
      wrongLock: "After {{step}}, the lock was \"{{actual}}\". Expected \"{{expected}}\"."
  paddles-move-the-water:
    title: The paddles fill and empty the lock, one at a time
    failures:
      wrongLock: "After {{step}}, the lock was \"{{actual}}\". Expected \"{{expected}}\"."
  nothing-opens-while-water-can-flow:
    title: No gate opens while a paddle is open, and no paddle while a gate is open
    failures:
      wrongLock: "After {{step}}, the lock was \"{{actual}}\". Expected \"{{expected}}\"."
  gates-and-paddles-know-only-the-lock:
    title: No gate or paddle holds another gate or paddle
    failures:
      holdsAnother: "`{{type}}` has a field `{{field}}` that can hold a `{{other}}`. Each gate and paddle should only ask the lock, and the lock decides what may open."
