title: Take the rules out of an induction hob's zones
scenario: |
  An induction hob has three cooking zones and an extractor hood above it. Each zone is set to a level from 0, which is off, to 9, which is boost. Two rules link them:
  - Only one zone can boost at a time: setting a zone to 9 drops any other zone at 9 to 8. Other levels leave the other zones as they are.
  - The hood's speed is the number of zones above 0.

  It works, but each `CookingZone` keeps a list of the other zones and a field for the hood, and works out both rules itself. `Hob` only wires them together. Refactor it so that the parts do not know each other:
  - A zone only tells the hob that its level was set. The hob is given to each zone in its constructor or by a setter.
  - `Hob` holds both rules, and sets the hood's speed after every change.
  - Neither `CookingZone` nor `ExtractorHood` has a field that holds a `CookingZone` or an `ExtractorHood`, or a list of them.

  `Demo.Run()` sets some zones and returns the levels and the hood's speed after each step. Its output must stay exactly the same, line for line.
hints:
  - "Give `CookingZone` a constructor that takes the `Hob`, and have `SetLevel` call something like `hob.Changed(this)` after it sets `Level`. Remove the `Others` and `Hood` fields."
  - "In `Hob.Changed`, loop over the hob's own list of zones: when the zone that changed is at 9, drop any other zone at 9 to 8. Then set the hood to `zones.Count(z => z.Level > 0)`."
  - "The hob needs a way to change a zone without the zone telling the hob again, such as a `Switch(int level)` that only sets `Level`."
checks:
  output-unchanged:
    title: Program output is unchanged
    failures:
      outputChanged: "Line {{line}} of the output changed. Expected \"{{expected}}\", got \"{{actual}}\"."
  only-one-zone-boosts:
    title: Setting a zone to 9 drops any other zone at 9 to 8
    failures:
      wrongZoneCount: "A new hob had {{actual}} zone(s). Expected {{expected}}."
      wrongLevels: "After setting zone {{zone}} to {{level}}, the levels were \"{{actual}}\". Expected \"{{expected}}\": only one zone can be at 9, and other levels leave the other zones alone."
  the-hood-counts-the-zones-that-are-on:
    title: The hood's speed is the number of zones that are on
    failures:
      wrongHood: "After setting zone {{zone}} to {{level}}, with the zones at \"{{levels}}\", the hood's speed was {{actual}}. Expected {{expected}}."
  the-hob-parts-know-only-the-hob:
    title: No zone or hood holds another part of the hob
    failures:
      holdsAnother: "`{{type}}` has a field `{{field}}` that holds a `{{other}}`. A zone should only tell the hob that it changed, and the hob decides who reacts."
