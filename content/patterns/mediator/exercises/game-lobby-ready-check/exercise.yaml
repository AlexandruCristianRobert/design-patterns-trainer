kind: build
version: 2
contract:
  types:
    - name: Lobby
      kind: class
      members: ["Lobby()", "Player Join()", "Countdown Countdown { get; }"]
    - name: Player
      kind: class
      members: ["bool IsReady { get; }", "void Ready()"]
    - name: Countdown
      kind: class
      members: ["bool IsRunning { get; }", "void Cancel()"]
