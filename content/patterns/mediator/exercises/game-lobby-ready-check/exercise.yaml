kind: build
version: 1
contract:
  types:
    - name: Lobby
      kind: class
      members: ["Lobby()", "Player Join(string name)", "IReadOnlyList<Player> Players { get; }", "Countdown Countdown { get; }"]
    - name: Player
      kind: class
      members: ["string Name { get; }", "bool IsReady { get; }", "IReadOnlyList<string> Seen { get; }", "void Ready()", "void Unready()", "void Leave()"]
    - name: Countdown
      kind: class
      members: ["bool IsRunning { get; }", "void Cancel()"]
