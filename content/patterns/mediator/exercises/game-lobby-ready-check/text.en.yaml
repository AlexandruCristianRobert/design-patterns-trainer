title: Start a game when everyone in the lobby is ready
scenario: |
  An online game gathers its players in a lobby before a match. The match countdown starts when every player is ready, and the host can cancel it. The players and the countdown do not know each other: each of them only tells the lobby what happened, and `Lobby` holds the rules. Build it:
  - `Lobby` has a public constructor without parameters and a `Countdown`. `Join()` adds a new `Player` to the lobby and returns it. A new player is not ready, and the countdown starts not running.
  - `Player.Ready()` makes the player ready. When every player in the lobby is then ready, the countdown starts: its `IsRunning` becomes true.
  - `Countdown.Cancel()` stops the countdown and makes every player not ready. When they are all ready again, the countdown starts again.
  - The lobby gives itself to each player and to the countdown, in a constructor or by a setter. Neither `Player` nor `Countdown` has a field that holds a `Player` or a `Countdown`, or a list of them.

  So when Ana and Ben are in the lobby, Ana getting ready does nothing else, and Ben getting ready then starts the countdown.
hints:
  - "Each player and the countdown keep the `Lobby` and call it: `Ready()` sets `IsReady` and then calls something like `lobby.PlayerReady()`. Only the lobby keeps the list of players."
  - "In `PlayerReady`, the lobby checks `players.All(p => p.IsReady)` and, if so, starts the countdown with a method such as `Countdown.Start()` that only the lobby calls."
  - "`Cancel()` sets `IsRunning` to false and calls something like `lobby.CountdownCancelled()`, which loops over the players and calls an `Unready()` that only sets `IsReady` back to false."
checks:
  everyone-ready-starts-the-countdown:
    title: The countdown starts when every player is ready
    failures:
      readyAtStart: "A player who just joined had `IsReady` {{actual}}. Expected {{expected}}."
      notReady: "After `Ready()`, `IsReady` was {{actual}}. Expected {{expected}}."
      wrongCountdown: "After {{after}}, `IsRunning` was {{actual}}. Expected {{expected}}: the countdown starts when every player in the lobby is ready."
  cancelling-makes-everyone-not-ready:
    title: Cancelling the countdown makes every player not ready
    failures:
      stillRunning: "After `Cancel()`, `IsRunning` was {{actual}}. Expected {{expected}}."
      stillReady: "After `Cancel()`, the players were \"{{actual}}\". Expected {{expected}}: cancelling makes every player not ready."
      wrongRestart: "After the cancel, when {{after}}, `IsRunning` was {{actual}}. Expected {{expected}}: the countdown starts again once every player is ready again."
  players-know-only-the-lobby:
    title: No player or countdown holds another player or the countdown
    failures:
      holdsAnother: "`{{type}}` has a field `{{field}}` that holds a `{{other}}`. Each player and the countdown should only tell the lobby what happened, and the lobby decides who reacts."
