kind: build
version: 2
contract:
  types:
    - name: AlarmPanel
      kind: class
      members: ["AlarmPanel()", "Keypad Keypad { get; }", "DoorSensor FrontDoor { get; }", "Siren Siren { get; }"]
    - name: Keypad
      kind: class
      members: ["bool IsArmed { get; }", "void Arm()", "void Disarm()"]
    - name: DoorSensor
      kind: class
      members: ["void Open()"]
    - name: Siren
      kind: class
      members: ["bool IsSounding { get; }"]
