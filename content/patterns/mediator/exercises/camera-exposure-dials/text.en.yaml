title: Stop a camera's dials turning each other
scenario: |
  A camera has a mode dial (`manual` or `auto`), an aperture ring (f/2, f/4, f/8 or f/16) and a shutter dial (1/`Speed` of a second). It starts in `manual` at f/8 and 1/250. In `manual`, each dial only moves itself. In `auto`, the shutter follows the aperture: its speed is 2000 divided by the f-number, so f/8 gives 1/250. Turning the aperture in `auto` sets the shutter, and switching to `auto` sets it too. Turning the shutter, or switching to `manual`, moves nothing else.

  It works, but the dials hold each other: `ModeDial` and `ApertureRing` each have fields for the other dials and set the shutter themselves, and `Camera` only wires them together. Refactor it so that the dials do not know each other:
  - The mode dial and the aperture ring only tell the camera that they were turned. The camera is given to them in their constructor or by a setter.
  - `Camera` holds the rule about when the shutter follows the aperture.
  - None of `ModeDial`, `ApertureRing` and `ShutterDial` has a field that holds one of these three, and no dial reaches another dial through the camera, such as `camera.Shutter`.

  `Demo.Run()` turns the dials and returns the settings after each step. Its output must stay exactly the same, line for line.
hints:
  - "Give `ModeDial` and `ApertureRing` a constructor that takes the `Camera`, and build them in `Camera()` with `new(this)`. Remove their `Aperture`, `Shutter` and `Mode` fields. Leave `ShutterDial` as it is: it does not tell the camera, so setting the shutter from the camera never loops."
  - "At the end of each `Turn`, call a method on the camera such as `camera.Turned()`."
  - "Move the `if (... == \"auto\") Shutter.Turn(2000 / ...)` line into `Camera.Turned()`, where it can read `Mode.Setting` and `Aperture.FNumber`."
checks:
  output-unchanged:
    title: Program output is unchanged
    failures:
      outputChanged: "Line {{line}} of the output changed. Expected \"{{expected}}\", got \"{{actual}}\"."
  in-manual-each-dial-moves-alone:
    title: In manual, each dial moves only itself
    failures:
      wrongStart: "A new camera was at \"{{actual}}\". Expected \"{{expected}}\"."
      wrongSettings: "After {{step}}, the camera was at \"{{actual}}\". Expected \"{{expected}}\"."
  in-auto-the-shutter-follows-the-aperture:
    title: In auto, the shutter follows the aperture
    failures:
      wrongSettings: "After {{step}}, the camera was at \"{{actual}}\". Expected \"{{expected}}\": in auto, the shutter speed is 2000 divided by the f-number."
  the-dials-know-only-the-camera:
    title: No dial holds or reaches another dial
    failures:
      holdsAnother: "`{{type}}` has a field `{{field}}` that holds a `{{other}}`. A dial should only tell the camera that it was turned, and the camera decides which dial follows."
      reachesThrough: "`{{type}}` reads `.{{member}}`, another dial reached through the camera. A dial should only tell the camera that it was turned, and the camera decides which dial follows."
