title: Finish the buttons of a video call
scenario: |
  A video call window has a camera button and a screen share button. They affect each other, but neither knows the other. Each button is given an `ICallScreen` and calls `Changed(this)` after the user presses it. `CallScreen` builds both buttons, gives each of them itself, and its `Changed` method holds every rule about who reacts. Everything starts off: camera off and not sharing.

  `ICallScreen` and `CameraButton` are finished, and so is the rule "starting to share turns the camera off" in `CallScreen.Changed`: use it as the model. Finish the rest:
  - `ShareButton.Press()` starts sharing when not sharing and stops when sharing, then calls `Changed(this)` on its screen, once.
  - Turning the camera on stops sharing. Turning it off changes nothing else.

  The buttons keep knowing only the screen: neither of them has a field that holds a `CameraButton` or a `ShareButton`.
hints:
  - "`ShareButton.Press()` works like `CameraButton.Press()`: flip `IsSharing`, then call `screen.Changed(this)`."
  - "The new rule in `Changed` looks like the finished one: `if (button == Camera && Camera.IsOn) Share.Stop();`."
  - "Only `CallScreen` calls `Stop()` and `TurnOff()`. They change a button without calling `Changed`, so one rule never sets off another."
checks:
  the-share-button-tells-the-screen:
    title: The share button flips when pressed and tells its screen once
    failures:
      notFlipped: "After {{presses}} press(es), `IsSharing` was {{actual}}. Expected {{expected}}: each press flips it."
      notTold: "After {{presses}} press(es), the share button had told its screen {{actual}} time(s), with itself. Expected {{expected}}: once per press, with `Changed(this)`."
  sharing-turns-the-camera-off:
    title: Starting to share turns the camera off
    failures:
      notSharing: "After pressing share, `IsSharing` was {{actual}}. Expected {{expected}}: check `ShareButton.Press()`."
      cameraStillOn: "After turning the camera on and then starting to share, the camera's `IsOn` was {{actual}}. Expected {{expected}}: the screen turns the camera off when sharing starts."
  turning-the-camera-on-stops-sharing:
    title: Turning the camera on stops sharing
    failures:
      cameraOff: "After sharing and then pressing the camera, the camera's `IsOn` was {{actual}}. Expected {{expected}}."
      stillSharing: "After turning the camera on while sharing, `IsSharing` was {{actual}}. Expected {{expected}}: turning the camera on stops sharing. Add the rule in `CallScreen.Changed`."
      sharingAgain: "After turning the camera off again, `IsSharing` was {{actual}}. Expected {{expected}}: turning the camera off changes nothing else."
  the-buttons-know-only-the-screen:
    title: Neither button holds the other
    failures:
      holdsAnother: "`{{type}}` has a field `{{field}}` that holds a `{{other}}`. Each button should only tell its screen that it changed, and the screen decides who reacts."
