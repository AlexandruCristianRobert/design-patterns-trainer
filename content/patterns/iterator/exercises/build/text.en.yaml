title: Walk the slots of an office snack machine
scenario: |
  An office snack machine has slots numbered 1, 2, 3… A slot holds one snack or is empty. The engineer who refills it walks over the slots on a tablet, and the tablet must not care how the machine stores them. Build it as Iterator:
  - `Snack` is a record `Snack(int Slot, string Name)`: what a walk meets in one slot, such as slot `2` and `crisps`.
  - `SnackMachine(int size)` has `size` slots, all empty at the start. `Fill(slot, name)` puts a snack in a slot and `Take(slot)` empties it.
  - `SnackMachine` is an `IEnumerable<Snack>` with a public `GetEnumerator()`, so `foreach` walks over it. A walk goes from slot 1 up and meets only the slots that hold a snack.
  - Every walk keeps its own place: two walks at the same time never disturb each other. A machine with nothing in it gives an empty walk.
  - `SnackMachine` keeps its slots to itself: no public member hands out the slots, or any other array or collection.

  Write the walk as you like: with `yield return`, or with a walker class of your own that implements `IEnumerator<Snack>`. So with water in slot 1, crisps in 2, gum in 4 and toffee in 5, a walk meets water, crisps, gum, toffee, whatever order they were filled in. After the crisps are taken, it meets water, gum, toffee.
hints:
  - "A private `string?[] slots = new string?[size + 1]` is enough storage: slot 1 is `slots[1]`, and `slots[0]` is never used. `Fill` is `slots[slot] = name` and `Take` sets it back to `null`."
  - "Add `: IEnumerable<Snack>` to the class. `GetEnumerator()` can be one loop `for (var slot = 1; slot <= size; slot++)` with `yield return new Snack(slot, name)` for every slot that is not `null`."
  - "`yield return` gives every call to `GetEnumerator()` its own place. You also need `IEnumerator IEnumerable.GetEnumerator() => GetEnumerator();`, with `using System.Collections;` at the top."
checks:
  a-walk-goes-from-slot-1-up-over-the-full-slots:
    title: A walk goes from slot 1 up and steps over the empty slots
    failures:
      wrongOrder: "With water in 1, crisps in 2, gum in 4 and toffee in 5, a walk met \"{{actual}}\". Expected \"{{expected}}\": from slot 1 up, only the slots that hold a snack."
      wrongAfterTake: "After the crisps in slot 2 were taken, a walk met \"{{actual}}\". Expected \"{{expected}}\": an empty slot is stepped over."
  two-walks-keep-their-own-place:
    title: Two walks at the same time keep their own place
    failures:
      sharedPlace: "Walk A moved twice and walk B once. They were at \"{{actual}}\". Expected \"{{expected}}\": each walk has its own place, so a new walk starts at the first snack."
      disturbedByOther: "After walk B ran to the end, walk A's next snack was \"{{actual}}\". Expected \"{{expected}}\": another walk must not move this one."
  an-empty-machine-gives-an-empty-walk:
    title: A machine with nothing in it gives an empty walk
    failures:
      wrongEmpty: "On an empty machine of 3 slots, a walk met \"{{actual}}\". Expected \"{{expected}}\"."
  the-machine-keeps-its-slots-to-itself:
    title: The machine hands out no array or collection
    failures:
      storageShown: "`SnackMachine` has a public member `{{member}}` that hands out an array or a collection. Keep the slots private: the tablet only walks over the machine."
