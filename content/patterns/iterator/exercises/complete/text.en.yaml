title: Walk the bags in a station's left-luggage lockers
scenario: |
  A station has a bank of left-luggage lockers, numbered from 1. `Store(number, bag)` puts a `Bag` in a locker and `Collect(number)` empties it again, so some lockers hold a bag and some are empty. Each `Bag` has its `Owner` and the `Days` it has been there. `LockerBank` keeps its lockers to itself: no public member hands out the lockers, or any other array or collection, so the only way to see the bags is to walk over them with `foreach`. Its `GetEnumerator()` hands every walk a new `LockerWalker`, so two walks at the same time never disturb each other. `Bag` and `LockerBank` are finished.

  Finish the rest:
  - `MoveNext()` in `LockerWalker` goes from locker 1 up, steps over the empty lockers, makes the next bag `Current` and returns `true`. When no bag is left, it returns `false`, and `false` again if it is called again.
  - `LockerFees.Owed(bank)` walks over the bank with `foreach` and charges 6 for every day of every bag.

  So with Maya in locker 2, Lena in 3, Omar in 5 and Ivo in 6, a walk meets Maya, Lena, Omar, Ivo, whatever order they were stored in, and `Owed` is 42. A bank with no bags gives an empty walk and owes 0.

  If you prefer, you may instead rewrite `LockerBank.GetEnumerator()` with `yield return` and drop `LockerWalker`.
hints:
  - "`MoveNext` can be one loop: `while (++at < lockers.Length)`, and inside it, when `lockers[at] is { } bag`, set `Current = bag` and return `true`."
  - "After the loop, return `false`. A later call runs `++at` again, finds it past the end, and returns `false` once more."
  - "`Owed` needs no index and no lockers: `foreach (var bag in bank) owed += 6 * bag.Days;`."
checks:
  walks-the-bags-in-locker-order:
    title: A walk meets the bags from locker 1 up and steps over the empty lockers
    failures:
      wrongOrder: "With Maya in 2, Lena in 3, Omar in 5 and Ivo in 6, the walk met \"{{actual}}\". Expected \"{{expected}}\": the bags in locker order, whatever order they were stored in."
      wrongAfterCollect: "After Lena collected her bag, the walk met \"{{actual}}\". Expected \"{{expected}}\": an emptied locker is stepped over."
      keptGoing: "After the last bag, `MoveNext()` returned `true` again. Expected `false`, and `false` again on the next call: there is no bag left."
  two-walks-keep-their-own-place:
    title: Two walks over one bank keep their own place
    failures:
      sharedPlace: "Walk A moved twice and walk B once. They were at \"{{actual}}\". Expected \"{{expected}}\": each walk has its own place, so a new walk starts at the first bag."
      disturbedByOther: "After walk B ran to the end, walk A's next bag was \"{{actual}}\". Expected \"{{expected}}\": another walk must not move this one."
  an-empty-bank-has-nothing-to-walk:
    title: A bank with no bags gives an empty walk
    failures:
      wrongEmpty: "With 5 empty lockers, the walk met \"{{actual}}\". Expected \"{{expected}}\"."
  fees-add-up-every-bag:
    title: The fees add 6 for every day of every bag
    failures:
      wrongFees: "For {{bank}}, `Owed` returned {{actual}}. Expected {{expected}}: 6 for every day of every bag, found by walking the bank."
  the-bank-keeps-its-lockers-to-itself:
    title: The bank hands out no array or collection
    failures:
      storageShown: "`LockerBank` has a public member `{{member}}` that hands out an array or a collection. Keep the lockers private: code that needs the bags walks over the bank."
