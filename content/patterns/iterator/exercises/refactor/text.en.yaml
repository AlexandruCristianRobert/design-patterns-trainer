title: Hide the list behind a phone's recent calls
scenario: |
  A phone keeps its recent calls in `RecentCalls`. `Add(call)` adds a call at the end of its public list `History`, so the oldest call comes first and the newest last. Each `Call` has a `Name` and says whether it was `Missed`. `Call` is finished, so leave it as it is.

  Both screens that show the calls reach into `History` themselves. `CallScreen.Lines` lists the calls newest first, with ` (missed)` after a missed one, so it loops over `History` backwards by index. `MissedBadge.Count` counts the missed calls with an index loop of its own. Each would break if the phone stored its calls another way.

  Refactor it into Iterator:
  - `RecentCalls` becomes an `IEnumerable<Call>`, so `foreach` walks over it. A walk gives the calls newest first. Every walk keeps its own place, so two walks at the same time never disturb each other, and a phone with no calls gives an empty walk.
  - `RecentCalls` keeps its list to itself: it has no public field, and no public member hands out an array or a collection. It keeps its constructor and `Add`.
  - `CallScreen.Lines` and `MissedBadge.Count` keep their signatures and learn about the calls only by walking `RecentCalls` with `foreach` or LINQ: no `for`, `while` or `do` loop and no index such as `history[i]` is left in them.

  Write the walk as you like: `GetEnumerator()` with `yield return`, or a walker class of your own that implements `IEnumerator<Call>`. `Demo.Run()` adds calls and shows the screens. Its output must stay exactly the same, line for line.
hints:
  - "Make `History` a private field `history`. Add `: IEnumerable<Call>` to the class, a public `IEnumerator<Call> GetEnumerator()` and `IEnumerator IEnumerable.GetEnumerator() => GetEnumerator();`."
  - "Move the backwards loop from `CallScreen` into `GetEnumerator`: `for (var i = history.Count - 1; i >= 0; i--) yield return history[i];`. Or return `Enumerable.Reverse(history).GetEnumerator()`, but not `history.Reverse()`: on a `List` that turns the list round in place and returns nothing."
  - "The screens then shrink to a walk: `calls.Select(call => call.Missed ? $\"{call.Name} (missed)\" : call.Name).ToList()` and `calls.Count(call => call.Missed)`."
checks:
  output-unchanged:
    title: Program output is unchanged
    failures:
      outputChanged: "Line {{line}} of the output changed. Expected \"{{expected}}\", got \"{{actual}}\"."
  a-walk-gives-the-newest-call-first:
    title: A walk gives the calls newest first
    failures:
      notWalkable: "`RecentCalls` is not an `IEnumerable<Call>` yet, so `foreach` cannot walk over it."
      wrongOrder: "With Ann, Bob, Cat added in that order, a walk met \"{{actual}}\". Expected \"{{expected}}\": the newest call first."
  two-walks-keep-their-own-place:
    title: Two walks over the same calls keep their own place
    failures:
      notWalkable: "`RecentCalls` is not an `IEnumerable<Call>` yet, so `foreach` cannot walk over it."
      sharedPlace: "With Ann, Bob, Cat added, walk A moved twice and walk B once. They were at \"{{actual}}\". Expected \"{{expected}}\": each walk has its own place, so a new walk starts at the newest call."
      disturbedByOther: "After walk B ran to the end, walk A's next call was \"{{actual}}\". Expected \"{{expected}}\": another walk must not move this one."
  no-calls-gives-an-empty-walk:
    title: A phone with no calls gives an empty walk
    failures:
      notWalkable: "`RecentCalls` is not an `IEnumerable<Call>` yet, so `foreach` cannot walk over it."
      wrongEmpty: "With no calls, a walk met \"{{actual}}\". Expected \"{{expected}}\"."
  the-list-stays-inside:
    title: The list stays inside RecentCalls, and the screens only walk it
    failures:
      notWalkable: "`RecentCalls` is not an `IEnumerable<Call>` yet, so `foreach` cannot walk over it."
      publicField: "`RecentCalls` still has the public field `{{field}}`. Keep the list private: the walk is the only way in."
      storageShown: "`RecentCalls` has a public member `{{member}}` that hands out an array or a collection. Code that needs the calls should walk over `RecentCalls` instead."
      clientReachesIn: "`{{client}}` still has `{{code}}`. It should walk `RecentCalls` with `foreach` or LINQ, with no loop or index of its own."
