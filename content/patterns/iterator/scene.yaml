actors:
  - id: print
    name: print
    role: concrete
  - id: album
    name: album
    role: concrete
  - id: walk
    name: walk
    role: primary
  - id: other
    name: other
    role: primary
steps:
  - id: ask
    call: { from: print, to: album, label: "CreateWalker()" }
    code: [72, 72]
  - id: make
    call: { from: album, to: walk, label: "new" }
    code: [28, 28]
  - id: first
    call: { from: print, to: walk, label: "MoveNext()" }
    code: [73, 73]
  - id: at-first
    state:
      walk: { at: "page 0, pocket 0" }
    code: [58, 61]
  - id: second
    call: { from: print, to: walk, label: "MoveNext()" }
    code: [73, 73]
  - id: skip
    state:
      walk: { at: "page 0, pocket 2" }
    code: [52, 52]
  - id: another
    call: { from: album, to: other, label: "new" }
    code: [28, 28]
  - id: fresh
    state:
      other: { at: "not started" }
    code: [43, 44]
  - id: apart
    state:
      walk: { at: "page 0, pocket 2" }
      other: { at: "not started" }
    code: [43, 44]
