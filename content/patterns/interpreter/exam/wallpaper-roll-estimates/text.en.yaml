title: Wallpaper estimates for a decorating shop
scenario: |
  A decorating shop works out how much wallpaper a customer needs. Each kind of paper has its own estimate, such as "the widths of the walls to paper, divided into strips of 53 cm, rounded up", and the shop wants to write a new estimate without new code, by putting together small parts that hold other parts, as deep as needed. The same estimate then works for any room. All amounts are whole numbers, never below 0. Write these types:
  - `Room(int heightCm)`, with `HeightCm` to read. `AddWall(string name, int widthCm)` adds a wall, such as `north`, replacing a wall of the same name, and `WidthOf(string wall)` returns its width, or 0 for a wall that was not added.
  - `Measure` is an interface or a base class with `int Amount(Room room)`.
  - Three parts that hold no other part, each a `Measure`: `Length(int amount)` is always that amount; `WallWidth(string wall)` is the width of that wall of the room; and `RoomHeight()`, with a public constructor without parameters, is the room's height.
  - Three parts that hold other parts, each a `Measure`: `Plus(Measure first, Measure second)` adds its two parts; `Times(Measure first, Measure second)` multiplies them; and `DividedRoundUp(Measure measure, int by)` divides its part by `by` and rounds up to a whole number, so 400 divided by 53 is 8 and 0 divided by 53 is 0.
  - Each part has its own `Amount` and asks the parts it holds. `Measure` has no code of its own: no methods with a body (fields and properties are fine). No class other than the parts above is a `Measure`, except abstract classes in between that have no code of their own either. No code tests which kind of `Measure` it has: no `is`, `as`, type pattern, `typeof` or `nameof` names one of the parts, and no part calls `GetType()`.

  So the strips for the north and east walls are `DividedRoundUp(Plus(WallWidth("north"), WallWidth("east")), 53)`, which is 14 for walls of 400 cm and 300 cm. A part can be used inside several estimates: the rolls of 10 metres are `DividedRoundUp(Times(strips, Plus(RoomHeight(), Length(10))), 1000)`.
checks:
  simple-parts-measure-a-room:
    title: A room keeps its walls, and Length, WallWidth and RoomHeight give their amounts
    failures:
      wrongWall: "After adding a north wall of 100 cm and then one of 420 cm, `WidthOf(\"north\")` returned {{actual}}. Expected {{expected}}."
      wrongAmount: "For {{room}}, `{{measure}}` gave {{actual}}. Expected {{expected}}."
  joining-parts-ask-the-parts-they-hold:
    title: Plus, Times and DividedRoundUp work with the parts they hold
    failures:
      wrongAmount: "For {{room}}, `{{measure}}` gave {{actual}}. Expected {{expected}}."
  nested-estimates-fit-every-room:
    title: Estimates nested four deep fit every room
    failures:
      wrongAmount: "For {{room}}, `{{measure}}` gave {{actual}}. Expected {{expected}}: each part should ask the parts it holds, all the way down, and DividedRoundUp rounds up."
  each-part-measures-itself:
    title: Each part is its own Measure class and works out its own amount
    failures:
      notAPart: "`{{type}}` is not a `Measure`."
      notItsOwn: "`{{type}}` has no `Amount` of its own. Each part should write its own `Amount`, not take it from another class."
      baseHasCode: "`Measure` has code of its own, in `{{member}}`. It may hold fields, properties and abstract methods, but the work belongs in the parts."
      extraPart: "`{{type}}` is a `Measure`, but it is neither one of the parts the scenario lists nor an abstract class in between. Each of the parts does its own work, so no other class is needed."
      betweenHasCode: "`{{type}}` sits between `Measure` and the parts, but it has code of its own, in `{{member}}`. Keep the work in the parts: a class in between may only hold fields, properties and abstract methods."
      typeTest: "The code `{{code}}` tests which kind of `Measure` it has. Each part should only ask the parts it holds, so no code needs to know what they are."
