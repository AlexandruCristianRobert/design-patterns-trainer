title: Scoring formulas for a school science fair
scenario: |
  At a school science fair, judges give each project points for criteria such as `idea`, `build` and `talk`. Each prize then has its own scoring formula, made of parts, where a part can hold other parts, as deep as the organisers like: for one prize it is the idea, plus the better of the build and the talk, plus 2, never more than 20. The organisers want to write a new formula for a new prize without new classes, and to work the same formula out for every project at the fair. All points are whole numbers, never below 0. Write these types:
  - `Entry(string title)` is one project. `Give(string criterion, int points)` records the judges' points for a criterion, replacing what was given before, and `PointsFor(string criterion)` returns them, or 0 for a criterion with no points given.
  - `Score` is an interface or a base class with `int Points(Entry entry)`.
  - Two parts that hold no other part, each a `Score`: `Mark(string criterion)` is the entry's points for that criterion, and `Bonus(int points)` is always that many points.
  - Four parts that hold other parts, each a `Score`: `Added(Score first, Score second)` adds its two parts; `Best(Score first, Score second)` is the higher of the two; `Half(Score score)` is half of its part, rounded down, so half of 7 is 3; and `Capped(int most, Score score)` is its part, but never more than `most`.
  - Each part works out its own `Points` and only asks the parts it holds. No code tests which kind of `Score` it has.

  So the formula above is `Capped(20, Added(Mark("idea"), Added(Best(Mark("build"), Mark("talk")), Half(Bonus(5)))))`. For a volcano with idea 8, build 6 and talk 7 it gives 17, and for a robot bee with idea 9, build 9 and talk 4 it gives 20.
checks:
  marks-and-bonuses-give-their-points:
    title: An entry keeps the points given, and Mark and Bonus give their points
    failures:
      wrongGive: "After giving 4 and then 6 points for `idea`, `PointsFor(\"idea\")` returned {{actual}}. Expected {{expected}}."
      wrongPoints: "For {{entry}}, `{{score}}` gave {{actual}} points. Expected {{expected}}."
  joining-parts-ask-the-parts-they-hold:
    title: Added, Best, Half and Capped work with the parts they hold
    failures:
      wrongPoints: "For {{entry}}, `{{score}}` gave {{actual}} points. Expected {{expected}}."
  nested-formulas-score-every-entry:
    title: Formulas nested four deep score every entry correctly
    failures:
      wrongPoints: "For {{entry}}, `{{score}}` gave {{actual}} points. Expected {{expected}}: each part should ask the parts it holds, all the way down."
  each-part-scores-itself:
    title: Each part is its own Score class and works out its own points
    failures:
      notItsOwnPoints: "`{{type}}` does not work out its own `Points`. Each part should be a `Score` with a `Points` of its own."
      typeTest: "The code `{{code}}` tests which kind of `Score` it has. Each part should only ask the parts it holds, so no code needs to know what they are."
