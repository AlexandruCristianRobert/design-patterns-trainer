title: Write a conference's badges in a small template language
scenario: |
  A conference prints a badge for everyone who comes. `BadgePrinter` writes the text of each kind of badge by hand: `Speaker` gives `SPEAKER ANA SILVA / Northwind`, or `Independent` for a speaker with no company, `Guest` gives `Ana Silva / Northwind`, or the city for a guest with no company, and `Staff` gives `STAFF TOM BERG FROM OSLO`. Each new kind of badge means another method full of `+`, `ToUpperInvariant` and `?:`. `Attendee.Get(field)` reads `"name"`, `"company"` or `"city"`, and gives `""` for an unknown field or one left empty. `Attendee` is finished, so leave it as it is.

  Refactor it into Interpreter, so that each badge is a template, a tree of small words that writes itself for any attendee:
  - Write `BadgeText`, an interface or an abstract class with `string Write(Attendee attendee)`.
  - Write one class per word, each a `BadgeText` with a public constructor:
    - `Words(string text)` writes the same text for everyone.
    - `Field(string name)` writes that field of the attendee.
    - `Upper(BadgeText part)` writes its part in capitals.
    - `Join(BadgeText first, BadgeText second)` writes its first part and then its second, with nothing in between.
    - `OrElse(BadgeText first, BadgeText fallback)` writes its first part, or its fallback when the first part writes `""`.
  - Each word works out its own `Write` and only asks the parts it holds. No code tests which kind of `BadgeText` it has.
  - `BadgePrinter` keeps its public constructor and its three methods. It makes the three templates once and keeps them in fields, and each method only asks its template to write. No `+`, `$"..."`, `ToUpper`, `if`, `?:` or `switch` is left in `BadgePrinter`.

  `Demo.Run()` prints five badges. Its output must stay exactly the same, line for line.
hints:
  - "Start from the small words. `Field` keeps its name and returns `attendee.Get(name)`; `Upper` returns `part.Write(attendee).ToUpperInvariant()`. Only these classes do any writing."
  - "`Join` holds two parts, so a longer text is `Join`s inside `Join`s: `Join(Words(\"STAFF \"), Upper(Join(Field(\"name\"), Join(Words(\" from \"), Field(\"city\")))))` is the staff badge."
  - "In `BadgePrinter`, each template is a field such as `private readonly BadgeText staff = new Join(...);`, and `Staff(attendee)` is `staff.Write(attendee)`."
checks:
  output-unchanged:
    title: Program output is unchanged
    failures:
      outputChanged: "Line {{line}} of the output changed. Expected \"{{expected}}\", got \"{{actual}}\"."
  each-word-writes-its-text:
    title: Each word writes the right text for every attendee
    failures:
      typeNotFound: "There is no type `{{type}}` yet."
      noConstructor: "`{{type}}` has no public constructor that takes {{count}} argument(s) of the types the scenario gives."
      noWrite: "`BadgeText` has no `string Write(Attendee attendee)`."
      wrongText: "For {{attendee}}, `{{template}}` wrote \"{{actual}}\". Expected \"{{expected}}\"."
  nested-templates-write-every-badge:
    title: Templates nested three deep write the right text for every attendee
    failures:
      typeNotFound: "There is no type `{{type}}` yet."
      noConstructor: "`{{type}}` has no public constructor that takes {{count}} argument(s) of the types the scenario gives."
      noWrite: "`BadgeText` has no `string Write(Attendee attendee)`."
      wrongText: "For {{attendee}}, `{{template}}` wrote \"{{actual}}\". Expected \"{{expected}}\": each word should ask the parts it holds, all the way down."
  the-printer-only-keeps-templates:
    title: BadgePrinter keeps three templates and leaves the writing to them
    failures:
      typeNotFound: "There is no type `{{type}}` yet."
      noTemplates: "`BadgePrinter` keeps {{kept}} field(s) that hold a `BadgeText`. Expected 3: one template for each kind of badge, made once."
      printerStillWrites: "`BadgePrinter` still writes text itself, in `{{code}}`. Each method should only ask its template to `Write`."
  each-word-writes-itself:
    title: Each word is its own BadgeText class and writes its own text
    failures:
      typeNotFound: "There is no type `{{type}}` yet."
      notItsOwnWrite: "`{{type}}` does not work out its own `Write`. Each word should be a `BadgeText` with a `Write` of its own."
      typeTest: "The code `{{code}}` tests which kind of `BadgeText` it has. Each word should only ask the parts it holds, so no code needs to know what they are."
