title: Write a conference's badges in a small template language
scenario: |
  A conference prints a badge for everyone who comes. `BadgePrinter` writes each kind of badge by hand: `Speaker` gives `SPEAKER ANA SILVA / Northwind` and `Guest` gives `Ana Silva / Northwind`. Each new kind of badge means another method full of `+` and `ToUpperInvariant`. `Attendee.Get(field)` reads `"name"` or `"company"`. `Attendee` is finished, so leave it as it is.

  Refactor it into Interpreter, so that each badge is a template, a tree of small words that writes itself for any attendee:
  - Write `BadgeText`, an interface or an abstract class with `string Write(Attendee attendee)`.
  - Write one class per word, each a `BadgeText` with a public constructor:
    - `Words(string text)` writes the same text for everyone.
    - `Field(string name)` writes that field of the attendee.
    - `Upper(BadgeText part)` writes its part in capitals.
    - `Join(BadgeText first, BadgeText second)` writes its first part and then its second, with nothing in between.
  - Each word writes its own `Write`; `Upper` and `Join` ask the parts they hold. No class tests what kind of word it holds: no `switch`, `is`, `as`, `typeof` or `GetType()` outside `Attendee`.
  - `BadgePrinter` keeps its public constructor and its two methods, and each method only asks its template to write. Only `Join` and `Upper` use `+`, `$"..."` or `ToUpper`.

  `Demo.Run()` prints four badges. Its output must stay exactly the same, line for line.
hints:
  - "Start from the small words. `Field` keeps its name and returns `attendee.Get(name)`; `Upper` returns `part.Write(attendee).ToUpperInvariant()`; `Join` returns `first.Write(attendee) + second.Write(attendee)`."
  - "`Join` holds two parts, so a longer text is `Join`s inside `Join`s: the guest badge is `Join(Field(\"name\"), Join(Words(\" / \"), Field(\"company\")))`."
  - "In `BadgePrinter`, make each template once in a field, such as `private readonly BadgeText guest = new Join(...);`, and `Guest(attendee)` is `guest.Write(attendee)`."
checks:
  output-unchanged:
    title: Program output is unchanged
    failures:
      outputChanged: "Line {{line}} of the output changed. Expected \"{{expected}}\", got \"{{actual}}\"."
  each-word-writes-its-text:
    title: Each word writes the right text for every attendee
    failures:
      noConstructor: "`{{type}}` has no public constructor that takes {{count}} argument(s) of the types the scenario gives."
      noWrite: "`BadgeText` has no `string Write(Attendee attendee)`."
      wrongText: "For {{attendee}}, `{{template}}` wrote \"{{actual}}\". Expected \"{{expected}}\"."
  nested-templates-write-every-badge:
    title: Templates nested three deep write the right text for every attendee
    failures:
      noConstructor: "`{{type}}` has no public constructor that takes {{count}} argument(s) of the types the scenario gives."
      noWrite: "`BadgeText` has no `string Write(Attendee attendee)`."
      wrongText: "For {{attendee}}, `{{template}}` wrote \"{{actual}}\". Expected \"{{expected}}\": each word should ask the parts it holds, all the way down."
  each-word-is-its-own-class:
    title: Each word is its own BadgeText class, and BadgePrinter leaves the writing to them
    failures:
      notAWord: "`{{type}}` is not a `BadgeText`."
      notItsOwn: "`{{type}}` has no `Write` of its own. Each word should write its own `Write`, not take it from another class."
      writtenByHand: "Text is still put together by hand, in `{{code}}`. Only `Join` and `Upper` use `+`, `$\"...\"` or `ToUpper`; each `BadgePrinter` method should only ask its template to `Write`."
      kindTest: "The code `{{code}}` tests what kind of object it has. Each word should only ask the parts it holds to `Write`, so no code needs to know what they are."
