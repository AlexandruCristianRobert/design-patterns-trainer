title: Finish the price plans of a phone company
scenario: |
  A phone company writes its price plans in a small language, so that a new plan is a new sentence and never new code. Every word of the language is a class that is an `ICharge`, and `Price(usage)` works out what that part costs, in cents, for one month of `Usage`. `usage.Of("minutes")` and `usage.Of("texts")` say how much of each was used. A plan is a tree of these objects, so the same plan prices any month.

  `Usage`, `ICharge`, `Fixed` and `Plus` are finished, so leave them as they are. `Fixed(cents)` is always that many cents, and `Plus(left, right)` adds its two parts. `Plus` is the model: it asks its parts for their price and never looks inside them.

  Finish the other two words, each in its own class with its own `Price`:
  - `Used(item)` is how much of that item was used in the month: with 160 minutes used, `Used("minutes")` is 160.
  - `Times(left, right)` multiplies its two parts, asking each of them for its price.

  So calls at 15 euros a month plus 10 cents a minute are `Plus(Fixed(1500), Times(Used("minutes"), Fixed(10)))`, and with 160 minutes used that plan costs 3100 cents.
hints:
  - "`Used` reads the month it is given: return `usage.Of(item)`."
  - "Follow `Plus`: `Times` asks `left` and `right` for `Price(usage)` and multiplies the two answers."
  - "No word needs to know what its parts are. A part may itself be a whole tree, and asking it for `Price` works it out all the way down."
checks:
  used-reads-the-month:
    title: Used reads how much was used in the month
    failures:
      wrongPrice: "For {{usage}}, `{{sentence}}` was {{actual}}. Expected {{expected}}."
  times-multiplies-its-parts:
    title: Times multiplies its two parts, even when they are trees themselves
    failures:
      wrongPrice: "For {{usage}}, `{{sentence}}` cost {{actual}} cents. Expected {{expected}}."
  whole-plans-price-every-month:
    title: Whole plans, several words deep, price every month correctly
    failures:
      wrongPrice: "For {{usage}}, the plan `{{sentence}}` cost {{actual}} cents. Expected {{expected}}: each word should ask the parts it holds, all the way down."
  each-word-is-its-own-class:
    title: Each word is its own ICharge class
    failures:
      notACharge: "`{{type}}` is not an `ICharge`."
      notItsOwn: "`{{type}}` has no `Price` of its own. Each word should write its own `Price`, not take it from another class."
