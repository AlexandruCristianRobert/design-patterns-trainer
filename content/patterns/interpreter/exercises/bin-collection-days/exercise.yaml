      kind: class
      members: ["EveryNthWeek(int n)", "bool Collects(CollectionDay day)"]
    - name: PublicHoliday
      kind: class
      members: ["PublicHoliday()", "bool Collects(CollectionDay day)"]
    - name: AllOf
      kind: class
      members: ["AllOf(BinRule first, BinRule second)", "bool Collects(CollectionDay day)"]
    - name: AnyOf
      kind: class
      members: ["AnyOf(BinRule first, BinRule second)", "bool Collects(CollectionDay day)"]
    - name: Unless
      kind: class
      members: ["Unless(BinRule rule, BinRule exception)", "bool Collects(CollectionDay day)"]
    - name: BinCalendar
      kind: class
      members: ["BinCalendar()", "void Add(string bin, BinRule rule)", "string BinsOn(CollectionDay day)"]
