title: Bin collection days in a council's own rule language
scenario: |
  A town council collects each kind of bin on its own days, and the days keep changing. Instead of code for each bin, the council wants to write each bin's days as a sentence of a small rule language, such as "Tuesdays and Fridays, unless it is a public holiday". Build it as Interpreter:
  - `CollectionDay(string weekday, bool holiday)` is one day, with `Weekday` and `Holiday` to read. Weekdays are written `Mon`, `Tue`, `Wed` and so on.
  - `BinRule` is an interface or an abstract class with `bool Collects(CollectionDay day)`.
  - Two simple rules: `OnWeekday(string weekday)` is true on that weekday, and `PublicHoliday()` is true on a public holiday.
  - Two rules that hold other rules: `AnyOf(BinRule first, BinRule second)` is true when at least one of them is true, and `Unless(BinRule rule, BinRule exception)` is true when its rule is true and its exception is not.
  - Each of the four rules is its own class that is a `BinRule` and writes its own `Collects`. `AnyOf` and `Unless` never look at the day themselves: they ask the rules they hold. No class tests what kind of rule it holds: no `switch`, `is`, `as`, `typeof` or `GetType()`.

  So paper, `Unless(AnyOf(OnWeekday("Tue"), OnWeekday("Fri")), PublicHoliday())`, goes out on a normal Tuesday or Friday, but not when that day is a public holiday.
hints:
  - "The simple rules only read the day: `OnWeekday` is `day.Weekday == weekday`, and `PublicHoliday` is `day.Holiday`."
  - "The rules that hold rules keep them from their constructor and ask them: `AnyOf` is `first.Collects(day) || second.Collects(day)`."
  - "`Unless` is `rule.Collects(day) && !exception.Collects(day)`. A rule held inside may itself be a whole tree; asking it works it out all the way down."
checks:
  simple-rules-pick-the-right-days:
    title: OnWeekday and PublicHoliday are true on the right days
    failures:
      wrongDay: "On {{day}}, `{{rule}}` said {{actual}}. Expected {{expected}}."
  combined-rules-ask-the-rules-they-hold:
    title: AnyOf and Unless combine the rules they hold
    failures:
      wrongDay: "On {{day}}, `{{rule}}` said {{actual}}. Expected {{expected}}."
  nested-rules-pick-the-right-days:
    title: Rules nested three deep are true on the right days
    failures:
      wrongDay: "On {{day}}, `{{rule}}` said {{actual}}. Expected {{expected}}: each rule should ask the rules it holds, all the way down."
  one-class-per-rule:
    title: Each rule is its own BinRule class
    failures:
      notARule: "`{{type}}` is not a `BinRule`."
      notItsOwn: "`{{type}}` has no `Collects` of its own. Each rule should write its own `Collects`, not take it from another class."
      kindTest: "The code `{{code}}` tests what kind of object it has. Each rule should only ask the rules it holds, so no code needs to know what they are."
