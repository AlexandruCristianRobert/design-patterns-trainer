title: A pocket calculator's formulas as a tree of keys
scenario: |
  A pocket calculator app lets you type a formula once, such as `MR + 2 - 1`, and then works it out again whenever the number in its memory key changes. Each key of the formula is a small object, and the formula is a tree of them. Build it as Interpreter:
  - `Memory(int stored)` is what is in the memory key, with `Stored` to read.
  - `Formula` is an interface or an abstract class with `int Value(Memory memory)`.
  - Two simple keys: `Number(int value)` is always that number, and `Recall()` is whatever is stored in memory.
  - Two keys that hold other formulas: `Add(Formula left, Formula right)` adds its two parts, and `Subtract(Formula left, Formula right)` takes the right part away from the left one.
  - Each of the four keys is its own class that is a `Formula` and writes its own `Value`. `Add` and `Subtract` never read the memory themselves: they ask the formulas they hold. No class tests what kind of formula it holds: no `switch`, `is`, `as`, `typeof` or `GetType()`.

  So `MR + 2 - 1` is `Subtract(Add(Recall(), Number(2)), Number(1))`: with 3 in memory it is 4, and with 10 in memory the same formula is 11.
hints:
  - "The simple keys: `Number` returns the number from its constructor, and `Recall` returns `memory.Stored`."
  - "`Add` keeps its two formulas from the constructor and asks them: `left.Value(memory) + right.Value(memory)`. `Subtract` is the same with `-`."
  - "Try the tree by hand in the program: `new Subtract(new Add(new Recall(), new Number(2)), new Number(1)).Value(new Memory(3))` is 4."
checks:
  number-and-recall-give-their-values:
    title: Number and Recall give their values
    failures:
      wrongValue: "With {{memory}}, `{{formula}}` was {{actual}}. Expected {{expected}}."
  add-and-subtract-work-on-their-two-parts:
    title: Add and Subtract work out their two parts, left and right
    failures:
      wrongValue: "With {{memory}}, `{{formula}}` was {{actual}}. Expected {{expected}}."
  nested-formulas-work-out-every-memory:
    title: Formulas nested three deep are right for every memory
    failures:
      wrongValue: "With {{memory}}, `{{formula}}` was {{actual}}. Expected {{expected}}: each key should ask the formulas it holds, all the way down."
  one-class-per-key:
    title: Each key is its own Formula class
    failures:
      notAFormula: "`{{type}}` is not a `Formula`."
      notItsOwn: "`{{type}}` has no `Value` of its own. Each key should write its own `Value`, not take it from another class."
      kindTest: "The code `{{code}}` tests what kind of object it has. Each key should only ask the formulas it holds, so no code needs to know what they are."
