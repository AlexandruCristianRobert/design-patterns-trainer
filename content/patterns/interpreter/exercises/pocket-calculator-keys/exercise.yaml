      kind: any
      members: ["int Value(Memory memory)"]
    - name: Number
      kind: class
      members: ["Number(int value)", "int Value(Memory memory)"]
    - name: Recall
      kind: class
      members: ["Recall(string key)", "int Value(Memory memory)"]
    - name: Add
      kind: class
      members: ["Add(Formula left, Formula right)", "int Value(Memory memory)"]
    - name: Subtract
      kind: class
      members: ["Subtract(Formula left, Formula right)", "int Value(Memory memory)"]
    - name: Multiply
      kind: class
      members: ["Multiply(Formula left, Formula right)", "int Value(Memory memory)"]
    - name: KeyReader
      kind: class
      members: ["static Formula Read(string keys)"]
