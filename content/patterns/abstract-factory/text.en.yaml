intent: "Provide one object that creates a whole family of related products, so the code that uses them never names a concrete class and can never mix families."
structure:
  counter: "The client. It holds one kitchen, asks it for a drink and a main, and serves them. It knows only the interfaces, never Coffee or FryUp."
  kitchen: "The interface of the factory: one creation method per kind of product in the family, here MakeDrink and MakeMain."
  continental: "A concrete factory for one family. Whatever it makes, it makes from the continental set: a coffee and a croissant."
  english: "A second concrete factory, for the English set. Adding it required no change to BreakfastCounter or to ContinentalKitchen."
  drink: "The interface shared by every drink. The client reads Name through it and nothing else."
  main: "The interface shared by every main. It is a second product kind, so the family has two."
  coffee: "The drink that ContinentalKitchen creates. It knows nothing about kitchens."
  croissant: "The main that ContinentalKitchen creates, the other half of the continental family."
  tea: "The drink that EnglishKitchen creates, through the same MakeDrink method."
  fryup: "The main that EnglishKitchen creates, the other half of the English family."
scene:
  start-continental: "The program creates a BreakfastCounter and hands it a ContinentalKitchen. This is the one place a family is chosen."
  ask-drink-continental: "Serve asks its kitchen for a drink. The counter talks to the kitchen only, through IBreakfastKitchen."
  make-drink-continental: "ContinentalKitchen answers MakeDrink by making a new Coffee."
  ask-main-continental: "Serve asks the same kitchen for a main."
  make-main-continental: "The same ContinentalKitchen makes a new Croissant, so the main comes from the same family as the coffee."
  serve-continental: "Serve reads Name through IDrink and IMain and joins them: \"coffee with croissant\". The counter never named either class."
  start-english: "The program creates a second BreakfastCounter, this time with an EnglishKitchen. Only the kitchen changed."
  ask-drink-english: "Serve runs the same code and asks the kitchen for a drink."
  make-drink-english: "The same call, MakeDrink, now reaches EnglishKitchen, which makes a new Tea."
  ask-main-english: "Serve asks the same kitchen for a main."
  make-main-english: "EnglishKitchen makes a new FryUp, so the tea can only arrive with its matching main."
  serve-english: "The same Serve code produces \"tea with fry-up\": one method, a different family."
lookalikes:
  factory-method: "Factory Method is one overridable method that creates one kind of product and is called by its own base class; Abstract Factory is a separate object with several creation methods, one per kind in a family, which is handed to the code that uses the products."
  builder: "Builder also hides how objects are made, but it assembles one complex object step by step and returns it at the end; Abstract Factory returns each product at once, straight from a creation method, and its point is that the products match."
  prototype: "Prototype makes new objects by copying an existing one instead of calling new on a class; a factory family can be built from prototypes, but the Abstract Factory is the object that offers the whole matching set."
