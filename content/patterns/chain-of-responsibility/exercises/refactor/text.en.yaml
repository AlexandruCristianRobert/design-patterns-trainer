title: Untangle the support inbox's if/else ladder
scenario: |
  A web shop's support emails all arrive in `SupportInbox`. `Route(subject)` decides by itself which team gets the email, in one `if/else` ladder:
  - a subject that contains `refund` goes to billing: `Billing team: Please refund order 1182`;
  - otherwise, one that contains `password` goes to accounts: `Account team: I forgot my password`;
  - otherwise, one that contains `broken` goes to repairs: `Repairs team: My kettle arrived broken`;
  - anything else lands in the general inbox: `General inbox: Do you ship to Iceland?`.

  The order counts: `A refund for a broken kettle` goes to billing, because billing comes first. The shop wants to add teams and change their order without touching the inbox each time.

  Refactor it into Chain of Responsibility:
  - Write `SupportTeam`, an interface or an abstract class with `string Take(string subject)`.
  - Write `BillingTeam`, `AccountTeam` and `RepairsTeam`, each a `SupportTeam` that checks for its own word only: it takes the email, or hands it on to the team after it, which it holds in a field. After the last team, the email lands in the general inbox.
  - `SupportInbox` puts the teams in line, billing, then accounts, then repairs, keeps only the first one, and hands every email to it. It no longer looks at the subject: no `if`, `switch`, `?:` or `Contains` is left in it.
  - No class keeps the teams in a list or an array.

  `Demo.Run()` sends five emails to the inbox. Its output must stay exactly the same, line for line.
hints:
  - "An abstract `SupportTeam(SupportTeam? next)` can hold the next team and a `Pass(subject)` that returns `next.Take(subject)`, or `General inbox: ...` when `next` is null."
  - "Each team is one line: `subject.Contains(\"refund\") ? $\"Billing team: {subject}\" : Pass(subject)`."
  - "In `SupportInbox`, build the line once in a field, `new BillingTeam(new AccountTeam(new RepairsTeam()))`, and let `Route` return `first.Take(subject)`."
checks:
  output-unchanged:
    title: Program output is unchanged
    failures:
      outputChanged: "Line {{line}} of the output changed. Expected \"{{expected}}\", got \"{{actual}}\"."
  each-email-reaches-its-team:
    title: Each email reaches the team whose word it contains
    failures:
      wrongTeam: "The subject \"{{subject}}\" was routed to \"{{actual}}\". Expected \"{{expected}}\"."
  first-team-in-line-wins:
    title: When a subject contains several words, the first team in line takes it
    failures:
      wrongFirstTeam: "The subject \"{{subject}}\" was routed to \"{{actual}}\". Expected \"{{expected}}\": billing comes first, then accounts, then repairs."
  other-emails-go-to-the-general-inbox:
    title: An email no team takes lands in the general inbox
    failures:
      wrongGeneral: "The subject \"{{subject}}\" was routed to \"{{actual}}\". Expected \"{{expected}}\"."
  teams-know-only-the-next:
    title: Each team knows only the next, and the inbox holds only the first
    failures:
      typeNotFound: "There is no type `{{type}}` yet."
      notATeam: "`{{type}}` is not a `SupportTeam`."
      noNext: "`{{type}}` has no field that holds the next `SupportTeam`. Each team should know the team after it."
      inboxHoldsMore: "`SupportInbox` holds {{actual}} teams. Expected {{expected}}: the inbox keeps only the first team in line."
      inboxStillDecides: "`SupportInbox` still looks at the subject itself, with an `if`, a `switch`, a `?:` or a `Contains`. It should hand every email to its first team and let the teams decide."
      keptInACollection: "`{{type}}` keeps teams in a collection, in its field `{{field}}`. Each team should know only the next one, so no class needs a list of them."
