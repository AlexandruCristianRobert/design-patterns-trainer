title: Book the smallest free meeting room
scenario: |
  An office floor has three meeting rooms, and each can be booked once for the morning. A team asks the reception desk for a room for a number of people, and the smallest room that is still free and big enough should take the booking. Build it as Chain of Responsibility:
  - `Room` is an interface or an abstract class with `string Book(int people)`.
  - `Booth`, `SmallRoom` and `Hall` are each a `Room`. A `Booth` seats up to 2 people, a `SmallRoom` up to 6 and a `Hall` up to 20. When a room is still free and seats that many people, `Book` books it and returns `Booth booked for 2`, `Small room booked for 5` or `Hall booked for 15`. From then on that room is booked. Otherwise it hands the request on to the room after it, and books nothing.
  - Each room holds the room after it, set through its constructor or a method, as you like. When no room is next, `Book` returns `No room free for 25` for 25 people.
  - `OfficeFloor.Rooms()` puts a new line of free rooms together, `Booth`, then `SmallRoom`, then `Hall`, and returns the first one. Each call returns a new line, so bookings on one line do not touch another.
  - `Reception` is created with the first room, `Reception(Room firstRoom)`, and keeps just that one. `Request(int people)` hands the request to it and returns the answer. `Reception` does not name `Booth`, `SmallRoom` or `Hall` anywhere in its code.
  - No class keeps the rooms in a list, an array or any other collection, and no class loops over them calling `Book` on each.

  So on one line, asking for 2, 2, 1 and 1 people gives `Booth booked for 2`, `Small room booked for 2`, `Hall booked for 1` and `No room free for 1`. A request for 25 people books nothing, and every room is still free after it.
hints:
  - "An abstract `Room` can hold the next room and a `Pass(people)` that asks it, or returns `No room free for ...` when there is none. Each room then needs only its own seats and a `booked` flag."
  - "`Book` in each room: `if (booked || people > 2) return Pass(people);` then set `booked = true` and return the answer."
  - "`OfficeFloor.Rooms()` creates the three rooms, links each to the next, and returns the booth. `Reception` keeps the `Room` it was given and calls its `Book`."
checks:
  smallest-room-that-fits:
    title: A request goes to the smallest room that fits
    failures:
      wrongRoom: "On a new line, a request for {{people}} people returned \"{{actual}}\". Expected \"{{expected}}\"."
  booked-rooms-send-it-on:
    title: A booked room sends the request on to the next room
    failures:
      wrongSequence: "On one line, requests for 2, 2, 1 and 1 people returned: {{actual}}. Expected {{expected}}."
  too-many-people-books-nothing:
    title: A request no room can take books nothing
    failures:
      wrongTooMany: "A request for 25 people returned \"{{actual}}\". Expected \"{{expected}}\"."
      refusalBookedSomething: "After a request for 25 people, requests for 2, 5 and 15 returned: {{actual}}. Expected {{expected}}: the refused request booked no room."
  each-line-starts-free:
    title: Each call to OfficeFloor.Rooms() returns a new line of free rooms
    failures:
      sharedRooms: "After booking the booth and the small room on one line, a request for 2 on a new line returned \"{{actual}}\". Expected \"{{expected}}\": each line has its own rooms."
  rooms-know-only-the-next:
    title: Each room knows only the next, and the reception desk only the first
    failures:
      notARoom: "`{{type}}` is not a `Room`."
      noNext: "`{{type}}` has no field that holds the next `Room`. Each room should know the room after it."
      receptionHoldsMore: "`Reception` holds {{held}} rooms. Expected 1: the desk keeps only the first room."
      receptionNamesRoom: "`Reception` names `{{room}}`. It should know only the `Room` it was given, not which rooms come after it."
      keptInACollection: "`{{type}}` keeps rooms in a collection, in its field `{{field}}`. Each room should know only the next one, so no class needs a list of them."
      collectionInCode: "The code collects rooms in `{{written}}`. Each room should know only the next one, so no class keeps a list or an array of them."
      loopCallsEach: "The code `{{loop}}` calls `Book` on one room after another. Each room should hand the request on to the next itself, so no class loops over the rooms."
