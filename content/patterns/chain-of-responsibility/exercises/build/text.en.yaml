title: Book the smallest meeting room that fits
scenario: |
  An office floor has three meeting rooms. A team asks the reception desk for a room for a number of people, and the rooms are asked in line: the first room in the line that seats that many people takes the booking. Build it as Chain of Responsibility:
  - `Room` is an interface or an abstract class with `string Book(int people)`.
  - `Booth`, `SmallRoom` and `Hall` are each a `Room`. A `Booth` seats up to 2 people, a `SmallRoom` up to 6 and a `Hall` up to 20. When a room seats that many people, `Book` returns `Booth booked for 2`, `Small room booked for 5` or `Hall booked for 15`. Otherwise it hands the request to the room after it.
  - When no room is next, `Book` returns `No room for 25` (for 25 people).
  - Each room holds the room after it. Give it the next room either way: through a public constructor that takes the next `Room` (`null` for the last), or through a public method that takes it, with a public constructor without parameters.
  - `Reception(Room firstRoom)` keeps just that first room, and `Request(int people)` hands the request to it.
  - No class keeps the rooms in a list or an array.

  So on the line `Booth`, `SmallRoom`, `Hall`, a request for 5 people books the small room. The order matters: on the line `Hall`, `Booth`, a request for 2 people books the hall.
hints:
  - "An abstract `Room` can hold the next room in a field, with a `Then(Room next)` that sets it, and a `Pass(people)` that returns `next.Book(people)`, or `No room for ...` when `next` is null."
  - "Each room's `Book` is one line: `people <= 2 ? $\"Booth booked for {people}\" : Pass(people)`."
  - "`Reception` keeps the `Room` it was given and returns `firstRoom.Book(people)`."
checks:
  each-request-reaches-the-room-that-fits:
    title: A request goes to the first room in line that seats everyone
    failures:
      wrongRoom: "On the line {{line}}, a request for {{people}} people returned \"{{actual}}\". Expected \"{{expected}}\"."
      wrongDesk: "A `Reception` given the line Booth, SmallRoom, Hall answered a request for {{people}} people with \"{{actual}}\". Expected \"{{expected}}\": the desk hands the request to its first room."
      cannotLink: "`{{type}}` has neither a public constructor that takes the next `Room` nor a public constructor without parameters and a public method that takes it, so it cannot be put in a line."
  order-of-the-rooms-matters:
    title: The order of the rooms decides which one takes the booking
    failures:
      wrongRoom: "On the line {{line}}, a request for {{people}} people returned \"{{actual}}\". Expected \"{{expected}}\": the first room in line that seats everyone takes it."
      cannotLink: "`{{type}}` has neither a public constructor that takes the next `Room` nor a public constructor without parameters and a public method that takes it, so it cannot be put in a line."
  no-room-fits:
    title: A request no room can take gets "No room for ..."
    failures:
      wrongRoom: "On the line {{line}}, a request for {{people}} people returned \"{{actual}}\". Expected \"{{expected}}\": no room seats that many."
      cannotLink: "`{{type}}` has neither a public constructor that takes the next `Room` nor a public constructor without parameters and a public method that takes it, so it cannot be put in a line."
  rooms-know-only-the-next:
    title: Each room knows only the next, and the reception desk only the first
    failures:
      notARoom: "`{{type}}` is not a `Room`."
      noNext: "`{{type}}` has no field that holds the next `Room`. Each room should know the room after it."
      receptionHoldsMore: "`Reception` holds {{actual}} rooms. Expected {{expected}}: the desk keeps only the first room."
      keptInACollection: "`{{type}}` keeps rooms in a collection, in its field `{{field}}`. Each room should know only the next one, so no class needs a list of them."
