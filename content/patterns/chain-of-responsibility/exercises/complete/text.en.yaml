title: Finish the recycling sorting line
scenario: |
  At a recycling plant, rubbish rides a belt past a row of machines. Each `Item` has a `Name`, a `Material` and its weight in `Grams`. Every machine is a `Sorter`: `Sort(item)` either takes the item and says where it went, or passes it on to the machine after it. `a.SetNext(b).SetNext(c)` builds the line a, b, c. `SortingLine` holds only the first machine and feeds every item to it. `Item`, `Magnet` and `SortingLine` are finished. `Magnet` takes metal: `steel can goes to the metal bin`.

  Finish the rest:
  - `Pass(item)` in `Sorter` hands the item to the next machine and returns its answer. When no machine is next, nothing took the item, so it goes to general waste: `plastic tub goes to general waste`.
  - `Blower` takes every item under 30 grams, whatever it is made of: `paper napkin goes to the light bin`. Anything else goes on.
  - `GlassEye` takes glass: `jam jar goes to the glass bin`. Anything else goes on.

  The first machine on the line that can take an item takes it, so the order matters: a metal bottle cap of 4 grams goes to the metal bin if `Magnet` comes first, but to the light bin if `Blower` comes first. A machine on its own sends what it does not take to general waste.

  Keep the chain: `SortingLine` holds just the first machine, and no class keeps the machines in a list or an array.
hints:
  - "`Pass` needs only the `next` field: `next is null ? $\"{item.Name} goes to general waste\" : next.Sort(item)`."
  - "Copy the shape of `Magnet`: `Blower` tests `item.Grams < 30`, `GlassEye` tests `item.Material == \"glass\"`, and both return `Pass(item)` when the test fails."
checks:
  each-item-reaches-its-bin:
    title: Each item reaches the bin of the machine that takes it
    failures:
      wrongBin: "On the line Magnet, Blower, GlassEye, the {{item}} gave \"{{actual}}\". Expected \"{{expected}}\"."
  order-on-the-belt-matters:
    title: The first machine on the line that can take an item takes it
    failures:
      wrongFirstTaker: "On the line {{line}}, the item gave \"{{actual}}\". Expected \"{{expected}}\": the first machine that can take it does."
  leftovers-go-to-general-waste:
    title: An item no machine takes goes to general waste
    failures:
      wrongLeftover: "On the line {{line}}, the {{item}} gave \"{{actual}}\". Expected \"{{expected}}\": no machine takes it."
  machines-know-only-the-next:
    title: The belt holds only the first machine, and no class lists the machines
    failures:
      lineHoldsMore: "`SortingLine` holds {{actual}} machines. Expected {{expected}}: the belt knows only the first machine."
      keptInACollection: "`{{type}}` keeps machines in a collection, in its field `{{field}}`. Each machine should know only the next one, so no class needs a list of them."
