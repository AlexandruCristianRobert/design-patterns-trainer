title: Take the tax rules out of the incomes
scenario: |
  A tax return lists a person's incomes for the year: a `Salary`, or `Rent` from a flat with the costs of letting it. `TaxReturn.TaxableIncome()` adds up what is taxed: the whole salary, and the rent less its costs. `Lines()` gives one line for each income, in the order of the return, such as `salary: 30000 EUR` or `rent: 9000 EUR, costs 2000 EUR`.

  It works, but each income class carries the rules of every part of the return, in `Taxable()` and `Line()`, so every new part of the return means a new method in every income class. Refactor it to the Visitor pattern:
  - Write `IIncomeVisitor` with one method for each income class, taking that class. It may be an interface or an abstract class (then it may be called `IncomeVisitor`), use `Visit` overloads or names such as `VisitSalary`, and return a value or keep its result.
  - Each income class has its own `Accept`, taking the visitor, that calls the visitor's method for its own class with itself.
  - `Taxable()` and `Line()` leave the incomes and become two visitors. `TaxReturn` keeps its two methods and runs the visitors over the incomes through `Accept`.
  - No code asks which income it has: no `is`, `as` or `switch` on an income class, and no `GetType()`.

  `Demo.Run()` prints a whole return. Its output must stay exactly the same, line for line.
hints:
  - "Start with `public interface IIncomeVisitor { void Visit(Salary salary); void Visit(Rent rent); }`, and replace the two methods of `IIncome` with `void Accept(IIncomeVisitor visitor);`."
  - "In each income class, `Accept` is one line: `public void Accept(IIncomeVisitor visitor) => visitor.Visit(this);`. There, `this` is that class, so the right overload runs."
  - "A visitor `TaxableTotal` can keep a `Total` and add to it in each `Visit`: `public void Visit(Rent rent) => Total += rent.Amount - rent.Costs;`. `TaxableIncome()` makes one, calls `income.Accept(total)` for every income and returns `total.Total`."
checks:
  output-unchanged:
    title: Program output is unchanged
    failures:
      outputChanged: "Line {{line}} of the output changed. Expected \"{{expected}}\", got \"{{actual}}\"."
  taxable-income-adds-up-every-income:
    title: The taxable income adds up every kind of income
    failures:
      wrongTaxable: "For rent of 5000 with 4000 costs, a salary of 1000 and rent of 1200 with 300 costs, `TaxableIncome()` was {{actual}}. Expected {{expected}}, as before the refactoring."
  lines-describe-each-income:
    title: Each income gets its line, in the order of the return
    failures:
      wrongLines: "The lines were \"{{actual}}\". Expected \"{{expected}}\" (joined with ` | ` here), as before the refactoring."
  each-income-accepts-a-visitor:
    title: Each income accepts a visitor, which has one method for each income
    failures:
      noVisitor: "There is no `IIncomeVisitor` yet (or `IncomeVisitor`, if you made it an abstract class)."
      notOneVisit: "`{{visitor}}` has {{count}} methods that take a `{{income}}`. Expected exactly one, so that each income has one method to call."
      noAccept: "`{{income}}` has no `Accept` of its own that takes the visitor. Each income class needs one, so that it can call the visitor's method for its own class."
      ruleLeft: "`{{income}}` still has `{{member}}`. Move that rule into a visitor: the incomes keep only their data and `Accept`."
      asksTheKind: "The code `{{code}}` asks which kind of income it has. Let each income call the visitor's method for its own class instead."
