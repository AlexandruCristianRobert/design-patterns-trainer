title: Build the reports of an estate agent
scenario: |
  An estate agent lists flats and houses. The office keeps asking for new reports about them, while the kinds of listing stay the same, so each report is a visitor and the listing classes never change for a new one. Build it with the Visitor pattern:
  - `Flat` and `House` are each an `IListing` (an interface or an abstract class), with the constructors and properties of the Contract. `House.Garden` is the garden in m².
  - `Agency` is given its listings in its constructor. `Fees()` adds up what the agency charges a month: 20 EUR a room for a flat and 30 EUR a room for a house. `Cards()` gives one shop-window card for each listing, in order: `3-room flat, floor 2` for a flat and `4-room house, 120 m² garden` for a house.
  - Write `IListingVisitor` with one method for each listing class, taking that class. It may be an interface or an abstract class (then it may be called `ListingVisitor`), use `Visit` overloads or names such as `VisitFlat`, and return a value or keep its result.
  - Each listing class has its own `Accept`, taking the visitor, that calls the visitor's method for its own class with itself. The fees and the cards are two visitors, and `Agency` runs them over its listings through `Accept`.
  - No code asks which listing it has: no `is`, `as` or `switch` on a listing class, and no `GetType()`.

  So a 3-room flat and a 4-room house cost 60 + 120 = 180 EUR a month.
hints:
  - "Start with `public interface IListingVisitor { void Visit(Flat flat); void Visit(House house); }` and `public interface IListing { void Accept(IListingVisitor visitor); }`. In each listing, `Accept` is `public void Accept(IListingVisitor visitor) => visitor.Visit(this);`."
  - "A `MonthlyFees` visitor can keep a `Total`: `public void Visit(Flat flat) => Total += 20 * flat.Rooms;`. A `WindowCards` visitor keeps a `List<string>` and adds one card in each `Visit`."
  - "`Agency.Fees()` makes a `MonthlyFees`, calls `listing.Accept(fees)` for every listing and returns `fees.Total`. `Cards()` does the same with `WindowCards`."
checks:
  fees-follow-each-listing:
    title: The fees follow the rule of each kind of listing
    failures:
      wrongFees: "For a 3-room flat, a 4-room house and a 1-room flat, `Fees()` was {{actual}}. Expected {{expected}}."
  window-cards-describe-each-listing:
    title: Each listing gets its window card, in order
    failures:
      wrongCards: "The cards were \"{{actual}}\". Expected \"{{expected}}\" (joined with ` | ` here)."
  each-listing-accepts-a-visitor:
    title: Each listing accepts a visitor, which has one method for each listing
    failures:
      noVisitor: "There is no `IListingVisitor` yet (or `ListingVisitor`, if you made it an abstract class)."
      notOneVisit: "`{{visitor}}` has {{count}} methods that take a `{{listing}}`. Expected exactly one, so that each listing has one method to call."
      noAccept: "`{{listing}}` has no `Accept` of its own that takes the visitor. Each listing class needs one, so that it can call the visitor's method for its own class."
      asksTheKind: "The code `{{code}}` asks which kind of listing it has. Let each listing call the visitor's method for its own class instead."
