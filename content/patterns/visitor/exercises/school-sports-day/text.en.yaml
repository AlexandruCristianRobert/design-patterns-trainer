title: Build the points and certificates of a school sports day
scenario: |
  At a school sports day, each result is a `Sprint` (a pupil's place) or a `LongJump` (a pupil's jump in whole metres). The teachers want a points total and a certificate for every result, and next year they will want more reports, while the events stay the same. Build it with the Visitor pattern:
  - `Sprint` and `LongJump` are each an `IResult` (an interface or an abstract class), with the constructors and properties of the Contract.
  - `SportsDay` is given its results in its constructor. `Points()` adds up the points: a sprint gives 5 points for place 1 and 1 point for any other place, and a long jump gives 1 point a metre. `Certificates()` gives one line for each result, in order: `Ana: sprint, place 1` for a sprint and `Ben: long jump, 4 m` for a long jump.
  - Write `IResultVisitor` with one method for each result class, taking that class. It may be an interface or an abstract class (then it may be called `ResultVisitor`), use `Visit` overloads or names such as `VisitSprint`, and return a value or keep its result.
  - Each result class has its own `Accept`, taking the visitor, that calls the visitor's method for its own class with itself. The points and the certificates are two visitors, and `SportsDay` runs them over its results through `Accept`.
  - No code asks which result it has: no `is`, `as` or `switch` on a result class, and no `GetType()`.

  So Ana winning a sprint, Ben jumping 4 m and Cleo coming third in a sprint give 5 + 4 + 1 = 10 points.
hints:
  - "Start with `public interface IResultVisitor { void Visit(Sprint sprint); void Visit(LongJump jump); }` and `public interface IResult { void Accept(IResultVisitor visitor); }`. In each result, `Accept` is `public void Accept(IResultVisitor visitor) => visitor.Visit(this);`."
  - "A `HousePoints` visitor can keep a `Total`: `public void Visit(Sprint sprint) => Total += sprint.Place == 1 ? 5 : 1;`. A `CertificateList` visitor keeps a `List<string>` and adds one line in each `Visit`."
  - "`SportsDay.Points()` makes a `HousePoints`, calls `result.Accept(points)` for every result and returns `points.Total`. `Certificates()` does the same with `CertificateList`."
checks:
  points-follow-each-event:
    title: The points follow the rule of each event
    failures:
      wrongPoints: "For Ana winning a sprint, Ben jumping 4 m, Cleo third in a sprint and Dan jumping 2 m, `Points()` was {{actual}}. Expected {{expected}}."
  a-certificate-for-each-result:
    title: Each result gets its certificate, in order
    failures:
      wrongCertificates: "The certificates were \"{{actual}}\". Expected \"{{expected}}\" (joined with ` | ` here)."
  each-result-accepts-a-visitor:
    title: Each result accepts a visitor, which has one method for each result
    failures:
      noVisitor: "There is no `IResultVisitor` yet (or `ResultVisitor`, if you made it an abstract class)."
      notOneVisit: "`{{visitor}}` has {{count}} methods that take a `{{result}}`. Expected exactly one, so that each result has one method to call."
      noAccept: "`{{result}}` has no `Accept` of its own that takes the visitor. Each result class needs one, so that it can call the visitor's method for its own class."
      asksTheKind: "The code `{{code}}` asks which kind of result it has. Let each result call the visitor's method for its own class instead."
