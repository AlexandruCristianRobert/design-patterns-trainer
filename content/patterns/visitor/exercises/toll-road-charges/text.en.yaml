title: Turn the switches of a toll road into visitors
scenario: |
  A toll road charges each vehicle at the barrier: a `Car` pays 4 EUR, a `Lorry` 5 EUR an axle and a `Motorbike` 2 EUR. `TollRoad.Takings(vehicles)` adds up what the vehicles paid, and `TollRoad.Tickets(vehicles)` prints one ticket for each vehicle, in the order they passed, such as `AB-123: car` or `LK-77: lorry, 4 axles`.

  It works, but each method is a `switch` on the kind of vehicle. When the road starts to take buses, every `switch` has to be found, and one that was missed still compiles: the bus falls through to the `_` arm. Refactor it to the Visitor pattern, so that a new kind of vehicle is a compile error in every report that lacks it:
  - Write `IVehicleVisitor` with one method for each vehicle class, taking that class. It may be an interface or an abstract class (then it may be called `VehicleVisitor`), use `Visit` overloads or names such as `VisitCar`, and return a value or keep its result.
  - Each vehicle class has its own `Accept`, taking the visitor, that calls the visitor's method for its own class with itself.
  - Each `switch` becomes a visitor. `TollRoad` keeps its two methods and runs the visitors over the vehicles through `Accept`.
  - No code asks which vehicle it has: no `is`, `as` or `switch` on a vehicle class, and no `GetType()`.

  `Demo.Run()` prints the tickets and the takings of one morning. Its output must stay exactly the same, line for line.
hints:
  - "Start with `public interface IVehicleVisitor { void Visit(Car car); void Visit(Lorry lorry); void Visit(Motorbike motorbike); }`, and give `IVehicle` the method `void Accept(IVehicleVisitor visitor);`. In each vehicle class it is `public void Accept(IVehicleVisitor visitor) => visitor.Visit(this);`."
  - "Each arm of a `switch` becomes one `Visit` in a visitor: `Lorry lorry => 5 * lorry.Axles` becomes `public void Visit(Lorry lorry) => Total += 5 * lorry.Axles;` in a `TollCharge` visitor."
  - "`TollRoad.Takings` then makes a `TollCharge`, calls `vehicle.Accept(charge)` for each vehicle and returns `charge.Total`. The `_` arms have no visitor method: they are gone."
checks:
  output-unchanged:
    title: Program output is unchanged
    failures:
      outputChanged: "Line {{line}} of the output changed. Expected \"{{expected}}\", got \"{{actual}}\"."
  each-vehicle-pays-its-toll:
    title: Each kind of vehicle pays its toll
    failures:
      wrongTakings: "For a motorbike, a lorry with 2 axles, a car and a lorry with 6 axles, `Takings` was {{actual}}. Expected {{expected}}, as before the refactoring."
  each-vehicle-gets-its-ticket:
    title: Each vehicle gets its ticket, in the order they passed
    failures:
      wrongTickets: "The tickets were \"{{actual}}\". Expected \"{{expected}}\" (joined with ` | ` here), as before the refactoring."
  each-vehicle-accepts-a-visitor:
    title: Each vehicle accepts a visitor, which has one method for each vehicle
    failures:
      noVisitor: "There is no `IVehicleVisitor` yet (or `VehicleVisitor`, if you made it an abstract class)."
      notOneVisit: "`{{visitor}}` has {{count}} methods that take a `{{vehicle}}`. Expected exactly one, so that each vehicle has one method to call."
      noAccept: "`{{vehicle}}` has no `Accept` of its own that takes the visitor. Each vehicle class needs one, so that it can call the visitor's method for its own class."
      asksTheKind: "The code `{{code}}` asks which kind of vehicle it has. Let each vehicle call the visitor's method for its own class instead."
