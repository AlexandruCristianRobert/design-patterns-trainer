title: Finish the reports of a marina
scenario: |
  A small marina rents out three kinds of mooring: `YachtMooring`, `MotorboatMooring` and `HouseboatMooring`. The dock master keeps asking for new reports about tonight's boats, so each report is a visitor of its own that implements `IMooringVisitor`, with one `Visit` overload for each mooring class. Each mooring's `Accept(visitor)` calls `visitor.Visit(this)`, and because `this` is that mooring's own class, the right overload runs.

  `IMooring`, `IMooringVisitor`, `YachtMooring`, `MotorboatMooring` and `NightlyFees` are finished: leave them as they are and use them as the model. `NightlyFees` adds up tonight's fees in `Total`: 3 EUR a metre for a yacht, 2 EUR a metre for a motorboat and 15 EUR a berth for a houseboat.

  Finish the rest:
  - `HouseboatMooring.Accept` calls `visitor.Visit(this)` once, as the other moorings do, so any report, even a new one, gets the houseboat.
  - `DockList` adds one line to `Lines` for each mooring, in the order it gets them: `Ana: yacht, 12 m`, `Ben: motorboat, 9 m` and `Cleo: houseboat, 3 berths`.

  So Ana's 12 m yacht, Ben's 9 m motorboat and Cleo's houseboat with 3 berths pay 36 + 18 + 45 = 99 EUR tonight.
hints:
  - "`HouseboatMooring.Accept` is the same one line as in `YachtMooring`: `visitor.Visit(this);`. In `HouseboatMooring`, `this` is a `HouseboatMooring`, so `Visit(HouseboatMooring)` runs."
  - "Each `Visit` in `DockList` adds one line, like the yacht one: `Lines.Add($\"{mooring.Owner}: motorboat, {mooring.Metres} m\");`."
  - "For the houseboat, write `{mooring.Berths} berths` instead of the metres."
checks:
  fees-count-every-mooring:
    title: NightlyFees counts every kind of mooring
    failures:
      houseboatNotCounted: "For Cleo's houseboat with 3 berths, `NightlyFees.Total` was {{actual}}. Expected {{expected}}: finish `HouseboatMooring.Accept` so that it calls `visitor.Visit(this)`."
      wrongTotal: "For a 12 m yacht, a 9 m motorboat, a houseboat with 3 berths and a 6 m motorboat, `NightlyFees.Total` was {{actual}}. Expected {{expected}}."
  dock-list-has-a-line-per-mooring:
    title: DockList writes one line for each mooring, in order
    failures:
      wrongLines: "The dock list was \"{{actual}}\". Expected \"{{expected}}\" (the lines are joined with ` | ` here)."
  each-mooring-calls-its-own-visit:
    title: Each mooring calls its own Visit, even for a report it has never seen
    failures:
      wrongVisit: "Given a new report class that implements `IMooringVisitor`, `{{mooring}}.Accept` called {{actual}}. Expected {{expected}}, once: a mooring hands itself to any visitor with `visitor.Visit(this)`."
