title: Finish the states of a microwave
scenario: |
  A microwave has a door and a start button. What they do depends on whether the microwave is `ready`, has its `door open`, or is `cooking`, so each state is a class of its own that implements `IOvenState`. `Microwave` holds the current state and passes every button on to it, with itself: `OpenDoor()` calls `state.OpenDoor(this)`. A state answers with a short text and, when the button changes what the microwave is doing, calls `oven.SetState(...)` with the next state. `Status` gives the current state's `Name`. A new microwave is `ready`.

  Most of it is written. Finish the three TODOs. `Microwave.Start()` passes start on to the current state, like the other two buttons. In `Ready`, start answers `cooking` and goes to `cooking`. In `Cooking`, opening the door answers `stopped, door open` and goes to `door open`.

  `Microwave` keeps holding its state in an `IOvenState` field, with one class per state, and no `enum`, `string` or `bool` field to switch on.
hints:
  - "`Microwave.Start()` is one line, like `OpenDoor()` above it: `=> state.Start(this);`."
  - "`DoorOpen.CloseDoor` is the model for a button that changes the state: call `oven.SetState(new Ready());`, then return the answer."
  - "`Ready.Start` calls `oven.SetState(new Cooking());` and returns `\"cooking\"`; `Cooking.OpenDoor` calls `oven.SetState(new DoorOpen());` and returns `\"stopped, door open\"`."
checks:
  ready-starts-cooking:
    title: A ready microwave starts cooking
    failures:
      notReached: "A new microwave should be `{{expected}}`, but `Status` was \"{{actual}}\"."
      wrongResult: "In `{{stage}}`, {{button}} answered \"{{actual}}\". Expected \"{{expected}}\". Check `Microwave.Start()` and `Ready.Start`."
      wrongNext: "In `{{stage}}`, after {{button}} the microwave was `{{actual}}`. Expected `{{expected}}`: the state calls `oven.SetState(...)` with the next one, or leaves it alone."
  opening-the-door-stops-cooking:
    title: Opening the door while cooking stops it
    failures:
      notReached: "Pressing start on a new microwave should reach `{{expected}}`, but `Status` was \"{{actual}}\". Finish `Microwave.Start()` and `Ready.Start` first."
      wrongResult: "In `{{stage}}`, {{button}} answered \"{{actual}}\". Expected \"{{expected}}\". Finish `Cooking.OpenDoor`."
      wrongNext: "In `{{stage}}`, after {{button}} the microwave was `{{actual}}`. Expected `{{expected}}`: the state calls `oven.SetState(...)` with the next one, or leaves it alone."
  a-whole-meal:
    title: A whole meal, from opening the door to taking the food out
    failures:
      wrongStep: "At step {{step}}, {{button}} answered \"{{actual}}\". Expected \"{{expected}}\"."
      wrongStepNext: "At step {{step}}, after {{button}} the microwave was `{{actual}}`. Expected `{{expected}}`."
  one-class-per-state:
    title: The microwave holds its current state as an object, with one class per state
    failures:
      statusField: "`{{type}}` has the field `{{field}}` of type `{{fieldType}}`. Keep what the microwave is doing only as its current `IOvenState`, and let each state class decide."
      noStageField: "`{{type}}` has no field typed as `IOvenState`. Keep the current state in one, as the given `Microwave` does."
      tooFewStages: "`{{type}}` holds its current state in `{{field}}`, typed `{{fieldType}}`, but only {{actual}} class(es) implement it. Expected at least {{expected}}: one per state."
