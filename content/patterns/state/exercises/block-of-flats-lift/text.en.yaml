title: Build the states of a lift in a block of flats
scenario: |
  The lift in a block of flats has a call button, a close-doors button, and a sensor that calls `Arrive()` when the lift reaches the floor. What each one does depends on whether the lift is `idle`, `moving` or has its `doors open`. Build it with the State pattern. `Lift` has a public constructor without parameters and starts `idle`. `Status` gives the current state's name, and each button returns a short answer. A button with no "goes to" below leaves the lift where it is.

  When `idle`: `Call()` answers `on its way` and goes to `moving`. `Arrive()` answers `not moving`, and `CloseDoors()` answers `doors already closed`.

  When `moving`: `Call()` answers `busy`. `Arrive()` answers `doors opening` and goes to `doors open`. `CloseDoors()` answers `doors already closed`.

  When `doors open`: `Call()` answers `close the doors first`. `Arrive()` answers `not moving`. `CloseDoors()` answers `doors closed` and goes to `idle`.

  Write a state interface or abstract class, and one class per state that answers the buttons and switches the lift to the next state. `Lift` holds the current state in a field typed as your interface or abstract class, passes every button on to it, and has no `enum`, `string` or `bool` field to switch on.
hints:
  - "Start with `public abstract class LiftState { public abstract string Name { get; } public abstract string Call(Lift lift); ... }`. A `virtual` method gives the answer most states share, such as `public virtual string Arrive(Lift lift) => \"not moving\";`, and only `Moving` overrides it."
  - "`Lift` has `private LiftState state = new Idle();`, `public string Status => state.Name;`, a `public void SetState(LiftState next) => state = next;`, and one line per button: `public string Call() => state.Call(this);`."
  - "A button that moves the lift on calls `lift.SetState(new Moving());` and then returns its answer."
checks:
  an-idle-lift-sets-off-when-called:
    title: An idle lift sets off when called
    failures:
      notReached: "A new lift should be `{{expected}}`, but `Status` was \"{{actual}}\"."
      wrongResult: "When `{{stage}}`, {{button}} answered \"{{actual}}\". Expected \"{{expected}}\"."
      wrongNext: "When `{{stage}}`, after {{button}} the lift was `{{actual}}`. Expected `{{expected}}`: the state switches the lift to the next one, or leaves it alone."
  a-moving-lift-opens-its-doors-on-arrival:
    title: A moving lift opens its doors when it arrives
    failures:
      notReached: "After a call, the lift should be `{{expected}}`, but `Status` was \"{{actual}}\". Check how an idle lift answers a call first."
      wrongResult: "When `{{stage}}`, {{button}} answered \"{{actual}}\". Expected \"{{expected}}\"."
      wrongNext: "When `{{stage}}`, after {{button}} the lift was `{{actual}}`. Expected `{{expected}}`: the state switches the lift to the next one, or leaves it alone."
  open-doors-must-close-first:
    title: With its doors open, the lift goes nowhere until they close
    failures:
      notReached: "After a call and an arrival, the lift should be `{{expected}}`, but `Status` was \"{{actual}}\". Check how a moving lift arrives first."
      wrongResult: "When `{{stage}}`, {{button}} answered \"{{actual}}\". Expected \"{{expected}}\"."
      wrongNext: "When `{{stage}}`, after {{button}} the lift was `{{actual}}`. Expected `{{expected}}`: the state switches the lift to the next one, or leaves it alone."
  one-class-per-state:
    title: The lift holds its current state as an object, with one class per state
    failures:
      statusField: "`{{type}}` has the field `{{field}}` of type `{{fieldType}}`. Keep what the lift is doing only as the current state object, and let each state class decide."
      noStageField: "`{{type}}` has no field typed as an interface or class of yours that other classes are. Keep the current state in such a field."
      tooFewStages: "`{{type}}` holds its current state in `{{field}}`, typed `{{fieldType}}`, but only {{actual}} class(es) are that type. Expected at least {{expected}}: one per state."
