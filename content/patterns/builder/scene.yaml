actors:
  - id: program
    name: program
    role: concrete
  - id: builder
    name: builder
    role: primary
  - id: booking
    name: booking
    role: concrete
steps:
  - id: start
    call: { from: program, to: builder, label: "new BookingBuilder()" }
    state:
      builder: { choices: "none yet" }
    code: [2, 2]
  - id: carriage
    call: { from: program, to: builder, label: "WithCarriage(\"bike\")" }
    state:
      builder: { choices: "bike carriage" }
    code: [4, 4]
  - id: bike
    call: { from: program, to: builder, label: "WithBike()" }
    state:
      builder: { choices: "bike carriage, bike" }
    code: [5, 5]
  - id: build
    call: { from: program, to: builder, label: "Build()" }
    code: [6, 6]
  - id: make
    call: { from: builder, to: booking, label: "new Booking()" }
    state:
      booking: { made: "yes, checked" }
    code: [55, 55]
  - id: handback
    call: { from: builder, to: program, label: "returns the Booking" }
    state:
      program: { holds: "the checked Booking" }
    code: [6, 6]
  - id: frozen
    state:
      booking: { changes: "none possible" }
    code: [24, 24]
  - id: start-bad
    call: { from: program, to: builder, label: "new BookingBuilder()" }
    state:
      builder: { choices: "none yet" }
      booking: { made: "no" }
    code: [12, 12]
  - id: bike-bad
    call: { from: program, to: builder, label: "WithBike()" }
    state:
      builder: { choices: "bike, standard carriage" }
    code: [12, 12]
  - id: build-bad
    call: { from: program, to: builder, label: "Build()" }
    state:
      booking: { made: "no, Build() threw" }
    code: [54, 54]
  - id: caught
    state:
      program: { printed: "Rejected: a bike needs..." }
    code: [15, 17]
