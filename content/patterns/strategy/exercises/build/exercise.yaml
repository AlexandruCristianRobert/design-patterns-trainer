kind: build
version: 2
contract:
  types:
    - name: GradingScheme
      kind: any
      members: ["string Grade(int score)"]
    - name: Percentage
      kind: class
      members: ["Percentage()"]
    - name: PassFail
      kind: class
      members: ["PassFail(int passMark)"]
    - name: ReportCard
      kind: class
      members:
        - "ReportCard(GradingScheme scheme)"
        - "GradingScheme Scheme { get; set; }"
        - "List<string> Grades(List<int> scores)"
