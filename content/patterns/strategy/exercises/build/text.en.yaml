title: Grade a report card
scenario: |
  A school prints report cards, but each course grades differently. A `ReportCard` is created with a `GradingScheme` and turns a list of scores into a list of grades, one per score, in the same order.

  Two schemes exist today:
  - `Percentage` shows the score with a percent sign: 95 becomes `95%`.
  - `PassFail` is created with a pass mark. A score at or above it is `pass`; below it is `fail`.

  A course can move to another scheme: setting `ReportCard.Scheme` makes the next `Grades` call use the new scheme.

  `ReportCard` must not name `Percentage`, `PassFail` or any other scheme, so a new scheme needs no change to it. `ReportCard` never checks which scheme it holds: no `if`, `switch`, `?:` or `is` in it. `GradingScheme` can be an interface or an abstract class. Implement the types listed in the Contract.
hints:
  - "`GradingScheme` needs one member, `string Grade(int score)`. `Percentage` and `PassFail` each implement or extend it with their own one-line rule."
  - "`ReportCard` keeps the current scheme in `public GradingScheme Scheme { get; set; }`, set from the constructor."
  - "`Grades` asks `Scheme` for one grade per score, for example `scores.Select(Scheme.Grade).ToList()`. `PassFail` stores its pass mark from the constructor and compares with `>=`."
checks:
  percentage-scheme:
    title: Percentage shows each score with a percent sign
    failures:
      wrongPercentages: "For 95 and 7, `Percentage` gave: {{actual}}. Expected {{expected}}."
  pass-fail-scheme:
    title: PassFail compares each score with its pass mark
    failures:
      wrongPassFail: "With a pass mark of 50, the scores 80 and 30 were graded: {{actual}}. Expected {{expected}}."
      passMarkIgnored: "With a pass mark of 90, a score of 80 was graded: {{actual}}. Expected {{expected}}. Use the pass mark given to the constructor."
  scheme-can-change:
    title: A report card accepts a new scheme
    failures:
      wrongBefore: "With `Percentage`, a score of 85 was graded {{actual}}. Expected {{expected}}."
      changeIgnored: "After setting `Scheme` to `PassFail(50)`, a score of 85 was graded {{actual}}. Expected {{expected}}: the next `Grades` call should use the new scheme."
  report-card-knows-only-the-scheme:
    title: ReportCard depends only on GradingScheme
    failures:
      cardNamesScheme: "The `ReportCard` class mentions `{{type}}`. It should only know about `GradingScheme`."
      cardBranches: "`ReportCard` contains an `if`, `switch`, `?:` or `is`. It should not check which scheme it holds; let `Scheme.Grade` decide."
