title: Untangle the contact export
scenario: |
  An address book exports its contacts in three formats: CSV (`Name,email`), mail (`Name <email>`) and label (`Name: email`). `ContactExporter.Export` takes an `ExportFormat` and picks the line for each contact with a `switch`. Every new format means another edit to `ContactExporter`.

  Refactor it into Strategy. Each format becomes its own piece of code behind one shared type, and `ContactExporter` is given the format to use. You choose the shape: an interface, an abstract class or a delegate for the format, and the constructor, a property or a method argument to hand it over. `ContactExporter` keeps the part every format shares, the `export of N contacts` line.

  When you are done, `ContactExporter` must contain no `switch`, must not mention `ExportFormat` or call `GetType`, and must not name any of the format classes. You may delete `ExportFormat`. Leave `Contact` and `Screen` as they are.

  `Demo.Run()` exports two contacts in each format and returns the printed lines. The output must stay exactly the same, so `Demo.Run()` is now where the formats are created and handed to the exporter.
hints:
  - "The only thing that differs between the formats is the line printed for one contact. So the shared shape is one method, for example an interface `IContactFormat` with `string Line(Contact contact)`."
  - "Write one class per format (CSV, mail, label) and move each `case` body into its `Line` method. `ContactExporter` then loops over the contacts and asks its format for each line."
  - "Give `ContactExporter` the format, for example through its constructor, and drop the `ExportFormat` parameter from `Export`. In `Demo.Run()`, export with the CSV, mail and label formats in that order."
checks:
  output-unchanged:
    title: Program output is unchanged
    failures:
      outputChanged: "Line {{line}} of the output changed. Expected \"{{expected}}\", got \"{{actual}}\"."
  exporter-does-not-branch-on-format:
    title: ContactExporter does not choose the format itself
    failures:
      exporterSwitches: "`ContactExporter` still contains a `switch`. Each format's lines should come from the format it was given, not from a branch."
      exporterNamesEnum: "`ContactExporter` still mentions `ExportFormat`. It should be handed a format, not a kind to branch on."
      exporterChecksType: "`ContactExporter` calls `GetType`. It should not check which format it was given."
  exporter-knows-no-format-class:
    title: ContactExporter names no format class
    failures:
      exporterNamesFormat: "The `ContactExporter` class mentions `{{type}}`. Create the formats outside it, in `Demo.Run()`, and hand them over."
