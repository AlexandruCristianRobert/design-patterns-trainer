title: Finish the frame shop's orders
scenario: |
  A picture framing shop makes every frame in the same steps and the same order: measure the picture, cut the moulding, fit the glazing, assemble the frame, and last an extra step that only some kinds of frame have. `FrameOrder.Make()` makes one frame and returns one line per step. `CutMoulding` and `FitGlazing` are `protected abstract`, so every kind of frame fills them in, and `Extra` is a `protected virtual` hook whose default returns an empty string. Leave these declarations, and `WoodFrame`, as they are.

  Finish the rest:
  - `Make` returns, in this order: `measure the picture`, the line of `CutMoulding()`, the line of `FitGlazing()`, `assemble and fit the hanging wire`, and last the line of `Extra()`, but only when it is not an empty string.
  - `MetalFrame` adds the extra step `add corner protectors` by overriding `Extra`.

  `Make` is written once, in `FrameOrder`, and works for every kind of frame, including ones the shop adds later. It stays non-virtual, no kind of frame declares its own `Make`, and `FrameOrder` never names `WoodFrame` or `MetalFrame`.

  So a wooden frame gives `measure the picture`, `cut oak moulding`, `fit glass` and `assemble and fit the hanging wire`, with no extra line.
hints:
  - "In `Make`, add the lines in order: `\"measure the picture\"`, then `CutMoulding()`, then `FitGlazing()`, then `\"assemble and fit the hanging wire\"`."
  - "Call `Extra()` and keep what it returns in a local variable. Add it to the list only when it is not `\"\"`, so a frame that keeps the default gets no extra line."
  - "In `MetalFrame`, add `protected override string Extra() => \"add corner protectors\";`."
checks:
  make-runs-every-step-in-order:
    title: Make runs every step in the fixed order, for any kind of frame
    failures:
      wrongLines: "A kind of frame the program has never seen got the lines \"{{actual}}\". Expected \"{{expected}}\"."
  no-extra-by-default:
    title: A frame that keeps the default Extra gets no extra line
    failures:
      defaultExtraAdded: "A wooden frame, which keeps the default `Extra`, gave \"{{actual}}\". Expected \"{{expected}}\": the default `Extra` is empty, and an empty line is left out."
  metal-frame-lines:
    title: A metal frame adds corner protectors through Extra
    failures:
      wrongMetal: "A metal frame gave \"{{actual}}\". Expected \"{{expected}}\"."
      extraNotOverridden: "`MetalFrame` does not override `Extra`. Its corner protectors are its extra step: add `protected override string Extra()`."
  the-order-is-fixed-in-frame-order:
    title: The order is written once, in FrameOrder, and no kind of frame can change it
    failures:
      noMake: "`FrameOrder` no longer declares `Make()`."
      makeOverridable: "`FrameOrder.Make` is virtual or abstract, so a kind of frame could change the order of the steps. Leave it non-virtual."
      makeRedeclared: "`{{type}}` declares its own `Make`. The order of the steps is written once, in `FrameOrder`."
      namesAKind: "`FrameOrder` names `{{type}}`, so it decides something for one kind of frame. Each kind of frame fills in its own steps instead."
