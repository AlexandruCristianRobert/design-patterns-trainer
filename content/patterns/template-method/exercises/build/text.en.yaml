title: Inspect every kind of beehive in the same order
scenario: |
  A beekeeping club keeps three kinds of hive, and its app lists the steps of an inspection. Every inspection follows the same order, and only a few steps depend on the kind of hive. Build it as Template Method:
  - `HiveInspection` is a base class, abstract or not, with `public List<string> Inspect(int temperature)`, which returns one line per step. When the temperature is below the hive's minimum, the bees must not be disturbed, and the only line is `too cold at 12 degrees: inspect another day`, with the temperature in it. Otherwise the lines are, in this order: `smoke the entrance`, the line for opening the hive, the line for checking the comb, `look for the queen and her eggs`, the feeding line, when the hive has one, and `close the hive and write the notes`.
  - `Inspect` is written once, in `HiveInspection`, and no kind of hive can change it: it is not virtual (a `sealed override` works too).
  - `HiveInspection` declares `MinimumTemperature`, `OpenUp` and `CheckComb` as abstract or virtual members, a method or a property each, and `Inspect` asks them for the minimum and for the two lines. It also declares `Feed`, a virtual member with a default that adds no line.
  - `LangstrothHive`, `TopBarHive` and `WarreHive` derive from `HiveInspection`, each with a public constructor without parameters. Each one overrides `MinimumTemperature`, `OpenUp` and `CheckComb`, and none of them declares its own `Inspect`. A `LangstrothHive` is inspected from 14 degrees, opens with `lift the lid` and checks `check 10 frames`. A `TopBarHive` is inspected from 17 degrees, opens with `lift the roof` and checks `check the bars one by one`. A `WarreHive` is inspected from 15 degrees, opens with `lift the quilt box` and checks `check the lowest box only`.
  - Only the `TopBarHive` is fed: it overrides `Feed` with `top up the sugar syrup`. The other two keep the default.
  - `HiveInspection` never names `LangstrothHive`, `TopBarHive` or `WarreHive`.

  So a `WarreHive` at 14 degrees gives only `too cold at 14 degrees: inspect another day`, and at 15 degrees it gives five lines, from `smoke the entrance` to `close the hive and write the notes`.
hints:
  - "Start `Inspect` with the minimum: `if (temperature < MinimumTemperature) return [...];`. A `protected abstract int MinimumTemperature { get; }` lets every kind of hive answer it."
  - "The shared lines are plain strings in `Inspect`. Only `OpenUp()`, `CheckComb()` and `Feed()` come from the kind of hive."
  - "Give `Feed` the default `protected virtual string Feed() => \"\";`, and add its line only when it is not empty. `TopBarHive` is the only class that overrides it."
checks:
  each-hive-is-inspected-in-order:
    title: Each kind of hive is inspected in the fixed order
    failures:
      wrongLines: "A `{{hive}}` at {{temperature}} degrees gave \"{{actual}}\". Expected \"{{expected}}\"."
  too-cold-stops-before-the-smoke:
    title: Below the hive's minimum, the inspection stops before the first step
    failures:
      notStopped: "A `{{hive}}` at {{temperature}} degrees gave \"{{actual}}\". Expected only \"{{expected}}\": it is below the hive's minimum."
      stoppedTooSoon: "A `{{hive}}` at {{temperature}} degrees, its minimum, gave \"{{actual}}\". Expected \"{{expected}}\": at the minimum, the hive is inspected."
  only-the-top-bar-hive-is-fed:
    title: Feed adds nothing by default, and only the top-bar hive overrides it
    failures:
      noFeed: "`HiveInspection` declares no `Feed`. It should declare the feeding step, with a default that adds no line."
      feedNotOptional: "`HiveInspection.Feed` is abstract or not virtual. Make it `virtual` with a default that adds no line, so a kind of hive may override it and does not have to."
      topBarNotFed: "`TopBarHive` does not override `Feed`. Topping up the sugar syrup is its feeding step."
      defaultNotKept: "A `{{hive}}` at 22 degrees gave {{actual}} lines: \"{{lines}}\". Expected {{expected}}: with the default `Feed`, no feeding line is added."
  the-order-is-written-once:
    title: The order is written once, in HiveInspection, and each kind fills in only its own steps
    failures:
      noInspect: "`HiveInspection` does not declare `Inspect(int temperature)` itself."
      inspectOverridable: "`HiveInspection.Inspect` is virtual or abstract, so a kind of hive could change the order. Make it non-virtual, or a `sealed override`."
      notAnInspection: "`{{type}}` does not derive from `HiveInspection`."
      inspectRedeclared: "`{{type}}` declares its own `Inspect`. The steps and their order are written once, in `HiveInspection`."
      stepNotOverridden: "`{{type}}` does not override `{{step}}`. Each kind of hive fills in its own `{{step}}`."
      namesAKind: "`HiveInspection` names `{{type}}`, so it decides something for one kind of hive. Let that kind override its own steps instead."
