question: finally-after-return-value
setup:
  id: setup
  title: A method returns a field, and its finally changes that field
  steps:
    - id: create
      caption: '`new Box()` creates an object whose field `Value` starts at 1.'
    - id: call
      caption: '`box.Next()` runs. Its `try` block says `return Value;` and its `finally` block says `Value++;`.'
    - id: question
      caption: The program prints what `Next()` returns, then `box.Value`. What are the two lines?
reality:
  title: The return value is saved before finally runs
  stages:
    - id: return-then-finally
      title: box.Next() step by step
      steps:
        - id: create
          caption: '`new Box()` creates an object whose field `Value` is 1.'
        - id: evaluate
          caption: '`return Value;` reads the field now and saves the result, 1, as the value to return.'
        - id: finally
          caption: Leaving the `try` runs the `finally` block. `Value++` changes the field to 2; the saved 1 is a separate copy and does not change.
        - id: return
          caption: '`Next()` returns the saved 1, and the first line prints `1`.'
        - id: read-field
          caption: '`box.Value` reads the field, which the `finally` changed to 2. The second line prints `2`.'
claims:
  - option: 1
    claim:
      id: read-after-finally-claim
      title: The return value is read after finally
      steps:
        - id: evaluate
          caption: 'The claim: `return Value;` only marks the exit; the field is not read yet.'
        - id: finally
          caption: The `finally` block runs and `Value++` changes the field to 2.
        - id: return
          caption: 'The claim: the method reads `Value` as it leaves and returns 2, so the first line prints `2`.'
        - id: read-field
          caption: '`box.Value` is 2, and the second line prints `2`.'
    reality:
      id: read-after-finally-reality
      title: What really happens
      steps:
        - id: evaluate
          caption: '`return Value;` evaluates its expression before anything else and saves 1.'
        - id: finally
          caption: The `finally` block runs and `Value++` changes the field to 2. The saved 1 is not touched.
        - id: return
          caption: The method returns the saved 1, so the first line prints `1`.
        - id: read-field
          caption: '`box.Value` is 2, and the second line prints `2`.'
  - option: 2
    claim:
      id: finally-skipped-claim
      title: The field is still 1 afterwards
      steps:
        - id: evaluate
          caption: '`return Value;` reads the field and saves 1.'
        - id: return
          caption: 'The claim: the method leaves with 1 and `Value` stays 1, as if the `finally` increment never took effect.'
        - id: read-field
          caption: 'The claim: `box.Value` is still 1, so the second line prints `1`.'
    reality:
      id: finally-skipped-reality
      title: What really happens
      steps:
        - id: evaluate
          caption: '`return Value;` reads the field and saves 1.'
        - id: return
          caption: A `finally` block always runs when its `try` exits, including through `return`. `Value++` changes the field to 2 before the method returns 1.
        - id: read-field
          caption: '`box.Value` is 2, so the second line prints `2`.'
  - option: 3
    claim:
      id: two-increments-claim
      title: Next returns 2 and the field ends at 3
      steps:
        - id: return
          caption: 'The claim: `Next()` returns 2, so the field was already incremented when the return value was taken.'
        - id: read-field
          caption: 'The claim: `box.Value` then reads 3, which means the field was incremented a second time.'
    reality:
      id: two-increments-reality
      title: What really happens
      steps:
        - id: return
          caption: The return value, 1, was saved before the `finally` ran. The single `Value++` happens after that, so `Next()` returns 1.
        - id: read-field
          caption: '`Next()` is called once, so `Value++` runs once. `box.Value` is 2.'
