question: password-storage-kdf
setup:
  id: setup
  title: Storing a password at sign-up
  steps:
    - id: signup
      caption: A user signs up with a password, and the application writes a row for them into the `Users` table.
    - id: question
      caption: What should the application store for the password?
reality:
  title: A slow, salted key-derivation function, such as PBKDF2
  stages:
    - id: hash
      title: Identity's PasswordHasher
      steps:
        - id: salt
          caption: Alice and Bob choose the same password. `PasswordHasher` makes a new random 16-byte salt for each of them.
        - id: derive
          caption: PBKDF2 with HMAC-SHA512 runs 100,000 iterations over the password and the salt, the .NET 8 default. Different salts give different hashes for the same password.
        - id: store
          caption: The stored value carries a format marker, the algorithm, the iteration count, the salt and the hash. The password itself is never stored.
        - id: verify
          caption: At sign-in, `VerifyHashedPassword` reruns PBKDF2 with the stored salt and count and compares the result.
        - id: leak
          caption: If the table leaks, every guess costs 100,000 HMAC-SHA512 iterations, and it must be repeated for each salt.
claims:
  - option: 1
    claim:
      id: sha-claim
      title: Salted SHA-256
      steps:
        - id: store
          caption: Each user gets a random salt, and the application stores SHA-256 of the salt and the password.
        - id: safe
          caption: 'The claim: this is safe, because SHA-256 has no known collisions.'
    reality:
      id: sha-reality
      title: What really happens
      steps:
        - id: store
          caption: Each user gets a random salt, and the application stores SHA-256 of the salt and the password.
        - id: leak
          caption: An attacker with the leaked table needs no collision. They hash guesses with the stored salt and compare.
        - id: fast
          caption: SHA-256 is designed to be fast, so GPUs test billions of guesses per second. The salt does not make a single guess slower.
  - option: 2
    claim:
      id: aes-claim
      title: Encrypting with a key in Key Vault
      steps:
        - id: store
          caption: Each password is encrypted with AES, using a key kept in Azure Key Vault.
        - id: recover
          caption: 'The claim: support staff can decrypt it and recover a forgotten password, so this is how passwords should be stored.'
    reality:
      id: aes-reality
      title: What really happens
      steps:
        - id: store
          caption: Each password is encrypted with AES, using a key kept in Azure Key Vault.
        - id: reverse
          caption: Encryption is reversible by design. Anyone who gets the key, or can call the code that uses it, gets every password in plain text.
        - id: reset
          caption: Passwords must be hashed one way. A forgotten password is reset, never recovered.
  - option: 3
    claim:
      id: hmac-claim
      title: HMAC with a secret key, no salt
      steps:
        - id: store
          caption: The application stores HMAC-SHA256 of the password, with a secret server-side key and no salt.
        - id: tables
          caption: 'The claim: the secret key already defeats rainbow tables, so no salt is needed.'
    reality:
      id: hmac-reality
      title: What really happens
      steps:
        - id: store
          caption: Without a salt, Alice and Bob, who chose the same password, get the same stored value.
        - id: key
          caption: A secret key, or pepper, adds defence in depth. But HMAC-SHA256 is fast, so once the key is stolen, brute force is cheap.
