question: distinctby-first-wins-record-vs-class
setup:
  id: setup
  title: Three arrays, one DistinctBy and two Distinct calls
  steps:
    - id: orders
      caption: '`orders` holds three `Order` records. Orders 1 and 3 have the same customer, `"Ana"`. The first line prints the ids `DistinctBy(o => o.Customer)` keeps.'
    - id: tags-items
      caption: '`tags` holds two `Tag("x")` records, and `items` holds two `Item("x")` objects of a plain class. The next lines print how many elements `Distinct()` keeps.'
    - id: print
      caption: What does the program print?
reality:
  title: DistinctBy keeps the first per key; Distinct uses each type's own equality
  stages:
    - id: distinct-by
      title: orders.DistinctBy(o => o.Customer)
      steps:
        - id: first
          caption: '`DistinctBy` reads the orders in order. Order 1 has a new key, `"Ana"`, so it is kept.'
        - id: second
          caption: Order 2 has a new key, `"Ben"`, so it is kept too.
        - id: third
          caption: Order 3's key, `"Ana"`, has been seen already. `DistinctBy` keeps the first element for each key and skips later ones, so order 3 is dropped.
        - id: print
          caption: The first line prints `1,2`.
    - id: distinct
      title: Distinct() on a record and on a class
      steps:
        - id: tag-1
          caption: '`Distinct` compares with `EqualityComparer<T>.Default`. The first `Tag("x")` is new, so it is kept.'
        - id: tag-2
          caption: A record gets value equality generated by the compiler. The second `Tag("x")` equals the first, so it is skipped and the count is `1`.
        - id: item-1
          caption: The first `Item("x")` is new, so it is kept.
        - id: item-2
          caption: '`Item` is a plain class with no `Equals` override, so it compares by reference. The second `Item` is a different object, so it is kept and the count is `2`.'
claims:
  - option: 1
    claim:
      id: last-claim
      title: Order 3 is in the result
      steps:
        - id: keep
          caption: 'The claim: order 3, the later `"Ana"` order, ends up in the result of `DistinctBy`.'
        - id: print
          caption: 'The claim: the program prints `1,3`, then `1`, then `2`.'
    reality:
      id: last-reality
      title: What really happens
      steps:
        - id: first
          caption: '`DistinctBy` keeps the first element it sees for each key. Order 1 is kept for `"Ana"`.'
        - id: skip
          caption: When order 3 arrives, `"Ana"` has been seen, so order 3 is skipped. Orders 1 and 3 share a key, so they can never both be kept. The line prints `1,2`.
  - option: 2
    claim:
      id: class-claim
      title: Distinct compares a class's property values
      steps:
        - id: compare
          caption: 'The claim: `Distinct` compares the property values of any class. Both `Item` objects have `Name` `"x"`, so they are equal.'
        - id: print
          caption: 'The claim: one `Item` is kept, and the program prints `1,2`, then `1`, then `1`.'
    reality:
      id: class-reality
      title: What really happens
      steps:
        - id: reference
          caption: '`Item` does not override `Equals`, so `Distinct` falls back to reference equality. The two `Item` objects are different objects.'
        - id: count
          caption: Both are kept, so the last line prints `2`. Pass an `IEqualityComparer<Item>` or use `DistinctBy(i => i.Name)` to compare by name.
  - option: 3
    claim:
      id: record-claim
      title: Records compare by reference
      steps:
        - id: compare
          caption: 'The claim: records compare by reference like classes, so the two `Tag("x")` objects are not equal.'
        - id: print
          caption: 'The claim: both tags are kept, and the program prints `1,2`, then `2`, then `2`.'
    reality:
      id: record-reality
      title: What really happens
      steps:
        - id: equals
          caption: A record overrides `Equals` and `GetHashCode` to compare its members. Both tags have `Name` `"x"`, so they are equal.
        - id: count
          caption: '`Distinct` keeps one tag, so the second line prints `1`.'
