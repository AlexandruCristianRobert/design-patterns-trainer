- id: transactional-outbox
  question: |
    An order service saves an order to its database and then publishes an `OrderPlaced` event to a message broker. What problem does the Transactional Outbox pattern solve here?
  options:
    - text: The save and the publish are not atomic, so a crash right after the save loses the event.
      correct: true
      explanation: |
        The database and the broker cannot share one local transaction, so a crash after the commit but before the publish loses the event (and publishing first could instead announce an order whose save then fails). With an outbox, the service writes the event to an outbox table in the *same* database transaction as the order, and a separate relay publishes outbox rows to the broker and marks them as sent. The relay may publish an event more than once, so delivery is at least once and consumers must be idempotent.
    - text: It guarantees exactly-once delivery, so consumers no longer need to handle duplicate messages.
      explanation: |
        The relay can crash after publishing but before marking the row as sent, and then it publishes again. The outbox gives at-least-once delivery, so consumers still need to deduplicate or be idempotent.
    - text: It coordinates the database and the broker with a two-phase commit, so both commit or both roll back.
      explanation: |
        Avoiding distributed transactions is the point of the pattern. Most brokers do not support two-phase commit, and it couples the availability of both systems. The outbox uses only a local database transaction.
    - text: It batches events in memory and publishes them every few seconds, to reduce the load on the broker.
      explanation: |
        An in-memory buffer would lose events on a crash, which is the very problem to solve. The outbox stores events durably in the database; any batching by the relay is incidental.

- id: idempotency-key-post
  question: |
    Why do payment APIs ask clients to send an `Idempotency-Key` header with each `POST` request?
  options:
    - text: So that a retried `POST` returns the stored result of the first attempt instead of charging twice.
      correct: true
      explanation: |
        `POST` is not idempotent, and a client that times out cannot know whether the first request succeeded. The server stores the outcome under the client-chosen key, and when a request with the same key arrives again it returns that stored response instead of executing the operation again. This makes retries safe.
    - text: So that HTTP caches and CDNs can cache `POST` responses, which they would otherwise never store.
      explanation: |
        The header is processed by the API itself, not by caches. Shared caches do not serve stored responses for `POST` requests based on a custom header like this.
    - text: As an anti-CSRF token that proves the request was sent by a page the API itself served.
      explanation: |
        A CSRF token is issued by the server and tied to the user's session. An idempotency key is generated by the client per operation, and its job is deduplicating retries, not authenticating where a request came from.
    - text: So that the load balancer sends every retry of a request to the same server instance that handled the first one.
      explanation: |
        Sticky routing would not help: the instance could have crashed, and the deduplication must survive that. Servers store the keys in shared, durable storage so that any instance can recognise a retry.
